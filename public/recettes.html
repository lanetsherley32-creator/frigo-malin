<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mes Recettes</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 10px; background: #f4f4f9; color: #333; }
        h1, h2 { font-size: 1.5rem; color: #2c3e50; }
        .nav { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 20px; padding-bottom: 5px; }
        .nav a { white-space: nowrap; text-decoration: none; color: #007bff; font-weight: bold; font-size: 0.9rem; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        form label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        form input, form textarea, form select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 10px; font-weight: bold; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-warning { background: #ffc107; color: #333; }
        
        .recette-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #007bff; }
        .badge { background: #e9ecef; padding: 4px 8px; border-radius: 15px; font-size: 0.75rem; display: inline-block; margin: 2px; }
        .ingredient-row { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
        .ingredient-row select { flex: 2; margin: 0; }
        .ingredient-row input { flex: 1; margin: 0; }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="ingredients.html">Ingrédients</a>
        <a href="recettes.html">Recettes</a>
        <a href="semaine.html">Semaine</a>
        <a href="courses.html">Courses</a>
    </nav>

    <h1 id="titre-formulaire">🍳 Ajouter une recette</h1>

    <div class="card">
        <form id="form-recette">
            <input type="hidden" id="recette-id">
            <label>Nom :</label>
            <input type="text" id="nom" required>

            <label>Étapes de préparation :</label>
            <textarea id="etapes" rows="3"></textarea>

            <label>Catégories (Sélection multiple : Ctrl+Clic sur PC ou appui multiple sur mobile) :</label>
            <select id="categorie" multiple style="height: 120px; background: #fff;">
                <option value="Petit déj">Petit déj</option>
                <option value="Repas froid">Repas froid</option>
                <option value="Encas">Encas</option>
                <option value="Dessert">Dessert</option>
                <option value="Repas chaud">Repas chaud</option>
            </select>

            <label>Parts :</label>
            <input type="number" id="parts" value="4" min="1" oninput="calculerTotaux()">

            <label>Ingrédients :</label>
            <div id="liste-ingredients-container"></div>
            <button type="button" class="btn btn-secondary" onclick="ajouterLigneIngredient()">+ Ajouter ingrédient</button>

            <!-- Affichage automatique des coûts et apports -->
            <div style="background: #eef2f7; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 0.95rem; line-height: 1.5;">
                💰 Coût total : <span id="calc-cout-total">0.00</span>€ | 👤 Coût/part : <strong><span id="calc-cout-part">0.00</span>€</strong><br>
                🔥 Calories : <span id="calc-calories">0</span> kcal<br>
                💪 Protéines : <span id="calc-proteines">0</span>g | 🍞 Glucides : <span id="calc-glucides">0</span>g | 🥑 Lipides : <span id="calc-lipides">0</span>g
            </div>
            
            <!-- Champs cachés pour l'enregistrement en base -->
            <input type="hidden" id="cout">
            <input type="hidden" id="calories">
            <input type="hidden" id="proteines">
            <input type="hidden" id="glucides">
            <input type="hidden" id="lipides">

            <button type="submit" class="btn btn-success" id="btn-submit">Enregistrer</button>
            <button type="button" class="btn btn-secondary" id="btn-annuler" style="display:none;" onclick="reinitialiserFormulaire()">Annuler</button>
        </form>
    </div>

    <h2>Vos recettes</h2>
    <div id="container-recettes"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let tousLesIngredients = [];

        function chargerIngredientsDisponibles(cb) {
            fetch('/api/ingredients')
                .then(res => res.json())
                .then(data => { 
                    tousLesIngredients = data; 
                    if(cb) cb(); 
                });
        }

        function ajouterLigneIngredient(idIng = "", quantite = "") {
            const div = document.createElement('div'); 
            div.className = 'ingredient-row';
            
            let options = '<option value="">-- Ingrédient --</option>';
            tousLesIngredients.forEach(i => {
                options += `<option value="${i.id}" ${i.id == idIng ? 'selected' : ''}>${i.nom} (${i.marque || 'Générique'})</option>`;
            });

            div.innerHTML = `
                <select class="ing-select" onchange="calculerTotaux()">${options}</select>
                <input type="number" step="0.1" class="ing-qte" placeholder="g ou ml" value="${quantite}" oninput="calculerTotaux()">
                <button type="button" class="btn btn-danger" style="width:auto; margin:0; padding:10px;" onclick="this.parentElement.remove(); calculerTotaux();">X</button>
            `;
            document.getElementById('liste-ingredients-container').appendChild(div);
        }

        // Calcul automatique du coût et des apports nutritionnels basés sur 100g
        function calculerTotaux() {
            let coutTotal = 0;
            let totalCal = 0, totalPro = 0, totalGlu = 0, totalLip = 0;
            const parts = parseInt(document.getElementById('parts').value) || 1;

            document.querySelectorAll('.ingredient-row').forEach(row => {
                const select = row.querySelector('.ing-select');
                const qteInput = row.querySelector('.ing-qte');
                const ingId = select.value;
                const qte = parseFloat(qteInput.value) || 0;

                if (ingId && qte > 0) {
                    const ing = tousLesIngredients.find(i => i.id == ingId);
                    if (ing) {
                        // Coût
                        const prixRef = ing.prixLeclerc || ing.prixCarrefour || ing.prixLidl || 0;
                        coutTotal += (prixRef * qte) / 100;

                        // Apports nutritionnels (proportionnels pour 100g)
                        totalCal += (ing.calories * qte) / 100;
                        totalPro += (ing.proteines * qte) / 100;
                        totalGlu += (ing.glucides * qte) / 100;
                        totalLip += (ing.lipides * qte) / 100;
                    }
                }
            });

            // Affichage UI
            document.getElementById('calc-cout-total').innerText = coutTotal.toFixed(2);
            document.getElementById('calc-cout-part').innerText = (coutTotal / parts).toFixed(2);
            document.getElementById('calc-calories').innerText = totalCal.toFixed(0);
            document.getElementById('calc-proteines').innerText = totalPro.toFixed(1);
            document.getElementById('calc-glucides').innerText = totalGlu.toFixed(1);
            document.getElementById('calc-lipides').innerText = totalLip.toFixed(1);

            // Stockage champs cachés
            document.getElementById('cout').value = coutTotal.toFixed(2);
            document.getElementById('calories').value = totalCal.toFixed(0);
            document.getElementById('proteines').value = totalPro.toFixed(1);
            document.getElementById('glucides').value = totalGlu.toFixed(1);
            document.getElementById('lipides').value = totalLip.toFixed(1);
        }

        document.getElementById('form-recette').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('recette-id').value;
            
            // Récupération sécurisée de toutes les catégories sélectionnées dans le menu multiple
            const selectCat = document.getElementById('categorie');
            const cats = Array.from(selectCat.selectedOptions).map(opt => opt.value);
            
            let ingredientsTexte = [];
            document.querySelectorAll('.ingredient-row').forEach(row => {
                const s = row.querySelector('.ing-select');
                const qte = row.querySelector('.ing-qte').value;
                if(s.selectedIndex > 0) {
                    ingredientsTexte.push(`${s.options[s.selectedIndex].text} (${qte}g)`);
                }
            });

            const data = {
                nom: document.getElementById('nom').value,
                categorie: cats.join(', '),
                parts: parseInt(document.getElementById('parts').value),
                ingredients: ingredientsTexte.join(', '),
                etapes: document.getElementById('etapes').value,
                cout: parseFloat(document.getElementById('cout').value) || 0,
                calories: parseFloat(document.getElementById('calories').value) || 0,
                proteines: parseFloat(document.getElementById('proteines').value) || 0,
                glucides: parseFloat(document.getElementById('glucides').value) || 0,
                lipides: parseFloat(document.getElementById('lipides').value) || 0
            };

            fetch(id ? `/api/recettes/${id}` : '/api/recettes', {
                method: id ? 'PUT' : 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(() => { 
                reinitialiserFormulaire(); 
                chargerRecettes(); 
            });
        });

        function chargerRecettes() {
            fetch('/api/recettes')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('container-recettes').innerHTML = data.map(r => `
                        <div class="recette-card">
                            <h3>${r.nom}</h3>
                            <p>${r.categorie ? r.categorie.split(',').map(c => `<span class="badge">${c.trim()}</span>`).join('') : ''}</p>
                            <p><strong>Parts :</strong> ${r.parts} | <strong>Coût/part :</strong> ${r.parts ? (r.cout/r.parts).toFixed(2) : r.cout}€</p>
                            <p><strong>Calories :</strong> ${r.calories || 0} kcal | <strong>Pro:</strong> ${r.proteines || 0}g, <strong>Glu:</strong> ${r.glucides || 0}g, <strong>Lip:</strong> ${r.lipides || 0}g</p>
                            <p><strong>Ingrédients :</strong> ${r.ingredients || 'Aucun'}</p>
                            <button class="btn btn-warning" onclick='preparerModification(${JSON.stringify(r)})'>Modifier</button>
                            <button class="btn btn-danger" onclick="supprimerRecette(${r.id})">Supprimer</button>
                        </div>
                    `).join('');
                });
        }

        function preparerModification(r) {
            document.getElementById('recette-id').value = r.id;
            document.getElementById('nom').value = r.nom;
            document.getElementById('parts').value = r.parts;
            document.getElementById('cout').value = r.cout;
            document.getElementById('etapes').value = r.etapes || '';
            
            // Sélectionner les options multiples correspondantes
            const selectCat = document.getElementById('categorie');
            const cats = r.categorie ? r.categorie.split(',').map(c => c.trim()) : [];
            Array.from(selectCat.options).forEach(opt => {
                opt.selected = cats.includes(opt.value);
            });

            document.getElementById('titre-formulaire').innerText = "✏️ Modifier la recette";
            document.getElementById('btn-submit').innerText = "Mettre à jour";
            document.getElementById('btn-annuler').style.display = "block";
            
            calculerTotaux();
            window.scrollTo(0, 0);
        }

        function reinitialiserFormulaire() {
            document.getElementById('form-recette').reset();
            document.getElementById('recette-id').value = "";
            const selectCat = document.getElementById('categorie');
            Array.from(selectCat.options).forEach(opt => opt.selected = false);
            
            document.getElementById('titre-formulaire').innerText = "🍳 Ajouter une recette";
            document.getElementById('btn-submit').innerText = "Enregistrer";
            document.getElementById('btn-annuler').style.display = "none";
            document.getElementById('liste-ingredients-container').innerHTML = '';
            ajouterLigneIngredient();
            calculerTotaux();
        }

        function supprimerRecette(id) {
            if(confirm("Supprimer cette recette ?")) {
                fetch(`/api/recettes/${id}`, { method: 'DELETE' }).then(chargerRecettes);
            }
        }

        chargerIngredientsDisponibles(() => {
            ajouterLigneIngredient();
            chargerRecettes();
        });

        socket.on('data_updated', chargerRecettes);
    </script>
</body>
</html>
