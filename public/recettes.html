<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Recettes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        h1 { color: #333; }
        .recette-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav">
        <a href="index.html">Accueil</a>
        <a href="ingredients.html">Ingrédients</a>
        <a href="recettes.html">Recettes</a>
    </div>

    <h1>🍳 Mes Recettes</h1>

    <div id="container-recettes">
        <p>Chargement des recettes...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function chargerRecettes() {
            fetch('/api/recettes')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('container-recettes');
                    if (data.length === 0) {
                        container.innerHTML = '<p>Aucune recette pour le moment.</p>';
                        return;
                    }
                    container.innerHTML = data.map(r => `
                        <div class="recette-card">
                            <h3>${r.nom} (${r.categorie})</h3>
                            <p><strong>Parts :</strong> ${r.parts} | <strong>Coût :</strong> ${r.cout} €</p>
                            <p><strong>Ingrédients :</strong> ${r.ingredients}</p>
                            <p><strong>Calories :</strong> ${r.calories} kcal</p>
                        </div>
                    `).join('');
                })
                .catch(err => {
                    console.error("Erreur chargement recettes:", err);
                });
        }

        chargerRecettes();
        socket.on('data_updated', chargerRecettes);
    </script>
</body>
</html>
