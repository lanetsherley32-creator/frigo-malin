<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Recettes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4">
        
        <!-- Navigation -->
        <header class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🍲 Gestion des Recettes</h1>
            <nav class="grid grid-cols-5 gap-1 text-center text-xs font-medium">
                <a href="index.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
            </nav>
        </header>

        <!-- Formulaire Recette -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 id="form-title" class="font-bold text-slate-700 text-sm">➕ Ajouter ou modifier une recette</h2>
            <form id="form-recette" onsubmit="sauvegarderRecette(event)" class="space-y-4 text-xs">
                <input type="hidden" id="recette-id">
                
                <div class="space-y-1.5">
                    <label class="font-bold text-slate-700 text-xs">Nom de la recette :</label>
                    <input type="text" id="nom" placeholder="Ex: Tarte aux pommes" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium" required>
                </div>

                <!-- Valeurs nutritionnelles -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                    <span class="block font-bold text-slate-700 text-xs">Valeurs nutritionnelles totales :</span>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Calories (kcal)</label>
                            <input type="number" step="any" id="calories" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Protéines (g)</label>
                            <input type="number" step="any" id="proteines" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Glucides (g)</label>
                            <input type="number" step="any" id="glucides" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Lipides (g)</label>
                            <input type="number" step="any" id="lipides" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-blue-600 active:bg-blue-700 text-white p-3 rounded-xl font-bold shadow-sm">Enregistrer la recette</button>
                    <button type="button" id="btn-annuler" onclick="reinitialiserFormulaire()" class="hidden bg-slate-200 active:bg-slate-300 text-slate-700 px-4 py-3 rounded-xl font-bold">Annuler</button>
                </div>
            </form>
        </section>

        <!-- Liste des Recettes -->
        <section class="space-y-3">
            <h2 class="font-bold text-slate-700 text-sm">📋 Liste des Recettes Enregistrées</h2>
            <div id="liste-recettes-container" class="space-y-2">
                <p class="text-slate-400 italic text-xs">Chargement...</p>
            </div>
        </section>
    </div>

    <script>
        let socket;
        try {
            socket = io();
            socket.on('data_updated', init);
        } catch (e) {
            console.warn("Socket.io non initialisé", e);
        }

        async function init() {
            try {
                const res = await fetch('/api/recettes');
                if (!res.ok) throw new Error("Erreur réseau");
                const recettes = await res.json();
                renderRecettes(recettes);
            } catch (err) {
                console.error("Erreur chargement recettes:", err);
                document.getElementById('liste-recettes-container').innerHTML = `<p class="text-rose-500 italic text-xs bg-white p-4 rounded-2xl border border-slate-200 text-center">Erreur de chargement des recettes.</p>`;
            }
        }

        async function sauvegarderRecette(e) {
            e.preventDefault();
            
            const id = document.getElementById('recette-id').value;
            const data = {
                nom: document.getElementById('nom').value.trim(),
                calories: parseFloat(document.getElementById('calories').value) || 0,
                proteines: parseFloat(document.getElementById('proteines').value) || 0,
                glucides: parseFloat(document.getElementById('glucides').value) || 0,
                lipides: parseFloat(document.getElementById('lipides').value) || 0
            };

            const url = id ? `/api/recettes/${id}` : '/api/recettes';
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const errData = await response.json();
                alert(errData.error || "Erreur lors de l'enregistrement");
                return;
            }

            reinitialiserFormulaire();
            init();
        }

        function renderRecettes(recettes) {
            const container = document.getElementById('liste-recettes-container');
            if (!recettes || recettes.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic text-xs bg-white p-4 rounded-2xl border border-slate-200 text-center">Aucune recette enregistrée.</p>`;
                return;
            }

            container.innerHTML = recettes.map(r => `
                <div class="bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
                    <div class="space-y-1">
                        <h3 class="font-bold text-slate-800 text-sm">${r.nom}</h3>
                        <p class="text-emerald-700 font-medium">🔥 ${r.calories || 0} kcal | P: ${r.proteines || 0}g | G: ${r.glucides || 0}g | L: ${r.lipides || 0}g</p>
                    </div>
                    <div class="flex gap-2 w-full sm:w-auto justify-end">
                        <button onclick='preparerModification(${JSON.stringify(r)})' class="bg-slate-100 active:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-bold">Modifier</button>
                        <button onclick="supprimerRecette(${r.id})" class="bg-rose-100 active:bg-rose-200 text-rose-600 px-3 py-1.5 rounded-xl font-bold">Supprimer</button>
                    </div>
                </div>
            `).join('');
        }

        function preparerModification(r) {
            document.getElementById('recette-id').value = r.id;
            document.getElementById('nom').value = r.nom || '';
            document.getElementById('calories').value = r.calories || 0;
            document.getElementById('proteines').value = r.proteines || 0;
            document.getElementById('glucides').value = r.glucides || 0;
            document.getElementById('lipides').value = r.lipides || 0;
            
            document.getElementById('form-title').innerText = "✏️ Modifier la recette";
            document.getElementById('btn-annuler').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function reinitialiserFormulaire() {
            document.getElementById('form-recette').reset();
            document.getElementById('recette-id').value = '';
            document.getElementById('form-title').innerText = "➕ Ajouter ou modifier une recette";
            document.getElementById('btn-annuler').classList.add('hidden');
        }

        async function supprimerRecette(id) {
            if (confirm("Voulez-vous vraiment supprimer cette recette ?")) {
                await fetch(`/api/recettes/${id}`, { method: 'DELETE' });
                init();
            }
        }

        init();
    </script>
</body>
</html>
