<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Semaine Simplifié</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-12">
    <div class="max-w-3xl mx-auto p-4 space-y-4">
        
        <!-- Header & Profil -->
        <header class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h1 class="font-bold text-slate-800 text-lg">🍽️ Mon Menu</h1>
                <select id="select-profil" onchange="changerProfil()" class="bg-blue-50 text-blue-700 font-bold px-3 py-1 rounded-xl text-xs border border-blue-100"></select>
            </div>
            
            <!-- Bilan Nutritionnel -->
            <div id="dashboard-nutri" class="grid grid-cols-4 gap-2 text-center text-[10px] sm:text-xs">
                <div class="bg-slate-50 p-2 rounded-xl">Kcal<br><strong id="stat-cal" class="text-slate-800">0</strong></div>
                <div class="bg-slate-50 p-2 rounded-xl">Prot<br><strong id="stat-prot" class="text-slate-800">0</strong>g</div>
                <div class="bg-slate-50 p-2 rounded-xl">Gluc<br><strong id="stat-gluc" class="text-slate-800">0</strong>g</div>
                <div class="bg-slate-50 p-2 rounded-xl">Lip<br><strong id="stat-lip" class="text-slate-800">0</strong>g</div>
            </div>
        </header>

        <!-- Sélecteur de jour -->
        <div class="flex gap-2 overflow-x-auto pb-2">
            <script>
                ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'].forEach(jour => {
                    document.write(`<button onclick="changerJour('${jour}')" id="btn-${jour}" class="px-4 py-2 rounded-xl text-xs font-bold bg-white border border-slate-200">${jour}</button>`);
                });
            </script>
        </div>

        <!-- Formulaire Unifié -->
        <form id="form-menu" onsubmit="sauvegarderMenu(event)" class="space-y-4">
            <div id="sections-repas" class="space-y-3">
                <!-- Les sections seront générées en JS -->
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm">Enregistrer la journée</button>
        </form>
    </div>

    <script>
        const socket = io();
        let jourActuel = 'Lundi';
        let recettes = [];

        async function init() {
            const res = await fetch('/api/recettes');
            recettes = await res.json();
            
            // Générer les 4 sections (Petit Déj, Repas 1, Repas 2, Dessert/Collation)
            const container = document.getElementById('sections-repas');
            const sections = [
                { id: 'petitDejeuner', label: '☕ Petit Déjeuner' },
                { id: 'repas1', label: '☀️ Repas 1' },
                { id: 'repas2', label: '🌙 Repas 2' },
                { id: 'dessertCollation', label: '🍎 Dessert / Collation' }
            ];

            container.innerHTML = sections.map(s => `
                <div class="bg-white p-4 rounded-2xl border border-slate-200">
                    <label class="block font-bold text-slate-700 text-xs mb-2 uppercase">${s.label}</label>
                    <select multiple id="${s.id}" class="w-full p-2 border border-slate-200 rounded-xl text-sm h-32">
                        ${recettes.map(r => `<option value="${r.id}">${r.nom}</option>`).join('')}
                    </select>
                </div>
            `).join('') + `
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
                <label class="block font-bold text-slate-700 text-xs mb-2 uppercase">🍫 Grignotage (libre)</label>
                <textarea id="grignotage" class="w-full p-2 border border-slate-200 rounded-xl text-sm" placeholder="Notes..."></textarea>
            </div>`;

            // Ajout des écouteurs pour calcul temps réel
            document.querySelectorAll('select').forEach(el => el.addEventListener('change', calculerNutris));
            
            chargerMenu();
        }

        async function chargerMenu() {
            const res = await fetch(`/api/menu?jour=${jourActuel}&profil=${localStorage.getItem('profil_actif')}`);
            const data = await res.json();
            
            // Sélectionner les options dans les selects multiples
            ['petitDejeuner', 'repas1', 'repas2', 'dessertCollation'].forEach(id => {
                const select = document.getElementById(id);
                const valeurs = data[id] || [];
                Array.from(select.options).forEach(opt => opt.selected = valeurs.includes(opt.value));
            });
            document.getElementById('grignotage').value = data.grignotage || '';
            calculerNutris();
        }

        function calculerNutris() {
            let cal=0, prot=0, gluc=0, lip=0;
            const ids = [];
            document.querySelectorAll('select').forEach(s => {
                Array.from(s.selectedOptions).forEach(o => ids.push(o.value));
            });

            ids.forEach(id => {
                const r = recettes.find(x => x.id == id);
                if(r) {
                    cal += parseFloat(r.calories);
                    prot += parseFloat(r.proteines);
                    gluc += parseFloat(r.glucides);
                    lip += parseFloat(r.lipides);
                }
            });

            document.getElementById('stat-cal').innerText = Math.round(cal);
            document.getElementById('stat-prot').innerText = Math.round(prot);
            document.getElementById('stat-gluc').innerText = Math.round(gluc);
            document.getElementById('stat-lip').innerText = Math.round(lip);
        }

        async function sauvegarderMenu(e) {
            e.preventDefault();
            const body = {
                jour: jourActuel,
                profil: localStorage.getItem('profil_actif'),
                petitDejeuner: Array.from(document.getElementById('petitDejeuner').selectedOptions).map(o => o.value),
                repas1: Array.from(document.getElementById('repas1').selectedOptions).map(o => o.value),
                repas2: Array.from(document.getElementById('repas2').selectedOptions).map(o => o.value),
                dessertCollation: Array.from(document.getElementById('dessertCollation').selectedOptions).map(o => o.value),
                grignotage: document.getElementById('grignotage').value
            };
            
            await fetch('/api/menu', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            alert("Enregistré !");
        }

        function changerJour(j) {
            jourActuel = j;
            chargerMenu();
        }

        init();
    </script>
</body>
</html>
