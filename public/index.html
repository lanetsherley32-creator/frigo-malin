<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planification des Menus & Profils</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4">
        
        <!-- Navigation Mobile Friendly -->
        <header class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">📅 Planification des Menus</h1>
            <nav class="grid grid-cols-5 gap-1 text-center text-xs font-medium">
                <a href="index.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Menu</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
            </nav>
        </header>

        <!-- Section Gestion des Profils -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-slate-700 text-sm">👤 Gestion des Profils & Objectifs</h2>
                <button type="button" onclick="toggleFormProfil()" id="btn-toggle-profil" class="bg-slate-100 active:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-bold text-xs">+ Créer</button>
            </div>

            <!-- Formulaire de création / modification de profil -->
            <form id="form-profil" onsubmit="sauvegarderProfil(event)" class="space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200 hidden text-xs">
                <input type="hidden" id="profil-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="text" id="profil-nom" placeholder="Nom du profil (ex: Sèche)" class="border border-slate-200 p-2.5 rounded-xl bg-white" required>
                    <input type="number" step="any" id="profil-budget" placeholder="Budget Semaine (€)" class="border border-slate-200 p-2.5 rounded-xl bg-white" required>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <input type="number" step="any" id="profil-kcal" placeholder="Calories visées" class="border border-slate-200 p-2.5 rounded-xl bg-white" required>
                    <input type="number" step="any" id="profil-prot" placeholder="Protéines (g)" class="border border-slate-200 p-2.5 rounded-xl bg-white" required>
                    <input type="number" step="any" id="profil-gluc" placeholder="Glucides (g)" class="border border-slate-200 p-2.5 rounded-xl bg-white" required>
                    <input type="number" step="any" id="profil-lip" placeholder="Lipides (g)" class="border border-slate-200 p-2.5 rounded-xl bg-white" required>
                </div>
                <div class="flex gap-2 pt-1">
                    <button type="submit" class="flex-1 bg-blue-600 active:bg-blue-700 text-white p-2.5 rounded-xl font-bold shadow-sm">Enregistrer le profil</button>
                    <button type="button" onclick="toggleFormProfil()" class="bg-slate-300 active:bg-slate-400 text-slate-700 px-4 p-2.5 rounded-xl font-bold">Annuler</button>
                </div>
            </form>

            <!-- Sélection du Profil Actif -->
            <div class="flex flex-col gap-3 bg-blue-50/50 p-3.5 rounded-xl border border-blue-100 text-xs">
                <div class="flex flex-col sm:flex-row items-center gap-2 w-full">
                    <label class="font-bold text-blue-900 whitespace-nowrap">Profil Actif :</label>
                    <select id="select-profil" onchange="changerProfilActif()" class="border border-blue-200 p-2.5 rounded-xl bg-white flex-1 font-medium w-full">
                        <option value="">-- Aucun profil --</option>
                    </select>
                    <div class="flex gap-1.5 w-full sm:w-auto">
                        <button type="button" onclick="preparerModificationProfil()" id="btn-edit-profil" class="flex-1 sm:flex-none bg-blue-600 active:bg-blue-700 text-white px-3 py-2 rounded-xl font-bold hidden">Modifier</button>
                        <button type="button" onclick="supprimerProfilActif()" id="btn-del-profil" class="flex-1 sm:flex-none bg-rose-500 active:bg-rose-600 text-white px-3 py-2 rounded-xl font-bold hidden">Supprimer</button>
                    </div>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-2 w-full pt-1">
                    <button onclick="genererMenuAleatoire()" class="flex-1 bg-emerald-600 active:bg-emerald-700 text-white p-2.5 rounded-xl font-bold shadow-sm">🎲 Générer Intelligemment</button>
                    <button onclick="sauvegarderMenu()" class="flex-1 bg-blue-600 active:bg-blue-700 text-white p-2.5 rounded-xl font-bold shadow-sm">💾 Enregistrer le menu</button>
                </div>
            </div>

            <!-- Affichage des apports visés -->
            <div id="profil-objectifs" class="text-xs text-blue-900 bg-slate-50 p-3 rounded-xl border border-slate-200 grid grid-cols-2 sm:grid-cols-5 gap-2 text-center font-medium">
                <div class="bg-white p-2 rounded-lg border border-slate-100">🔥 <span id="obj-kcal">0</span> kcal</div>
                <div class="bg-white p-2 rounded-lg border border-slate-100">🥩 <span id="obj-prot">0</span>g Prot</div>
                <div class="bg-white p-2 rounded-lg border border-slate-100">🍞 <span id="obj-gluc">0</span>g Gluc</div>
                <div class="bg-white p-2 rounded-lg border border-slate-100">🥑 <span id="obj-lip">0</span>g Lip</div>
                <div class="bg-white p-2 rounded-lg border border-slate-100 col-span-2 sm:col-span-1">💶 <span id="obj-budget">0</span> €</div>
            </div>
        </section>

        <!-- Tableau de la Semaine -->
        <section class="space-y-3">
            <h2 class="font-bold text-slate-700 text-sm">🍽️ Grille de la Semaine</h2>
            <div id="tableau-menu-body" class="space-y-3">
                <!-- Généré dynamiquement sous forme de cartes par jour -->
            </div>
        </section>

        <!-- Bilan Journalier Exact -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3 text-xs">
            <h2 class="font-bold text-slate-700 text-sm">📊 Suivi Journalier Exact</h2>
            <div id="tableau-suivi-journalier" class="space-y-2">
                <!-- Généré dynamiquement -->
            </div>
        </section>
    </div>

    <!-- Modale de sélection de recette -->
    <div id="modal-selection" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-3 hidden z-50">
        <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-xl max-w-sm w-full space-y-4 text-xs">
            <h3 class="font-bold text-sm text-slate-800" id="modal-titre-repas">Choisir une recette</h3>
            <select id="modal-select-recette" class="border border-slate-200 p-3 rounded-xl bg-slate-50 w-full font-medium">
                <!-- Options chargées dynamiquement -->
            </select>
            <div class="flex gap-2 pt-1">
                <button type="button" onclick="validerSelectionRecette()" class="flex-1 bg-blue-600 active:bg-blue-700 text-white p-3 rounded-xl font-bold shadow-sm">Valider</button>
                <button type="button" onclick="fermerModal()" class="bg-slate-300 active:bg-slate-400 text-slate-700 px-4 p-3 rounded-xl font-bold">Annuler</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let recettesGlobal = [];
        let profilsGlobal = [];
        let menuActuel = {};
        let celluleEnCours = null;

        const jours = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
        const repasTypes = [
            { key: "PetitDej", label: "Petit-déjeuner" },
            { key: "Repas1", label: "Repas 1" },
            { key: "Repas2", label: "Repas 2" },
            { key: "Collation", label: "Collation / Dessert" }
        ];

        async function init() {
            await chargerDonnees();
            chargerMenuStocke();
            renderTableauSemaine();
            mettreAJourAffichageObjectifs();
            calculerBilanJournalier();
        }

        async function chargerDonnees() {
            const resProfils = await fetch('/api/profils');
            profilsGlobal = await resProfils.json();
            renderProfils();

            const resRecettes = await fetch('/api/recettes');
            recettesGlobal = await resRecettes.json();
        }

        function renderProfils() {
            const select = document.getElementById('select-profil');
            const currentValue = select.value;

            select.innerHTML = profilsGlobal.length === 0 
                ? `<option value="">-- Aucun profil créé --</option>` 
                : profilsGlobal.map(p => `<option value="${p.id}" ${p.id == currentValue ? 'selected' : ''}>${p.nom}</option>`).join('');

            if (!select.value && profilsGlobal.length > 0) {
                select.value = profilsGlobal[0].id;
            }

            const hasProfils = profilsGlobal.length > 0;
            document.getElementById('btn-edit-profil').classList.toggle('hidden', !hasProfils);
            document.getElementById('btn-del-profil').classList.toggle('hidden', !hasProfils);
        }

        function toggleFormProfil() {
            const form = document.getElementById('form-profil');
            form.classList.toggle('hidden');
            if (!form.classList.contains('hidden')) {
                document.getElementById('profil-id').value = '';
                document.getElementById('profil-nom').value = '';
                document.getElementById('profil-kcal').value = '';
                document.getElementById('profil-prot').value = '';
                document.getElementById('profil-gluc').value = '';
                document.getElementById('profil-lip').value = '';
                document.getElementById('profil-budget').value = '';
            }
        }

        function preparerModificationProfil() {
            const select = document.getElementById('select-profil');
            const profilId = select.value;
            const profil = profilsGlobal.find(p => p.id == profilId);
            if (!profil) return;

            document.getElementById('profil-id').value = profil.id;
            document.getElementById('profil-nom').value = profil.nom;
            document.getElementById('profil-kcal').value = profil.calories_cible;
            document.getElementById('profil-prot').value = profil.proteines_cible;
            document.getElementById('profil-gluc').value = profil.glucides_cible;
            document.getElementById('profil-lip').value = profil.lipides_cible;
            document.getElementById('profil-budget').value = profil.budget_semaine;

            document.getElementById('form-profil').classList.remove('hidden');
        }

        async function sauvegarderProfil(e) {
            e.preventDefault();
            const id = document.getElementById('profil-id').value;
            const data = {
                nom: document.getElementById('profil-nom').value.trim(),
                calories_cible: parseFloat(document.getElementById('profil-kcal').value) || 0,
                proteines_cible: parseFloat(document.getElementById('profil-prot').value) || 0,
                glucides_cible: parseFloat(document.getElementById('profil-gluc').value) || 0,
                lipides_cible: parseFloat(document.getElementById('profil-lip').value) || 0,
                budget_semaine: parseFloat(document.getElementById('profil-budget').value) || 0
            };

            const url = id ? `/api/profils/${id}` : '/api/profils';
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const err = await response.json();
                alert(err.error || "Erreur lors de l'enregistrement du profil");
                return;
            }

            document.getElementById('form-profil').classList.add('hidden');
            await chargerDonnees();
            mettreAJourAffichageObjectifs();
            calculerBilanJournalier();
        }

        async function supprimerProfilActif() {
            const select = document.getElementById('select-profil');
            const profilId = select.value;
            if (!profilId) return;

            if (confirm("Voulez-vous vraiment supprimer ce profil ?")) {
                const response = await fetch(`/api/profils/${profilId}`, { method: 'DELETE' });
                if (response.ok) {
                    await chargerDonnees();
                    mettreAJourAffichageObjectifs();
                    calculerBilanJournalier();
                }
            }
        }

        function changerProfilActif() {
            mettreAJourAffichageObjectifs();
            calculerBilanJournalier();
        }

        function mettreAJourAffichageObjectifs() {
            const select = document.getElementById('select-profil');
            const profilId = select.value;
            const profil = profilsGlobal.find(p => p.id == profilId);

            if (profil) {
                document.getElementById('obj-kcal').innerText = profil.calories_cible || 0;
                document.getElementById('obj-prot').innerText = profil.proteines_cible || 0;
                document.getElementById('obj-gluc').innerText = profil.glucides_cible || 0;
                document.getElementById('obj-lip').innerText = profil.lipides_cible || 0;
                document.getElementById('obj-budget').innerText = profil.budget_semaine || 0;
            } else {
                document.getElementById('obj-kcal').innerText = 0;
                document.getElementById('obj-prot').innerText = 0;
                document.getElementById('obj-gluc').innerText = 0;
                document.getElementById('obj-lip').innerText = 0;
                document.getElementById('obj-budget').innerText = 0;
            }
        }

        function renderTableauSemaine() {
            const conteneur = document.getElementById('tableau-menu-body');
            
            conteneur.innerHTML = jours.map(jour => {
                let repasHtml = repasTypes.map(repas => {
                    const cle = `${jour}_${repas.key}`;
                    const recetteId = menuActuel[cle];
                    const recette = recettesGlobal.find(r => r.id == recetteId);

                    let contenu = recette 
                        ? `<span class="font-bold text-blue-900">${recette.nom}</span>`
                        : `<span class="text-slate-400 italic">-- Vide --</span>`;

                    return `
                        <div onclick="ouvrirModal('${jour}', '${repas.key}', '${repas.label}')" class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl active:bg-blue-50 cursor-pointer flex justify-between items-center text-xs">
                            <div>
                                <span class="text-[10px] font-bold text-slate-400 block uppercase">${repas.label}</span>
                                ${contenu}
                            </div>
                            <span class="text-slate-400 text-sm">✏️</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white border border-slate-200 rounded-2xl p-3.5 space-y-2 shadow-sm">
                        <h3 class="font-bold text-blue-800 text-xs border-b border-slate-100 pb-1.5 flex items-center gap-1">📅 ${jour}</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${repasHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function ouvrirModal(jour, repasKey, repasLabel) {
            celluleEnCours = `${jour}_${repasKey}`;
            document.getElementById('modal-titre-repas').innerText = `${jour} - ${repasLabel}`;
            
            const select = document.getElementById('modal-select-recette');
            select.innerHTML = `<option value="">-- Aucune recette (Vide) --</option>` + recettesGlobal.map(r => 
                `<option value="${r.id}" ${menuActuel[celluleEnCours] == r.id ? 'selected' : ''}>${r.nom}</option>`
            ).join('');

            document.getElementById('modal-selection').classList.remove('hidden');
        }

        function fermerModal() {
            document.getElementById('modal-selection').classList.add('hidden');
            celluleEnCours = null;
        }

        function validerSelectionRecette() {
            if (!celluleEnCours) return;
            const valeur = document.getElementById('modal-select-recette').value;

            if (valeur) {
                menuActuel[celluleEnCours] = parseInt(valeur);
            } else {
                delete menuActuel[celluleEnCours];
            }

            fermerModal();
            renderTableauSemaine();
            calculerBilanJournalier();
        }

        function genererMenuAleatoire() {
            if (recettesGlobal.length === 0) {
                alert("Veuillez d'abord créer des recettes !");
                return;
            }

            const selectProfil = document.getElementById('select-profil');
            const profilId = selectProfil.value;
            const profil = profilsGlobal.find(p => p.id == profilId);

            const objKcal = profil ? (profil.calories_cible || 2000) : 2000;
            const objProt = profil ? (profil.proteines_cible || 150) : 150;
            const objGluc = profil ? (profil.glucides_cible || 200) : 200;
            const objLip = profil ? (profil.lipides_cible || 70) : 70;

            const recettesAvecMacros = recettesGlobal.map(r => {
                let kcal = 0, prot = 0, gluc = 0, lip = 0;
                if (r.ingredients) {
                    r.ingredients.forEach(i => {
                        let facteur = i.quantite / 100;
                        kcal += (i.calories || 0) * facteur;
                        prot += (i.proteines || 0) * facteur;
                        gluc += (i.glucides || 0) * facteur;
                        lip += (i.lipides || 0) * facteur;
                    });
                }
                return { ...r, kcal, prot, gluc, lip };
            });

            menuActuel = {};

            jours.forEach(jour => {
                const cibleRepasKcal = objKcal / 4;
                const cibleRepasProt = objProt / 4;
                const cibleRepasGluc = objGluc / 4;
                const cibleRepasLip = objLip / 4;

                repasTypes.forEach(repas => {
                    const cle = `${jour}_${repas.key}`;

                    let typeRecherche = repas.key.includes("Repas") ? "Repas" : repas.key;
                    let dispo = recettesAvecMacros.filter(r => 
                        !r.categories_repas || r.categories_repas.length === 0 || r.categories_repas.includes(typeRecherche)
                    );

                    if (dispo.length === 0) dispo = recettesAvecMacros;

                    let recettesScorees = dispo.map(r => {
                        let diffKcal = Math.abs(r.kcal - cibleRepasKcal) / (cibleRepasKcal || 1);
                        let diffProt = Math.abs(r.prot - cibleRepasProt) / (cibleRepasProt || 1);
                        let diffGluc = Math.abs(r.gluc - cibleRepasGluc) / (cibleRepasGluc || 1);
                        let diffLip = Math.abs(r.lip - cibleRepasLip) / (cibleRepasLip || 1);

                        let score = (diffKcal * 1.5) + (diffProt * 2.0) + diffGluc + diffLip;
                        return { ...r, score };
                    });

                    recettesScorees.sort((a, b) => a.score - b.score);

                    let topChoix = recettesScorees.slice(0, Math.min(3, recettesScorees.length));
                    let recetteChoisie = topChoix[Math.floor(Math.random() * topChoix.length)];

                    if (recetteChoisie) {
                        menuActuel[cle] = recetteChoisie.id;
                    }
                });
            });

            renderTableauSemaine();
            calculerBilanJournalier();
            alert("Menu intelligent généré avec succès !");
        }

        function calculerBilanJournalier() {
            const conteneurSuivi = document.getElementById('tableau-suivi-journalier');
            const selectProfil = document.getElementById('select-profil');
            const profilId = selectProfil.value;
            const profil = profilsGlobal.find(p => p.id == profilId);
            
            const objKcal = profil ? (profil.calories_cible || 0) : 0;
            const objProt = profil ? (profil.proteines_cible || 0) : 0;
            const objGluc = profil ? (profil.glucides_cible || 0) : 0;
            const objLip = profil ? (profil.lipides_cible || 0) : 0;

            conteneurSuivi.innerHTML = jours.map(jour => {
                let jKcal = 0, jProt = 0, jGluc = 0, jLip = 0;

                repasTypes.forEach(repas => {
                    const cle = `${jour}_${repas.key}`;
                    const recetteId = menuActuel[cle];
                    const recette = recettesGlobal.find(r => r.id == recetteId);

                    if (recette && recette.ingredients) {
                        recette.ingredients.forEach(i => {
                            let facteur = i.quantite / 100;
                            jKcal += (i.calories || 0) * facteur;
                            jProt += (i.proteines || 0) * facteur;
                            jGluc += (i.glucides || 0) * facteur;
                            jLip += (i.lipides || 0) * facteur;
                        });
                    }
                });

                jKcal = Math.round(jKcal);
                jProt = Math.round(jProt);
                jGluc = Math.round(jGluc);
                jLip = Math.round(jLip);

                return `
                    <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1">
                        <span class="font-bold text-blue-800">${jour}</span>
                        <div class="flex flex-wrap gap-2 text-[11px] text-slate-600">
                            <span>🔥 <b>${jKcal}</b> ${objKcal > 0 ? `/ ${objKcal} kcal` : 'kcal'}</span>
                            <span>🥩 <b>${jProt}g</b> ${objProt > 0 ? `/ ${objProt}g` : ''}</span>
                            <span>🍞 <b>${jGluc}g</b> ${objGluc > 0 ? `/ ${objGluc}g` : ''}</span>
                            <span>🥑 <b>${jLip}g</b> ${objLip > 0 ? `/ ${objLip}g` : ''}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function sauvegarderMenu() {
            localStorage.setItem('menu_semaine', JSON.stringify(menuActuel));
            alert("Menu enregistré avec succès !");
        }

        function chargerMenuStocke() {
            const stock = localStorage.getItem('menu_semaine');
            if (stock) {
                try {
                    menuActuel = JSON.parse(stock);
                } catch(e) {
                    menuActuel = {};
                }
            }
        }

        socket.on('data_updated', async () => {
            await chargerDonnees();
            renderTableauSemaine();
            calculerBilanJournalier();
        });

        init();
    </script>
</body>
</html>
