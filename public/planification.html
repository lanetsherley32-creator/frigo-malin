<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planification - Frigomalin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-12 text-slate-800">
    <div class="max-w-6xl mx-auto p-4 space-y-4">
        
        <!-- En-tête & Navigation -->
        <header class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 print:hidden">
            
            <!-- Compte Connecté et Déconnexion en haut -->
            <div class="flex justify-between items-center text-xs pb-3 border-b border-slate-100">
                <span id="nom-utilisateur-connecte" class="font-bold text-slate-700">👤 Chargement du compte...</span>
                <button onclick="deconnexion()" class="text-red-500 hover:text-red-700 font-bold">Se déconnecter</button>
            </div>

            <!-- Titre et Actions principales -->
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">📅 Planification de la Semaine</h1>
                <div class="flex items-center gap-2">
                    <select id="select-profil" onchange="changerProfil()" class="bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold text-blue-600 outline-none">
                        <option value="">Chargement...</option>
                    </select>
                    <button onclick="ouvrirModalPersonne('modifier')" id="btn-modifier-personne" class="hidden text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-xl transition-all">⚙️ Profil</button>
                    <button onclick="ouvrirModalPersonne('ajouter')" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-xl transition-all">+ Profil</button>
                </div>
            </div>
            
            <!-- Navigation harmonisée sur 7 colonnes -->
            <nav class="grid grid-cols-7 gap-1 text-center text-[11px] font-medium pt-1">
                <a href="global.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="planification.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Planification</a>
                <a href="suivi.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Suivi</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
            </nav>
        </header>

        <!-- Edition directe des Objectifs du Profil Actif -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3 text-xs">
            <h3 class="font-bold text-slate-800 flex items-center gap-2">🎯 Objectifs du profil actif (Modification directe)</h3>
            <div id="form-objectifs-direct" class="grid grid-cols-2 sm:grid-cols-6 gap-2">
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Calories (kcal)</label>
                    <input type="number" id="dir-cal" onchange="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Budget (€)</label>
                    <input type="number" id="dir-budget" onchange="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Protéines (g)</label>
                    <input type="number" id="dir-prot" onchange="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Glucides (g)</label>
                    <input type="number" id="dir-gluc" onchange="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Lipides (g)</label>
                    <input type="number" id="dir-lip" onchange="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Fibres (g)</label>
                    <input type="number" id="dir-fibres" onchange="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
            </div>
        </section>

        <!-- Actions Avancées Planification -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-2 justify-between items-center text-xs print:hidden">
            <button onclick="genererSemaineAleatoire()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-bold transition-all shadow-sm">
                🎲 Générer la semaine aléatoirement
            </button>
            <button onclick="genererSemaineAleatoireOptimisee()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold transition-all shadow-sm">
                ⚡ Génération Intelligente (Objectifs & Catégories)
            </button>
        </section>

        <!-- Propositions Repas Recommandés (En Vert - Axé Protéines/Fibres) -->
        <section class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-sm space-y-2">
            <h3 class="font-bold text-xs text-emerald-800 uppercase tracking-wider">🌱 Recommandations prioritaires (Protéines & Fibres) :</h3>
            <div id="container-suggestions-vertes" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <p class="text-xs text-emerald-600 italic">Chargement des suggestions...</p>
            </div>
        </section>

        <!-- Container des jours de la semaine -->
        <div id="planification-container" class="space-y-3">
            <!-- Rempli dynamiquement -->
        </div>
    </div>

    <!-- Datalist Dynamique Intelligente (Recommandations en vert en premier) -->
    <datalist id="liste-recettes">
        <!-- Rempli par script -->
    </datalist>

    <!-- MODALE GESTION PROFIL -->
    <div id="modal-personne" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 id="modal-personne-title" class="font-bold text-sm text-slate-800">👤 Gestion du Profil</h3>
            <form id="form-personne" onsubmit="sauvegarderPersonne(event)" class="space-y-3 text-xs">
                <input type="hidden" id="personne-ancien-nom">
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Nom / Profil</label>
                    <input type="text" id="personne-nom" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Calories (kcal)</label>
                        <input type="number" id="personne-cal" value="2000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Budget (€)</label>
                        <input type="number" id="personne-budget" value="100" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Protéines (g)</label>
                        <input type="number" id="personne-prot" value="150" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Glucides (g)</label>
                        <input type="number" id="personne-gluc" value="200" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Lipides (g)</label>
                        <input type="number" id="personne-lip" value="70" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button type="button" id="btn-supprimer-personne" onclick="supprimerPersonneActuelle()" class="hidden text-red-500 hover:text-red-700 font-bold">Supprimer</button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="fermerModalPersonne()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl">Sauvegarder</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts Intégrés -->
    <script>
        const socket = io();
        let recettesCache = [];
        let profilsCache = [];
        let menusCache = [];

        document.addEventListener("DOMContentLoaded", () => {
            chargerInfosUtilisateur();
            initPlanification();
        });

        async function chargerInfosUtilisateur() {
            try {
                const res = await fetch('/api/current-user');
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('nom-utilisateur-connecte').innerText = `👤 Compte : ${user.nom} (${user.email})`;
                } else {
                    window.location.href = '/login.html';
                }
            } catch (e) {
                console.error("Erreur chargement utilisateur", e);
            }
        }

        async function deconnexion() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        async function initPlanification() {
            try {
                const [resProfils, resRecettes] = await Promise.all([
                    fetch('/api/personnes-objectifs'), 
                    fetch('/api/recettes')
                ]);
                profilsCache = await resProfils.json();
                recettesCache = await resRecettes.json();
                
                const select = document.getElementById('select-profil');
                if (!select) return;

                select.innerHTML = '';
                if (profilsCache.length === 0) {
                    select.innerHTML = '<option value="">Aucun profil disponible</option>';
                    return;
                }

                select.innerHTML = profilsCache.map(p => `<option value="${p.nom}">${p.nom}</option>`).join('');
                
                let savedProfil = localStorage.getItem('profilActif');
                if (!savedProfil || !profilsCache.some(p => p.nom === savedProfil)) {
                    savedProfil = profilsCache[0].nom;
                    localStorage.setItem('profilActif', savedProfil);
                }
                select.value = savedProfil;
                
                remplirChampsObjectifsDirects(savedProfil);
                chargerMenuSemaine();
                mettreAJourDatalistIntelligent();
                afficherSuggestionsVertes();
            } catch (err) {
                console.error("Erreur d'initialisation de la planification", err);
            }
        }

        function changerProfil() {
            const select = document.getElementById('select-profil');
            if (select) {
                localStorage.setItem('profilActif', select.value);
                remplirChampsObjectifsDirects(select.value);
                chargerMenuSemaine();
                mettreAJourDatalistIntelligent();
                afficherSuggestionsVertes();
            }
        }

        function remplirChampsObjectifsDirects(nomProfil) {
            const p = profilsCache.find(item => item.nom === nomProfil);
            if (!p) return;
            document.getElementById('dir-cal').value = p.calories || 2000;
            document.getElementById('dir-budget').value = p.budget || 100;
            document.getElementById('dir-prot').value = p.proteines || 150;
            document.getElementById('dir-gluc').value = p.glucides || 200;
            document.getElementById('dir-lip').value = p.lipides || 70;
            document.getElementById('dir-fibres').value = p.fibres || 30;
        }

        async function sauvegarderProfilDirect() {
            const profilActif = document.getElementById('select-profil').value;
            if (!profilActif) return;

            const data = {
                nom: profilActif,
                ancienNom: profilActif,
                calories: document.getElementById('dir-cal').value,
                budget: document.getElementById('dir-budget').value,
                proteines: document.getElementById('dir-prot').value,
                glucides: document.getElementById('dir-gluc').value,
                lipides: document.getElementById('dir-lip').value,
                fibres: document.getElementById('dir-fibres').value
            };

            try {
                await fetch('/api/personnes-objectifs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const resProfils = await fetch('/api/personnes-objectifs');
                profilsCache = await resProfils.json();
            } catch (e) {
                console.error("Erreur sauvegarde directe profil", e);
            }
        }

        async function chargerMenuSemaine() {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;

            const jours = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
            const container = document.getElementById('planification-container');
            const profilObj = profilsCache.find(p => p.nom === profil) || { calories: 2000 };
            
            try {
                const res = await fetch(`/api/menu-prevu-semaine?profil=${encodeURIComponent(profil)}`);
                menusCache = await res.json();

                container.innerHTML = jours.map(jour => {
                    const menuJour = menusCache.find(m => m.jour === jour) || {};
                    
                    let calJour = 0, protJour = 0, glucJour = 0, lipJour = 0, coutJour = 0;
                    ['petitdejeuner', 'repas1', 'repas2', 'dessertcollation'].forEach(champ => {
                        const recId = menuJour[champ];
                        if (recId) {
                            const rec = recettesCache.find(r => r.id == recId);
                            if (rec) {
                                calJour += rec.calories || 0;
                                protJour += rec.proteines || 0;
                                glucJour += rec.glucides || 0;
                                lipJour += rec.lipides || 0;
                                coutJour += rec.cout_par_part || rec.cout || 0;
                            }
                        }
                    });

                    return `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                                <span class="font-bold text-slate-800 text-sm">${jour}</span>
                                <div class="flex items-center gap-3 text-[11px] font-semibold text-slate-600">
                                    <span class="bg-slate-50 px-2 py-1 rounded-lg border">🔥 ${Math.round(calJour)}/${profilObj.calories} kcal</span>
                                    <span class="bg-slate-50 px-2 py-1 rounded-lg border">🥩 ${Math.round(protJour)}g</span>
                                    <span class="bg-slate-50 px-2 py-1 rounded-lg border">🍞 ${Math.round(glucJour)}g</span>
                                    <span class="bg-slate-50 px-2 py-1 rounded-lg border">🥑 ${Math.round(lipJour)}g</span>
                                    <span class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded-lg border border-emerald-100">💶 ${coutJour.toFixed(2)}€</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs">
                                <div>
                                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Petit-déj / Dessert</label>
                                    <input type="text" list="liste-recettes" placeholder="Rechercher (ex: Petit-déj, Dessert...)" onchange="sauvegarderRepasParNom('${jour}', 'petitdejeuner', this.value)" value="${getNomRecette(menuJour.petitdejeuner)}" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl outline-none font-medium">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Repas Midi</label>
                                    <input type="text" list="liste-recettes" placeholder="Rechercher..." onchange="sauvegarderRepasParNom('${jour}', 'repas1', this.value)" value="${getNomRecette(menuJour.repas1)}" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl outline-none font-medium">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Repas Soir</label>
                                    <input type="text" list="liste-recettes" placeholder="Rechercher..." onchange="sauvegarderRepasParNom('${jour}', 'repas2', this.value)" value="${getNomRecette(menuJour.repas2)}" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl outline-none font-medium">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Collation / Grignotage</label>
                                    <input type="text" list="liste-recettes" placeholder="Entrer manuellement..." onchange="sauvegarderRepasParNom('${jour}', 'dessertcollation', this.value)" value="${getNomRecette(menuJour.dessertcollation)}" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl outline-none font-medium">
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error("Erreur chargement menu semaine", e);
            }
        }

        function getNomRecette(id) {
            const r = recettesCache.find(item => item.id == id);
            return r ? r.nom : '';
        }

        // Tri intelligent basé sur les protéines et les fibres pour prioriser en vert
        function mettreAJourDatalistIntelligent() {
            const datalist = document.getElementById('liste-recettes');
            if (!datalist) return;

            // Tri par score combiné protéines + fibres (décroissant)
            const triees = [...recettesCache].sort((a, b) => {
                const scoreA = (a.proteines || 0) * 2 + (a.fibres || 0) * 1.5;
                const scoreB = (b.proteines || 0) * 2 + (b.fibres || 0) * 1.5;
                return scoreB - scoreA;
            });

            datalist.innerHTML = triees.map(r => `<option value="${r.nom}">[Protéines: ${r.proteines || 0}g | Fibres: ${r.fibres || 0}g] - ${r.type_repas || 'Général'}</option>`).join('');
        }

        async function sauvegarderRepasParNom(jour, typeRepas, nomRecette) {
            const profil = document.getElementById('select-profil').value;
            if (!profil) return;

            const rec = recettesCache.find(r => r.nom.toLowerCase() === nomRecette.toLowerCase());
            const idRecette = rec ? rec.id : null;

            try {
                await fetch('/api/menu-prevu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        profil,
                        jour,
                        [typeRepas]: idRecette
                    })
                });
                chargerMenuSemaine();
            } catch (e) {
                console.error("Erreur sauvegarde repas", e);
            }
        }

        async function genererSemaineAleatoire() {
            const profil = document.getElementById('select-profil').value;
            if (!profil || recettesCache.length === 0) return;

            const jours = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
            for (let jour of jours) {
                // Pour la génération aléatoire, on autorise les catégories Petit-déj / Déjeuner / Dîner / Dessert. 
                // Le grignotage (dernière catégorie) est laissé vide pour saisie manuelle.
                const ptDej = recettesCache.filter(r => ['Petit-déjeuner', 'Dessert'].includes(r.type_repas));
                const repasStd = recettesCache.filter(r => ['Déjeuner', 'Dîner', 'Plat'].includes(r.type_repas));
                const poolPtDej = ptDej.length > 0 ? ptDej : recettesCache;
                const poolStd = repasStd.length > 0 ? repasStd : recettesCache;

                const r1 = poolPtDej[Math.floor(Math.random() * poolPtDej.length)]?.id || null;
                const r2 = poolStd[Math.floor(Math.random() * poolStd.length)]?.id || null;
                const r3 = poolStd[Math.floor(Math.random() * poolStd.length)]?.id || null;
                const r4 = null; // Grignotage laissé vide par défaut en aléatoire

                await fetch('/api/menu-prevu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profil, jour, petitdejeuner: r1, repas1: r2, repas2: r3, dessertcollation: r4 })
                });
            }
            chargerMenuSemaine();
            alert("Semaine générée aléatoirement (avec filtrage des catégories de repas) !");
        }

        async function genererSemaineAleatoireOptimisee() {
            const profil = document.getElementById('select-profil').value;
            if (!profil || recettesCache.length === 0) return;
            const profilObj = profilsCache.find(p => p.nom === profil) || { calories: 2000 };

            // Ciblage par calories et tri d'optimisation (Protéines & Fibres en priorité)
            const cibleCal = (profilObj.calories || 2000) / 4;
            const recettesOptimisees = [...recettesCache].sort((a, b) => {
                const scoreA = (a.proteines || 0) * 2 + (a.fibres || 0) * 1.5 - Math.abs((a.calories || 500) - cibleCal);
                const scoreB = (b.proteines || 0) * 2 + (b.fibres || 0) * 1.5 - Math.abs((b.calories || 500) - cibleCal);
                return scoreB - scoreA;
            });

            const jours = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
            for (let jour of jours) {
                const r1 = recettesOptimisees[Math.floor(Math.random() * Math.min(5, recettesOptimisees.length))]?.id || null;
                const r2 = recettesOptimisees[Math.floor(Math.random() * Math.min(5, recettesOptimisees.length))]?.id || null;
                const r3 = recettesOptimisees[Math.floor(Math.random() * Math.min(5, recettesOptimisees.length))]?.id || null;
                const r4 = null; // Grignotage laissé vide pour saisie manuelle

                await fetch('/api/menu-prevu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profil, jour, petitdejeuner: r1, repas1: r2, repas2: r3, dessertcollation: r4 })
                });
            }
            chargerMenuSemaine();
            alert("Génération intelligente axée sur vos objectifs et catégories effectuée !");
        }

        function afficherSuggestionsVertes() {
            const container = document.getElementById('container-suggestions-vertes');
            if (!container || recettesCache.length === 0) return;
            
            // Recommandations top 3 basées sur le max de protéines et fibres
            const suggestions = [...recettesCache].sort((a, b) => ((b.proteines || 0) + (b.fibres || 0)) - ((a.proteines || 0) + (a.fibres || 0))).slice(0, 3);
            
            container.innerHTML = suggestions.map(r => `
                <div class="bg-white p-2.5 rounded-xl border border-emerald-100 flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-slate-800">${r.nom}</span>
                        <span class="text-emerald-600 block text-[10px]">🔥 ${r.calories || 0} kcal | 🥩 ${r.proteines || 0}g P | 🌾 ${r.fibres || 0}g Fibres</span>
                    </div>
                    <span class="text-emerald-600 font-bold text-sm">✓</span>
                </div>
            `).join('');
        }

        function ouvrirModalPersonne(mode) {
            const modal = document.getElementById('modal-personne');
            modal?.classList.remove('hidden');
            const profilActif = document.getElementById('select-profil').value;
            if (mode === 'modifier') {
                const profilObj = profilsCache.find(p => p.nom === profilActif);
                if (profilObj) {
                    document.getElementById('personne-ancien-nom').value = profilObj.nom;
                    document.getElementById('personne-nom').value = profilObj.nom;
                    document.getElementById('personne-cal').value = profilObj.calories || 2000;
                    document.getElementById('personne-budget').value = profilObj.budget || 100;
                    document.getElementById('personne-prot').value = profilObj.proteines || 150;
                    document.getElementById('personne-gluc').value = profilObj.glucides || 200;
                    document.getElementById('personne-lip').value = profilObj.lipides || 70;
                    document.getElementById('btn-supprimer-personne')?.classList.remove('hidden');
                }
            } else {
                document.getElementById('form-personne')?.reset();
                document.getElementById('personne-ancien-nom').value = '';
                document.getElementById('btn-supprimer-personne')?.classList.add('hidden');
            }
        }

        function fermerModalPersonne() {
            document.getElementById('modal-personne')?.classList.add('hidden');
        }

        async function sauvegarderPersonne(event) {
            event.preventDefault();
            const data = {
                nom: document.getElementById('personne-nom').value,
                ancienNom: document.getElementById('personne-ancien-nom').value,
                calories: document.getElementById('personne-cal').value,
                budget: document.getElementById('personne-budget').value,
                proteines: document.getElementById('personne-prot').value,
                glucides: document.getElementById('personne-gluc').value,
                lipides: document.getElementById('personne-lip').value
            };

            try {
                await fetch('/api/personnes-objectifs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                fermerModalPersonne();
                localStorage.setItem('profilActif', data.nom);
                initPlanification();
            } catch (e) {
                console.error("Erreur sauvegarde profil", e);
            }
        }

        async function supprimerPersonneActuelle() {
            const profilActif = document.getElementById('select-profil').value;
            if (!confirm(`Voulez-vous vraiment supprimer le profil ${profilActif} ?`)) return;
            try {
                await fetch(`/api/personnes-objectifs?nom=${encodeURIComponent(profilActif)}`, { method: 'DELETE' });
                fermerModalPersonne();
                initPlanification();
            } catch (e) {
                console.error("Erreur suppression profil", e);
            }
        }

        socket.on('data_updated', initPlanification);
    </script>
</body>
</html>
