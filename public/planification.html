<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planification - Frigomalin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-12 text-slate-800">
    <div class="max-w-6xl mx-auto p-4 space-y-4">
        <!-- En-tête & Navigation -->
        <header class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 print:hidden">
            <div class="flex justify-between items-center text-xs pb-3 border-b border-slate-100">
                <span id="nom-utilisateur-connecte" class="font-bold text-slate-700">👤 Chargement du compte...</span>
                <button onclick="deconnexion()" class="text-red-500 hover:text-red-700 font-bold">Se déconnecter</button>
            </div>

            <div class="flex justify-between items-center flex-wrap gap-2">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">📅 Planification de la Semaine</h1>
                <div class="flex items-center gap-2">
                    <select id="select-profil" onchange="changerProfil()" class="bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold text-blue-600 outline-none">
                        <option value="">Chargement...</option>
                    </select>
                    <button onclick="ouvrirModalPersonne('modifier')" id="btn-modifier-personne" class="hidden text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-xl transition-all">⚙️ Profil</button>
                    <button onclick="ouvrirModalPersonne('ajouter')" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-xl transition-all">+ Profil</button>
                </div>
            </div>
            <nav class="grid grid-cols-7 gap-1 text-center text-[11px] font-medium pt-1">
                <a href="global.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="planification.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Planification</a>
                <a href="suivi.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Suivi</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
            </nav>
        </header>

        <!-- Edition directe des Objectifs du Profil Actif -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3 text-xs">
            <h3 class="font-bold text-slate-800 flex items-center gap-2">🎯 Modification directe des objectifs du profil actif</h3>
            <div id="form-objectifs-direct" class="grid grid-cols-2 sm:grid-cols-6 gap-2">
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Calories (kcal)</label>
                    <input type="number" id="dir-cal" oninput="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Budget (€)</label>
                    <input type="number" id="dir-budget" oninput="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Protéines (g)</label>
                    <input type="number" id="dir-prot" oninput="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Glucides (g)</label>
                    <input type="number" id="dir-gluc" oninput="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Lipides (g)</label>
                    <input type="number" id="dir-lip" oninput="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Fibres (g)</label>
                    <input type="number" id="dir-fibres" oninput="sauvegarderProfilDirect()" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-medium outline-none">
                </div>
            </div>
        </section>

        <!-- Filtrage Avancé & Choix des repas à générer -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 text-xs overflow-hidden">
            <button onclick="toggleAccordeonFiltres()" class="w-full p-4 flex justify-between items-center font-bold text-slate-800 bg-slate-50 hover:bg-slate-100 transition-all">
                <span class="flex items-center gap-2">⚙️ Filtrage Avancé & Choix des Repas à Générer</span>
                <span id="accordeon-icon" class="text-sm font-bold text-slate-500">▼</span>
            </button>
            <div id="accordeon-content" class="p-4 space-y-4 hidden border-t border-slate-100">
                <!-- Petit Déjeuner -->
                <div class="space-y-2 pb-3 border-b border-slate-100">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 font-bold text-blue-900 cursor-pointer text-[11px]">
                            <input type="checkbox" id="generer-pt-dej" checked onchange="sauvegarderFiltresEtMettreAJour()" class="rounded border-slate-300 w-4 h-4 text-blue-600">
                            ☕ Inclure/Générer le Petit-déjeuner
                        </label>
                    </div>
                    <div class="flex flex-wrap gap-4 items-center pl-6">
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-pt-dej-sub rounded border-slate-300" value="petitdej" checked onchange="sauvegarderFiltresEtMettreAJour()"> petitdej</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-pt-dej-sub rounded border-slate-300" value="repas chaud" checked onchange="sauvegarderFiltresEtMettreAJour()"> Repas chaud</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-pt-dej-sub rounded border-slate-300" value="repas froid" checked onchange="sauvegarderFiltresEtMettreAJour()"> Repas froid</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-pt-dej-sub rounded border-slate-300" value="dessert" checked onchange="sauvegarderFiltresEtMettreAJour()"> Dessert</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-pt-dej-sub rounded border-slate-300" value="encas" checked onchange="sauvegarderFiltresEtMettreAJour()"> Encas</label>
                    </div>
                </div>

                <!-- Repas Midi -->
                <div class="space-y-2 pb-3 border-b border-slate-100">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 font-bold text-blue-900 cursor-pointer text-[11px]">
                            <input type="checkbox" id="generer-midi" checked onchange="sauvegarderFiltresEtMettreAJour()" class="rounded border-slate-300 w-4 h-4 text-blue-600">
                            🍽️ Inclure/Générer le Repas de Midi
                        </label>
                    </div>
                    <div class="flex flex-wrap gap-4 items-center pl-6">
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-midi-sub rounded border-slate-300" value="petitdej" checked onchange="sauvegarderFiltresEtMettreAJour()"> petitdej</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-midi-sub rounded border-slate-300" value="repas chaud" checked onchange="sauvegarderFiltresEtMettreAJour()"> Repas chaud</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-midi-sub rounded border-slate-300" value="repas froid" checked onchange="sauvegarderFiltresEtMettreAJour()"> Repas froid</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-midi-sub rounded border-slate-300" value="dessert" checked onchange="sauvegarderFiltresEtMettreAJour()"> Dessert</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-midi-sub rounded border-slate-300" value="encas" checked onchange="sauvegarderFiltresEtMettreAJour()"> Encas</label>
                    </div>
                </div>

                <!-- Repas Soir -->
                <div class="space-y-2 pb-3 border-b border-slate-100">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 font-bold text-blue-900 cursor-pointer text-[11px]">
                            <input type="checkbox" id="generer-soir" checked onchange="sauvegarderFiltresEtMettreAJour()" class="rounded border-slate-300 w-4 h-4 text-blue-600">
                            🌙 Inclure/Générer le Repas du Soir
                        </label>
                    </div>
                    <div class="flex flex-wrap gap-4 items-center pl-6">
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-soir-sub rounded border-slate-300" value="petitdej" checked onchange="sauvegarderFiltresEtMettreAJour()"> petitdej</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-soir-sub rounded border-slate-300" value="repas chaud" checked onchange="sauvegarderFiltresEtMettreAJour()"> Repas chaud</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-soir-sub rounded border-slate-300" value="repas froid" checked onchange="sauvegarderFiltresEtMettreAJour()"> Repas froid</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-soir-sub rounded border-slate-300" value="dessert" checked onchange="sauvegarderFiltresEtMettreAJour()"> Dessert</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-soir-sub rounded border-slate-300" value="encas" checked onchange="sauvegarderFiltresEtMettreAJour()"> Encas</label>
                    </div>
                </div>

                <!-- Collation -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 font-bold text-blue-900 cursor-pointer text-[11px]">
                            <input type="checkbox" id="generer-collation" checked onchange="sauvegarderFiltresEtMettreAJour()" class="rounded border-slate-300 w-4 h-4 text-blue-600">
                            🍏 Inclure/Générer la Collation
                        </label>
                    </div>
                    <div class="flex flex-wrap gap-4 items-center pl-6">
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-collation-sub rounded border-slate-300" value="petitdej" checked onchange="sauvegarderFiltresEtMettreAJour()"> petitdej</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-collation-sub rounded border-slate-300" value="repas chaud" checked onchange="sauvegarderFiltresEtMettreAJour()"> Repas chaud</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-collation-sub rounded border-slate-300" value="repas froid" checked onchange="sauvegarderFiltresEtMettreAJour()"> Repas froid</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-collation-sub rounded border-slate-300" value="dessert" checked onchange="sauvegarderFiltresEtMettreAJour()"> Dessert</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" class="filtre-collation-sub rounded border-slate-300" value="encas" checked onchange="sauvegarderFiltresEtMettreAJour()"> Encas</label>
                    </div>
                </div>
            </div>
        </section>

        <!-- Actions Avancées Planification -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-2 justify-between items-center text-xs print:hidden">
            <button onclick="genererSemaineAleatoire()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-bold transition-all shadow-sm">
                🎲 Générer la semaine aléatoirement (selon sélection)
            </button>
            <button onclick="genererSemaineAleatoireOptimisee()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold transition-all shadow-sm">
                ⚡ Génération Intelligente (Objectifs & Filtres)
            </button>
        </section>

        <!-- Propositions Repas Recommandés -->
        <section class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-sm space-y-2">
            <h3 class="font-bold text-xs text-emerald-800 uppercase tracking-wider">🌱 Recommandations prioritaires :</h3>
            <div id="container-suggestions-vertes" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <p class="text-xs text-emerald-600 italic">Chargement des suggestions...</p>
            </div>
        </section>

        <!-- Container des jours de la semaine -->
        <div id="planification-container" class="space-y-3"></div>
    </div>

    <!-- Datalists séparées -->
    <datalist id="liste-recettes-pt-dej"></datalist>
    <datalist id="liste-recettes-midi"></datalist>
    <datalist id="liste-recettes-soir"></datalist>
    <datalist id="liste-recettes-collation"></datalist>
    <datalist id="liste-ingredients-recettes-global"></datalist>

    <!-- MODALE GESTION PROFIL -->
    <div id="modal-personne" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 id="modal-personne-title" class="font-bold text-sm text-slate-800">👤 Gestion du Profil</h3>
            <form id="form-personne" onsubmit="sauvegarderPersonne(event)" class="space-y-3 text-xs">
                <input type="hidden" id="personne-ancien-nom">
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Nom / Profil</label>
                    <input type="text" id="personne-nom" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Calories (kcal)</label>
                        <input type="number" id="personne-cal" value="2000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Budget (€)</label>
                        <input type="number" id="personne-budget" value="100" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="fermerModalPersonne()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">Annuler</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl">Sauvegarder</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts Intégrés -->
    <script>
        const socket = io();
        let recettesCache = [];
        let ingredientsCache = [];
        let profilsCache = [];
        let menusCache = [];
        let saveTimeout = null;

        document.addEventListener("DOMContentLoaded", () => {
            chargerInfosUtilisateur();
            initPlanification();
        });

        async function chargerInfosUtilisateur() {
            try {
                const res = await fetch('/api/current-user');
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('nom-utilisateur-connecte').innerText = `👤 Compte : ${user.nom} (${user.email})`;
                } else {
                    window.location.href = '/login.html';
                }
            } catch (e) {
                console.error("Erreur chargement utilisateur", e);
            }
        }

        async function deconnexion() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        async function initPlanification() {
            try {
                const [resProfils, resRecettes, resIngredients] = await Promise.all([
                    fetch('/api/personnes-objectifs'),
                    fetch('/api/recettes'),
                    fetch('/api/ingredients').catch(() => ({ ok: false }))
                ]);
                profilsCache = await resProfils.json();
                recettesCache = await resRecettes.json();
                if (resIngredients.ok) {
                    ingredientsCache = await resIngredients.json();
                }
                const select = document.getElementById('select-profil');
                if (!select) return;

                select.innerHTML = '';
                if (profilsCache.length === 0) {
                    select.innerHTML = '<option value="">Aucun profil disponible</option>';
                    return;
                }

                select.innerHTML = profilsCache.map(p => `<option value="${p.nom}">${p.nom}</option>`).join('');
                let savedProfil = localStorage.getItem('profilActif');
                if (!savedProfil || !profilsCache.some(p => p.nom === savedProfil)) {
                    savedProfil = profilsCache[0].nom;
                    localStorage.setItem('profilActif', savedProfil);
                }
                select.value = savedProfil;
                remplirChampsObjectifsDirects(savedProfil);
                chargerFiltresSauvegardes();
                await chargerMenuSemaine();
                mettreAJourDatalists();
                afficherSuggestionsVertes();
            } catch (err) {
                console.error("Erreur d'initialisation de la planification", err);
            }
        }

        function toggleAccordeonFiltres() {
            const content = document.getElementById('accordeon-content');
            const icon = document.getElementById('accordeon-icon');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.innerText = '▲';
            } else {
                content.classList.add('hidden');
                icon.innerText = '▼';
            }
        }

        function changerProfil() {
            const select = document.getElementById('select-profil');
            if (select) {
                localStorage.setItem('profilActif', select.value);
                remplirChampsObjectifsDirects(select.value);
                chargerMenuSemaine();
                mettreAJourDatalists();
                afficherSuggestionsVertes();
            }
        }

        function remplirChampsObjectifsDirects(nomProfil) {
            const p = profilsCache.find(item => item.nom === nomProfil);
            if (!p) return;
            document.getElementById('dir-cal').value = p.calories || 2000;
            document.getElementById('dir-budget').value = p.budget || 100;
            document.getElementById('dir-prot').value = p.proteines || 150;
            document.getElementById('dir-gluc').value = p.glucides || 200;
            document.getElementById('dir-lip').value = p.lipides || 70;
            document.getElementById('dir-fibres').value = p.fibres || 30;
        }

        function sauvegarderProfilDirect() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                const profilActif = document.getElementById('select-profil').value;
                if (!profilActif) return;

                const data = {
                    nom: profilActif,
                    ancienNom: profilActif,
                    calories: document.getElementById('dir-cal').value,
                    budget: document.getElementById('dir-budget').value,
                    proteines: document.getElementById('dir-prot').value,
                    glucides: document.getElementById('dir-gluc').value,
                    lipides: document.getElementById('dir-lip').value,
                    fibres: document.getElementById('dir-fibres').value
                };

                try {
                    await fetch('/api/personnes-objectifs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const resProfils = await fetch('/api/personnes-objectifs');
                    profilsCache = await resProfils.json();
                } catch (e) {
                    console.error("Erreur sauvegarde directe profil", e);
                }
            }, 400);
        }

        function sauvegarderFiltresEtMettreAJour() {
            const filtres = {
                genPtDej: document.getElementById('generer-pt-dej')?.checked ?? true,
                genMidi: document.getElementById('generer-midi')?.checked ?? true,
                genSoir: document.getElementById('generer-soir')?.checked ?? true,
                genCollation: document.getElementById('generer-collation')?.checked ?? true,
                ptDej: Array.from(document.querySelectorAll('.filtre-pt-dej-sub')).map(cb => ({ val: cb.value, checked: cb.checked })),
                midi: Array.from(document.querySelectorAll('.filtre-midi-sub')).map(cb => ({ val: cb.value, checked: cb.checked })),
                soir: Array.from(document.querySelectorAll('.filtre-soir-sub')).map(cb => ({ val: cb.value, checked: cb.checked })),
                collation: Array.from(document.querySelectorAll('.filtre-collation-sub')).map(cb => ({ val: cb.value, checked: cb.checked }))
            };
            localStorage.setItem('filtresAvancesSemaine', JSON.stringify(filtres));
            mettreAJourDatalists();
        }

        function chargerFiltresSauvegardes() {
            const saved = localStorage.getItem('filtresAvancesSemaine');
            if (!saved) return;
            try {
                const filtres = JSON.parse(saved);
                if (document.getElementById('generer-pt-dej')) document.getElementById('generer-pt-dej').checked = filtres.genPtDej ?? true;
                if (document.getElementById('generer-midi')) document.getElementById('generer-midi').checked = filtres.genMidi ?? true;
                if (document.getElementById('generer-soir')) document.getElementById('generer-soir').checked = filtres.genSoir ?? true;
                if (document.getElementById('generer-collation')) document.getElementById('generer-collation').checked = filtres.genCollation ?? true;

                if (filtres.ptDej) {
                    document.querySelectorAll('.filtre-pt-dej-sub').forEach(cb => {
                        const found = filtres.ptDej.find(f => f.val === cb.value);
                        if (found) cb.checked = found.checked;
                    });
                }
                if (filtres.midi) {
                    document.querySelectorAll('.filtre-midi-sub').forEach(cb => {
                        const found = filtres.midi.find(f => f.val === cb.value);
                        if (found) cb.checked = found.checked;
                    });
                }
                if (filtres.soir) {
                    document.querySelectorAll('.filtre-soir-sub').forEach(cb => {
                        const found = filtres.soir.find(f => f.val === cb.value);
                        if (found) cb.checked = found.checked;
                    });
                }
                if (filtres.collation) {
                    document.querySelectorAll('.filtre-collation-sub').forEach(cb => {
                        const found = filtres.collation.find(f => f.val === cb.value);
                        if (found) cb.checked = found.checked;
                    });
                }
            } catch(e) {
                console.error("Erreur chargement filtres", e);
            }
        }

        function getFiltresActifsPourType(typeRepas) {
            let selector = '';
            if (typeRepas === 'petitdejeuner') selector = '.filtre-pt-dej-sub';
            else if (typeRepas === 'repas1') selector = '.filtre-midi-sub';
            else if (typeRepas === 'repas2') selector = '.filtre-soir-sub';
            else if (typeRepas === 'dessertcollation') selector = '.filtre-collation-sub';

            const checkboxes = document.querySelectorAll(selector);
            const selectionnes = [];
            checkboxes.forEach(cb => {
                if (cb.checked) selectionnes.push(cb.value.toLowerCase());
            });
            return selectionnes;
        }

        function filtrerRecettesParType(typeRepas) {
            const categoriesAcceptees = getFiltresActifsPourType(typeRepas);
            return recettesCache.filter(rec => {
                const catRec = (rec.categorie || rec.type || '').toLowerCase();
                return categoriesAcceptees.some(c => catRec.includes(c));
            });
        }

        function mettreAJourDatalists() {
            const types = [
                { id: 'liste-recettes-pt-dej', typeRepas: 'petitdejeuner' },
                { id: 'liste-recettes-midi', typeRepas: 'repas1' },
                { id: 'liste-recettes-soir', typeRepas: 'repas2' },
                { id: 'liste-recettes-collation', typeRepas: 'dessertcollation' }
            ];

            types.forEach(t => {
                const datalist = document.getElementById(t.id);
                if (!datalist) return;
                const recettesFiltrees = filtrerRecettesParType(t.typeRepas);
                datalist.innerHTML = recettesFiltrees.map(r => `<option value="${r.nom}">`).join('');
            });

            const datalistGlobal = document.getElementById('liste-ingredients-recettes-global');
            if (datalistGlobal) {
                let optionsHtml = recettesCache.map(r => `<option value="${r.nom}">`).join('');
                if (ingredientsCache.length > 0) {
                    optionsHtml += ingredientsCache.map(i => `<option value="${i.nom}">`).join('');
                }
                datalistGlobal.innerHTML = optionsHtml;
            }
        }

        function getNomRecette(val) {
            if (!val) return '';
            if (typeof val === 'string') return val;
            if (typeof val === 'object' && val.nom) return val.nom;
            return '';
        }

        function getEncasList(menuJour) {
            if (!menuJour) return [];
            let encas = menuJour.encas || menuJour.collation || [];
            if (typeof encas === 'string') {
                try { encas = JSON.parse(encas); } catch(e) { encas = encas ? [encas] : []; }
            }
            if (!Array.isArray(encas)) {
                encas = encas ? [encas] : [];
            }
            return encas.map(item => getNomRecette(item)).filter(Boolean);
        }

        async function chargerMenuSemaine() {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;

            const jours = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
            const container = document.getElementById('planification-container');
            try {
                const res = await fetch(`/api/menu-prevu-semaine?profil=${encodeURIComponent(profil)}`);
                menusCache = await res.json();

                container.innerHTML = jours.map(jour => {
                    const menuJour = menusCache.find(m => m.jour === jour) || {};
                    const encasActuels = getEncasList(menuJour);

                    return `
                        <div id="row-${jour}" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                                <span class="font-bold text-slate-800 text-sm">${jour}</span>
                                <div id="totaux-${jour}" class="flex items-center gap-3 text-[11px] font-semibold text-slate-600"></div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs items-start">
                                <div>
                                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Petit dej</label>
                                    <input type="text" id="input-${jour}-petitdejeuner" list="liste-recettes-pt-dej" placeholder="Rechercher..." onchange="sauvegarderRepasParNom('${jour}', 'petitdejeuner', this.value)" value="${getNomRecette(menuJour.petitdejeuner)}" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl outline-none font-medium">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Repas midi</label>
                                    <input type="text" id="input-${jour}-repas1" list="liste-recettes-midi" placeholder="Rechercher..." onchange="sauvegarderRepasParNom('${jour}', 'repas1', this.value)" value="${getNomRecette(menuJour.repas1)}" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl outline-none font-medium">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Repas soir</label>
                                    <input type="text" id="input-${jour}-repas2" list="liste-recettes-soir" placeholder="Rechercher..." onchange="sauvegarderRepasParNom('${jour}', 'repas2', this.value)" value="${getNomRecette(menuJour.repas2)}" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl outline-none font-medium">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-slate-400 font-bold mb-1">Encas (Plusieurs possibles)</label>
                                    <div class="space-y-2">
                                        <div class="flex gap-1">
                                            <input type="text" id="input-${jour}-encas-new" list="liste-ingredients-recettes-global" placeholder="Ex: pomme, banane..." class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl outline-none font-medium">
                                            <button type="button" onclick="ajouterEncas('${jour}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2 rounded-xl transition-all text-xs whitespace-nowrap">+ Ajouter</button>
                                        </div>
                                        <div id="tags-encas-${jour}" class="flex flex-wrap gap-1.5 min-h-[28px] items-center">
                                            ${encasActuels.map((encas, idx) => `
                                                <span class="inline-flex items-center gap-1 bg-blue-50 border border-blue-200 text-blue-700 px-2 py-1 rounded-lg text-[11px] font-medium">
                                                    ${encas}
                                                    <button type="button" onclick="supprimerEncas('${jour}', ${idx})" class="text-blue-400 hover:text-red-500 font-bold ml-1">×</button>
                                                </span>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Erreur chargement menu semaine", e);
            }
        }

        async function sauvegarderRepasParNom(jour, typeRepas, valeur) {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;

            const menuJour = menusCache.find(m => m.jour === jour) || { jour, profil, encas: [] };
            menuJour[typeRepas] = valeur;

            try {
                await fetch('/api/menu-prevu-semaine', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        profil: profil,
                        jour: jour,
                        petitdejeuner: typeRepas === 'petitdejeuner' ? valeur : getNomRecette(menuJour.petitdejeuner),
                        repas1: typeRepas === 'repas1' ? valeur : getNomRecette(menuJour.repas1),
                        repas2: typeRepas === 'repas2' ? valeur : getNomRecette(menuJour.repas2),
                        encas: getEncasList(menuJour)
                    })
                });
            } catch (e) {
                console.error("Erreur sauvegarde repas", e);
            }
        }

        async function ajouterEncas(jour) {
            const inputEl = document.getElementById(`input-${jour}-encas-new`);
            if (!inputEl) return;
            const valeur = inputEl.value.trim();
            if (!valeur) return;

            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;

            const menuJour = menusCache.find(m => m.jour === jour) || { jour, profil, encas: [] };
            let encasActuels = getEncasList(menuJour);
            if (!encasActuels.includes(valeur)) {
                encasActuels.push(valeur);
            }
            menuJour.encas = encasActuels;
            inputEl.value = '';

            await sauvegarderMenuComplet(jour, menuJour);
            chargerMenuSemaine();
        }

        async function supprimerEncas(jour, index) {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;

            const menuJour = menusCache.find(m => m.jour === jour);
            if (!menuJour) return;

            let encasActuels = getEncasList(menuJour);
            encasActuels.splice(index, 1);
            menuJour.encas = encasActuels;

            await sauvegarderMenuComplet(jour, menuJour);
            chargerMenuSemaine();
        }

        async function sauvegarderMenuComplet(jour, menuJour) {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;

            try {
                await fetch('/api/menu-prevu-semaine', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        profil: profil,
                        jour: jour,
                        petitdejeuner: getNomRecette(menuJour.petitdejeuner),
                        repas1: getNomRecette(menuJour.repas1),
                        repas2: getNomRecette(menuJour.repas2),
                        encas: getEncasList(menuJour)
                    })
                });
            } catch (e) {
                console.error("Erreur sauvegarde menu complet", e);
            }
        }

        async function genererSemaineAleatoire() {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;
            alert("Fonctionnalité de génération aléatoire active.");
        }

        async function genererSemaineAleatoireOptimisee() {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;
            alert("Génération intelligente active.");
        }

        function afficherSuggestionsVertes() {
            const container = document.getElementById('container-suggestions-vertes');
            if (container) {
                container.innerHTML = '<p class="text-xs text-emerald-600">Aucune suggestion pour le moment.</p>';
            }
        }

        function ouvrirModalPersonne(action) {
            const modal = document.getElementById('modal-personne');
            if (modal) modal.classList.remove('hidden');
        }

        function fermerModalPersonne() {
            const modal = document.getElementById('modal-personne');
            if (modal) modal.classList.add('hidden');
        }

        async function sauvegarderPersonne(e) {
            e.preventDefault();
            fermerModalPersonne();
        }
    </script>
</body>
</html>
