<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planification - Frigomalin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-4 space-y-4">
        
        <!-- En-tête & Navigation -->
        <header class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 print:hidden">
            
            <!-- Compte Connecté et Déconnexion en haut -->
            <div class="flex justify-between items-center text-xs pb-3 border-b border-slate-100">
                <span id="nom-utilisateur-connecte" class="font-bold text-slate-700">👤 Chargement du compte...</span>
                <button onclick="deconnexion()" class="text-red-500 hover:text-red-700 font-bold">Se déconnecter</button>
            </div>

            <!-- Titre et Actions principales -->
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">📅 Planification de la Semaine</h1>
                <div class="flex items-center gap-2">
                    <select id="select-profil" onchange="changerProfil()" class="bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold text-blue-600 outline-none">
                        <option value="">Chargement...</option>
                    </select>
                    <button onclick="ouvrirModalPersonne()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-all">⚙️ Profil</button>
                </div>
            </div>
            
            <!-- Navigation harmonisée sur 7 colonnes -->
            <nav class="grid grid-cols-7 gap-1 text-center text-[11px] font-medium pt-1">
                <a href="global.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="planification.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Planification</a>
                <a href="suivi.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Suivi</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
            </nav>
        </header>

        <!-- Actions Avancées Planification -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-2 justify-between items-center text-xs print:hidden">
            <button onclick="ouvrirModalCategoriesAleatoire()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-bold transition-all shadow-sm">
                🎲 Générer la semaine aléatoirement
            </button>
            <button onclick="genererSemaineAleatoireOptimisee()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold transition-all shadow-sm">
                ⚡ Génération Intelligente (Objectifs)
            </button>
        </section>

        <!-- Container des jours de la semaine -->
        <div id="planification-container" class="space-y-3">
            <!-- Rempli dynamiquement par le script -->
        </div>
    </div>

    <!-- Modals simplifiés ou conteneurs de secours pour éviter les erreurs de variables -->
    <div id="modals-container"></div>

    <!-- Scripts Intégrés -->
    <script>
        const socket = io();
        let recettesCache = [];

        document.addEventListener("DOMContentLoaded", () => {
            chargerInfosUtilisateur();
            initPlanification();
        });

        async function chargerInfosUtilisateur() {
            try {
                const res = await fetch('/api/current-user');
                if (res.ok) {
                    const user = await res.json();
                    const element = document.getElementById('nom-utilisateur-connecte');
                    if (element) element.innerText = `👤 Compte : ${user.nom} (${user.email})`;
                } else {
                    window.location.href = '/login.html';
                }
            } catch (e) {
                console.error("Erreur chargement utilisateur", e);
            }
        }

        async function deconnexion() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        async function initPlanification() {
            try {
                const [resProfils, resRecettes] = await Promise.all([
                    fetch('/api/personnes-objectifs'), 
                    fetch('/api/recettes')
                ]);
                const profils = await resProfils.json();
                recettesCache = await resRecettes.json();
                
                const select = document.getElementById('select-profil');
                if (!select) return;

                select.innerHTML = '';
                if (profils.length === 0) {
                    select.innerHTML = '<option value="">Aucun profil disponible</option>';
                    return;
                }

                select.innerHTML = profils.map(p => `<option value="${p.nom}">${p.nom}</option>`).join('');
                
                const savedProfil = localStorage.getItem('profilActif');
                if (savedProfil && profils.some(p => p.nom === savedProfil)) {
                    select.value = savedProfil;
                } else if (profils.length > 0) {
                    select.value = profils[0].nom;
                    localStorage.setItem('profilActif', profils[0].nom);
                }
                
                chargerMenuSemaine();
            } catch (err) {
                console.error("Erreur d'initialisation de la planification", err);
            }
        }

        function changerProfil() {
            const select = document.getElementById('select-profil');
            if (select) {
                localStorage.setItem('profilActif', select.value);
                chargerMenuSemaine();
            }
        }

        async function chargerMenuSemaine() {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;

            const jours = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
            const container = document.getElementById('planification-container');
            
            try {
                const res = await fetch(`/api/menu-prevu-semaine?profil=${encodeURIComponent(profil)}`);
                const menus = await res.json();

                container.innerHTML = jours.map(jour => {
                    const menuJour = menus.find(m => m.jour === jour) || {};
                    return `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div class="w-32 font-bold text-slate-800 text-sm">${jour}</div>
                            <div class="flex-1 grid grid-cols-1 sm:grid-cols-4 gap-2 w-full text-xs">
                                <select onchange="sauvegarderRepas('${jour}', 'petitDejeuner', this.value)" class="bg-slate-50 border border-slate-200 p-2 rounded-xl">
                                    <option value="">Petit-déjeuner</option>
                                    ${recettesCache.map(r => `<option value="${r.id}" ${menuJour.petitdejeuner == r.id ? 'selected' : ''}>${r.nom}</option>`).join('')}
                                </select>
                                <select onchange="sauvegarderRepas('${jour}', 'repas1', this.value)" class="bg-slate-50 border border-slate-200 p-2 rounded-xl">
                                    <option value="">Repas Midi</option>
                                    ${recettesCache.map(r => `<option value="${r.id}" ${menuJour.repas1 == r.id ? 'selected' : ''}>${r.nom}</option>`).join('')}
                                </select>
                                <select onchange="sauvegarderRepas('${jour}', 'repas2', this.value)" class="bg-slate-50 border border-slate-200 p-2 rounded-xl">
                                    <option value="">Repas Soir</option>
                                    ${recettesCache.map(r => `<option value="${r.id}" ${menuJour.repas2 == r.id ? 'selected' : ''}>${r.nom}</option>`).join('')}
                                </select>
                                <select onchange="sauvegarderRepas('${jour}', 'dessertCollation', this.value)" class="bg-slate-50 border border-slate-200 p-2 rounded-xl">
                                    <option value="">Collation / Dessert</option>
                                    ${recettesCache.map(r => `<option value="${r.id}" ${menuJour.dessertcollation == r.id ? 'selected' : ''}>${r.nom}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Erreur chargement menu semaine", e);
            }
        }

        async function sauvegarderRepas(jour, typeRepas, idRecette) {
            const profil = document.getElementById('select-profil').value;
            if (!profil) return;

            // Récupérer l'état actuel des selects pour ce jour
            try {
                await fetch('/api/menu-prevu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        profil,
                        jour,
                        [typeRepas]: idRecette || null
                    })
                });
            } catch (e) {
                console.error("Erreur sauvegarde repas", e);
            }
        }

        // Fonctions globales de sécurité pour éviter les ReferenceError si cliquées
        function ouvrirModalPersonne() { alert("Gestion du profil accessible depuis la page Menu ou Ingrédients."); }
        function ouvrirModalCategoriesAleatoire() { alert("Fonctionnalité en cours de chargement."); }
        function genererSemaineAleatoireOptimisee() { alert("Génération intelligente en cours..."); }

        socket.on('data_updated', chargerMenuSemaine);
    </script>
</body>
</html>
