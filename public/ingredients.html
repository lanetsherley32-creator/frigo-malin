<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Ingrédients</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- Bibliothèque de scan -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow space-y-6">
        
        <!-- Navigation -->
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-xl font-bold text-gray-800">🥕 Gestion des Ingrédients</h1>
            <div class="flex gap-3 text-sm flex-wrap">
                <a href="index.html" class="text-blue-500 hover:underline">1. Menu</a>
                <a href="recettes.html" class="text-blue-500 hover:underline">2. Recettes</a>
                <a href="ingredients.html" class="font-bold text-blue-700 underline">3. Ingrédients</a>
                <a href="courses.html" class="text-blue-500 hover:underline">4. Courses</a>
                <a href="vider-frigo.html" class="text-blue-500 hover:underline">5. Vide ton frigo</a>
            </div>
        </div>

        <!-- Section Scanner & Formulaire -->
        <div class="bg-gray-50 p-4 rounded-lg border space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-gray-700 text-sm" id="titre-form-ing">Ajouter un ingrédient</h2>
                <button type="button" onclick="toggleScanner()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded font-bold text-xs flex items-center gap-1">
                    📷 Scanner un Produit (Code-barres)
                </button>
            </div>

            <!-- Bloc Caméra -->
            <div id="scanner-container" class="hidden bg-white p-4 rounded border space-y-2">
                <div id="reader" class="w-full max-w-sm mx-auto"></div>
                <div class="text-center text-xs text-gray-500">Pointez vers le code-barres</div>
                <div class="text-center">
                    <button type="button" onclick="fermerScanner()" class="bg-red-500 text-white px-3 py-1 rounded text-xs font-bold hover:bg-red-600">Fermer</button>
                </div>
            </div>

            <!-- Formulaire -->
            <form id="form-ingredient" onsubmit="sauvegarderIngredient(event)" class="space-y-4">
                <input type="hidden" id="ing-id">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                    <input type="text" id="ing-nom" placeholder="Nom" class="border p-2 rounded bg-white" required>
                    <input type="text" id="ing-marque" placeholder="Marque" class="border p-2 rounded bg-white">
                    <input type="text" id="ing-format" placeholder="Format" class="border p-2 rounded bg-white">
                    <input type="text" id="ing-unite" placeholder="Unité (g, ml)" class="border p-2 rounded bg-white" required>
                    <input type="number" step="any" id="ing-calories" placeholder="Calories" class="border p-2 rounded bg-white" required>
                    <input type="number" step="any" id="ing-proteines" placeholder="Protéines (g)" class="border p-2 rounded bg-white" required>
                    <input type="number" step="any" id="ing-glucides" placeholder="Glucides (g)" class="border p-2 rounded bg-white" required>
                    <input type="number" step="any" id="ing-lipides" placeholder="Lipides (g)" class="border p-2 rounded bg-white" required>
                </div>

                <div class="border-t pt-3">
                    <label class="font-bold text-xs">Prix par enseigne :</label>
                    <div id="liste-enseignes-container" class="space-y-2 mt-2"></div>
                    <button type="button" onclick="ajouterLigneEnseigne()" class="mt-2 bg-green-600 text-white px-2 py-1 rounded text-xs font-bold">+ Ajouter</button>
                </div>

                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold">Enregistrer</button>
            </form>
        </div>

        <!-- Liste -->
        <div class="overflow-x-auto border rounded-lg">
            <table class="w-full text-left text-xs">
                <thead class="bg-gray-100">
                    <tr><th class="p-2">Nom</th><th class="p-2">Prix</th><th class="p-2">Nutrition</th><th class="p-2">Actions</th></tr>
                </thead>
                <tbody id="tableau-ingredients"></tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        let html5QrCode = null;

        function ajouterLigneEnseigne(nom = '', prix = '') {
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center enseigne-ligne";
            div.innerHTML = `<input type="text" placeholder="Enseigne" value="${nom}" class="border p-1 rounded nom-enseigne flex-1"><input type="number" step="any" placeholder="Prix" value="${prix}" class="border p-1 rounded prix-enseigne w-20"><button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold">✕</button>`;
            document.getElementById('liste-enseignes-container').appendChild(div);
        }

        function toggleScanner() {
            const container = document.getElementById('scanner-container');
            container.classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (code) => {
                fermerScanner();
                rechercherOpenFoodFacts(code);
            });
        }

        function fermerScanner() {
            if (html5QrCode) html5QrCode.stop().then(() => document.getElementById('scanner-container').classList.add('hidden'));
        }

        async function rechercherOpenFoodFacts(barcode) {
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const data = await res.json();
                if (data.status === 1) {
                    const p = data.product;
                    document.getElementById('ing-nom').value = p.product_name || '';
                    document.getElementById('ing-marque').value = p.brands || '';
                    document.getElementById('ing-format').value = p.quantity || '';
                    const n = p.nutriments || {};
                    document.getElementById('ing-calories').value = n['energy-kcal_100g'] || 0;
                    document.getElementById('ing-proteines').value = n['proteins_100g'] || 0;
                    document.getElementById('ing-glucides').value = n['carbohydrates_100g'] || 0;
                    document.getElementById('ing-lipides').value = n['fat_100g'] || 0;
                    alert("Produit trouvé : " + (p.product_name || 'Inconnu'));
                } else {
                    alert("Produit inconnu dans la base.");
                }
            } catch (e) { alert("Erreur réseau"); }
        }

        async function sauvegarderIngredient(e) {
            e.preventDefault();
            const enseignes = Array.from(document.querySelectorAll('.enseigne-ligne')).map(l => ({
                nom: l.querySelector('.nom-enseigne').value,
                prix: parseFloat(l.querySelector('.prix-enseigne').value) || 0
            }));
            const data = {
                nom: document.getElementById('ing-nom').value,
                marque: document.getElementById('ing-marque').value,
                format: document.getElementById('ing-format').value,
                unite: document.getElementById('ing-unite').value,
                calories: document.getElementById('ing-calories').value,
                proteines: document.getElementById('ing-proteines').value,
                glucides: document.getElementById('ing-glucides').value,
                lipides: document.getElementById('ing-lipides').value,
                enseignes: enseignes
            };
            await fetch('/api/ingredients', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            alert("Enregistré !");
            location.reload();
        }

        // Appel initial
        ajouterLigneEnseigne();
    </script>
</body>
</html>
