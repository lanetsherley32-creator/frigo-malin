<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Ingrédients</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- Bibliothèque pour scanner les codes-barres avec la caméra -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4">
        
        <!-- Navigation Mobile Friendly -->
        <header class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🥗 Gestion des Ingrédients</h1>
            <nav class="grid grid-cols-5 gap-1 text-center text-xs font-medium">
                <a href="index.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Ingrédients</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
            </nav>
        </header>

        <!-- Scanner Caméra Code-Barres / Open Food Facts -->
        <section class="bg-indigo-50 p-4 rounded-2xl shadow-sm border border-indigo-200 space-y-3">
            <h2 class="font-bold text-indigo-900 text-sm flex items-center gap-1.5">📷 Scanner un code-barres (Open Food Facts)</h2>
            <div class="flex gap-2">
                <button type="button" onclick="demarrerScanner()" class="bg-indigo-600 active:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm">Allumer la caméra</button>
                <button type="button" onclick="arreterScanner()" class="bg-rose-600 active:bg-rose-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm">Éteindre</button>
            </div>
            <!-- Zone où la caméra s'affiche -->
            <div id="reader" class="w-full max-w-sm mx-auto rounded-xl overflow-hidden bg-black/5"></div>
        </section>

        <!-- Formulaire Ingrédient -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 id="form-title" class="font-bold text-slate-700 text-sm">➕ Ajouter ou modifier un ingrédient</h2>
            <form id="form-ingredient" onsubmit="sauvegarderIngredient(event)" class="space-y-4 text-xs">
                <input type="hidden" id="ingredient-id">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="space-y-1.5">
                        <label class="font-bold text-slate-700 text-xs">Nom de l'ingrédient :</label>
                        <input type="text" id="nom" placeholder="Ex: Riz blanc, Poulet..." class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium" required>
                    </div>
                    <div class="space-y-1.5">
                        <label class="font-bold text-slate-700 text-xs">Unité de mesure :</label>
                        <select id="unite" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium">
                            <option value="g">Grammes (g)</option>
                            <option value="ml">Millilitres (ml)</option>
                            <option value="pièce">Pièce(s)</option>
                            <option value="c.à.s">Cuillère à soupe</option>
                        </select>
                    </div>
                </div>

                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                    <span class="block font-bold text-slate-700 text-xs">Valeurs nutritionnelles (pour 100g ou 100ml) :</span>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Calories (kcal)</label>
                            <input type="number" step="any" id="calories" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Protéines (g)</label>
                            <input type="number" step="any" id="proteines" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Glucides (g)</label>
                            <input type="number" step="any" id="glucides" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Lipides (g)</label>
                            <input type="number" step="any" id="lipides" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-blue-600 active:bg-blue-700 text-white p-3 rounded-xl font-bold shadow-sm">Enregistrer l'ingrédient</button>
                    <button type="button" id="btn-annuler" onclick="reinitialiserFormulaire()" class="hidden bg-slate-200 active:bg-slate-300 text-slate-700 px-4 py-3 rounded-xl font-bold">Annuler</button>
                </div>
            </form>
        </section>

        <!-- Liste des Ingrédients -->
        <section class="space-y-3">
            <h2 class="font-bold text-slate-700 text-sm">📋 Liste des Ingrédients Enregistrés</h2>
            <div id="liste-ingredients-container" class="space-y-2">
                <p class="text-slate-400 italic text-xs">Chargement...</p>
            </div>
        </section>
    </div>

    <script>
        const socket = io();
        let html5QrCode = null;

        async function init() {
            const res = await fetch('/api/ingredients');
            const ingredients = await res.json();
            renderIngredients(ingredients);
        }

        function demarrerScanner() {
            const readerDiv = document.getElementById('reader');
            readerDiv.innerHTML = "<p class='p-3 text-xs text-slate-500 text-center'>Initialisation de la caméra...</p>";
            
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 100 }
                },
                async (decodedText) => {
                    await arreterScanner();
                    chercherParCodeBarresAutomatique(decodedText);
                },
                (errorMessage) => {}
            ).catch((err) => {
                console.error("Erreur caméra :", err);
                alert("Erreur Caméra : " + err);
                readerDiv.innerHTML = `<p class='p-3 text-xs text-rose-600 text-center font-bold'>Erreur : ${err}</p>`;
            });
        }

        async function arreterScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                try {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                } catch (err) {
                    console.error("Erreur à l'arrêt du scanner", err);
                }
            }
        }

        async function chercherParCodeBarresAutomatique(code) {
            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
                const data = await response.json();

                if (data.status === 1) {
                    const produit = data.product;
                    const nutriments = produit.nutriments || {};

                    document.getElementById('nom').value = produit.product_name || produit.brands || "Produit scanné";
                    document.getElementById('calories').value = Math.round(nutriments['energy-kcal_100g'] || nutriments['energy-kcal'] || 0);
                    document.getElementById('proteines').value = Math.round((nutriments['proteins_100g'] || 0) * 10) / 10;
                    document.getElementById('glucides').value = Math.round((nutriments['carbohydrates_100g'] || 0) * 10) / 10;
                    document.getElementById('lipides').value = Math.round((nutriments['fat_100g'] || 0) * 10) / 10;
                    document.getElementById('unite').value = "g";

                    alert("✅ Produit scanné et importé avec succès !");
                } else {
                    alert(`❌ Produit introuvable (Code: ${code}) dans Open Food Facts.`);
                }
            } catch (error) {
                console.error("Erreur:", error);
                alert("Erreur de connexion lors de la recherche du produit.");
            }
        }

        async function sauvegarderIngredient(e) {
            e.preventDefault();
            
            const id = document.getElementById('ingredient-id').value;
            const data = {
                nom: document.getElementById('nom').value.trim(),
                unite: document.getElementById('unite').value,
                calories: parseFloat(document.getElementById('calories').value) || 0,
                proteines: parseFloat(document.getElementById('proteines').value) || 0,
                glucides: parseFloat(document.getElementById('glucides').value) || 0,
                lipides: parseFloat(document.getElementById('lipides').value) || 0
            };

            const url = id ? `/api/ingredients/${id}` : '/api/ingredients';
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const errData = await response.json();
                alert(errData.error || "Erreur lors de l'enregistrement");
                return;
            }

            reinitialiserFormulaire();
            init();
        }

        function renderIngredients(ingredients) {
            const container = document.getElementById('liste-ingredients-container');
            if (ingredients.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic text-xs bg-white p-4 rounded-2xl border border-slate-200 text-center">Aucun ingrédient enregistré.</p>`;
                return;
            }

            container.innerHTML = ingredients.map(i => `
                <div class="bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs">
                    <div class="space-y-0.5">
                        <h3 class="font-bold text-slate-800 text-sm">${i.nom} <span class="text-slate-400 font-normal">(${i.unite || 'g'})</span></h3>
                        <p class="text-emerald-700 font-medium">🔥 ${i.calories || 0} kcal | P: ${i.proteines || 0}g | G: ${i.glucides || 0}g | L: ${i.lipides || 0}g <span class="text-slate-400 text-[10px]">(pour 100${i.unite || 'g'})</span></p>
                    </div>
                    <div class="flex gap-2 w-full sm:w-auto justify-end">
                        <button onclick='preparerModification(${JSON.stringify(i)})' class="bg-slate-100 active:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-bold">Modifier</button>
                        <button onclick="supprimerIngredient(${i.id})" class="bg-rose-100 active:bg-rose-200 text-rose-600 px-3 py-1.5 rounded-xl font-bold">Supprimer</button>
                    </div>
                </div>
            `).join('');
        }

        function preparerModification(i) {
            document.getElementById('ingredient-id').value = i.id;
            document.getElementById('nom').value = i.nom;
            document.getElementById('unite').value = i.unite || 'g';
            document.getElementById('calories').value = i.calories || 0;
            document.getElementById('proteines').value = i.proteines || 0;
            document.getElementById('glucides').value = i.glucides || 0;
            document.getElementById('lipides').value = i.lipides || 0;
            
            document.getElementById('form-title').innerText = "✏️ Modifier l'ingrédient";
            document.getElementById('btn-annuler').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function reinitialiserFormulaire() {
            document.getElementById('form-ingredient').reset();
            document.getElementById('ingredient-id').value = '';
            document.getElementById('form-title').innerText = "➕ Ajouter un ingrédient";
            document.getElementById('btn-annuler').classList.add('hidden');
        }

        async function supprimerIngredient(id) {
            if (confirm("Voulez-vous vraiment supprimer cet ingrédient ?")) {
                await fetch(`/api/ingredients/${id}`, { method: 'DELETE' });
                init();
            }
        }

        socket.on('data_updated', init);
        init();
    </script>
</body>
</html>
