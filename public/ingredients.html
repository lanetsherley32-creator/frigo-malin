<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Ingrédients</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- Bibliothèque de scan -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow space-y-6">
        
        <!-- Navigation -->
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-xl font-bold text-gray-800">🥕 Gestion des Ingrédients</h1>
            <div class="flex gap-3 text-sm flex-wrap">
                <a href="index.html" class="text-blue-500 hover:underline">1. Menu</a>
                <a href="recettes.html" class="text-blue-500 hover:underline">2. Recettes</a>
                <a href="ingredients.html" class="font-bold text-blue-700 underline">3. Ingrédients</a>
                <a href="courses.html" class="text-blue-500 hover:underline">4. Courses</a>
                <a href="vider-frigo.html" class="text-blue-500 hover:underline">5. Vide ton frigo</a>
            </div>
        </div>

        <!-- Section Actions (QR Code & Open Food Facts) -->
        <div class="bg-gray-50 p-4 rounded-lg border space-y-4">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h2 class="font-bold text-gray-700 text-sm" id="titre-form-ing">Ajouter un ingrédient</h2>
                <div class="flex gap-2">
                    <button type="button" onclick="toggleScanner('qrcode')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded font-bold text-xs">
                        📷 Scanner un QR Code
                    </button>
                    <button type="button" onclick="toggleScanner('barcode')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded font-bold text-xs">
                        🛒 Scanner Code-barres (Open Food Facts)
                    </button>
                </div>
            </div>

            <!-- Bloc Caméra unique pour les deux -->
            <div id="scanner-container" class="hidden bg-white p-4 rounded border space-y-2">
                <div id="reader" class="w-full max-w-sm mx-auto"></div>
                <div class="text-center text-xs text-gray-500" id="scanner-instruction">Pointez vers le code</div>
                <div class="text-center">
                    <button type="button" onclick="fermerScanner()" class="bg-red-500 text-white px-3 py-1 rounded text-xs font-bold">Fermer la caméra</button>
                </div>
            </div>

            <!-- Recherche textuelle Open Food Facts alternative -->
            <div class="flex gap-2 items-center bg-white p-2 rounded border">
                <input type="text" id="recherche-off" placeholder="Ou chercher un produit sur Open Food Facts (ex: Nutella)..." class="border p-1.5 rounded text-xs flex-1">
                <button type="button" onclick="chercherTexteOpenFoodFacts()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold">Rechercher</button>
            </div>

            <!-- Formulaire -->
            <form id="form-ingredient" onsubmit="sauvegarderIngredient(event)" class="space-y-4">
                <input type="hidden" id="ing-id">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                    <input type="text" id="ing-nom" placeholder="Nom" class="border p-2 rounded bg-white" required>
                    <input type="text" id="ing-marque" placeholder="Marque" class="border p-2 rounded bg-white">
                    <input type="text" id="ing-format" placeholder="Format" class="border p-2 rounded bg-white">
                    <input type="text" id="ing-unite" placeholder="Unité (g, ml)" class="border p-2 rounded bg-white" required>
                    <input type="number" step="any" id="ing-calories" placeholder="Calories" class="border p-2 rounded bg-white" required>
                    <input type="number" step="any" id="ing-proteines" placeholder="Protéines (g)" class="border p-2 rounded bg-white" required>
                    <input type="number" step="any" id="ing-glucides" placeholder="Glucides (g)" class="border p-2 rounded bg-white" required>
                    <input type="number" step="any" id="ing-lipides" placeholder="Lipides (g)" class="border p-2 rounded bg-white" required>
                </div>

                <div class="border-t pt-3">
                    <label class="font-bold text-xs">Prix par enseigne :</label>
                    <div id="liste-enseignes-container" class="space-y-2 mt-2"></div>
                    <button type="button" onclick="ajouterLigneEnseigne()" class="mt-2 bg-green-600 text-white px-2 py-1 rounded text-xs font-bold">+ Ajouter</button>
                </div>

                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold">Enregistrer l'ingrédient</button>
            </form>
        </div>

        <!-- Liste -->
        <div class="overflow-x-auto border rounded-lg">
            <table class="w-full text-left text-xs">
                <thead class="bg-gray-100">
                    <tr><th class="p-2">Nom</th><th class="p-2">Prix</th><th class="p-2">Nutrition</th><th class="p-2">Actions</th></tr>
                </thead>
                <tbody id="tableau-ingredients"></tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        let html5QrCode = null;
        let actuelModeScan = 'qrcode';

        function ajouterLigneEnseigne(nom = '', prix = '') {
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center enseigne-ligne";
            div.innerHTML = `<input type="text" placeholder="Enseigne" value="${nom}" class="border p-1 rounded nom-enseigne flex-1"><input type="number" step="any" placeholder="Prix" value="${prix}" class="border p-1 rounded prix-enseigne w-20"><button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold">✕</button>`;
            document.getElementById('liste-enseignes-container').appendChild(div);
        }

        function toggleScanner(mode) {
            actuelModeScan = mode;
            const container = document.getElementById('scanner-container');
            const instruction = document.getElementById('scanner-instruction');
            
            container.classList.remove('hidden');
            instruction.innerText = mode === 'qrcode' ? "Pointez vers le QR Code" : "Pointez vers le Code-barres";

            if (html5QrCode) {
                html5QrCode.clear().catch(() => {});
            }

            html5QrCode = new Html5Qrcode("reader");
            
            const config = { 
                fps: 15, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (code) => {
                    fermerScanner();
                    if (actuelModeScan === 'qrcode') {
                        traiterQRScan(code);
                    } else {
                        rechercherOpenFoodFactsParBarcode(code);
                    }
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("Erreur d'accès à la caméra : " + err);
                container.classList.add('hidden');
            });
        }

        function fermerScanner() {
            if (html5QrCode) {
                html5QrCode.stop().catch(() => {}).finally(() => {
                    document.getElementById('scanner-container').classList.add('hidden');
                });
            } else {
                document.getElementById('scanner-container').classList.add('hidden');
            }
        }

        // 1. GESTION DU QR CODE (Format JSON)
        function traiterQRScan(text) {
            try {
                let data = JSON.parse(text);
                document.getElementById('ing-nom').value = data.nom || '';
                document.getElementById('ing-marque').value = data.marque || '';
                document.getElementById('ing-format').value = data.format || '';
                document.getElementById('ing-unite').value = data.unite || 'g';
                document.getElementById('ing-calories').value = data.calories || 0;
                document.getElementById('ing-proteines').value = data.proteines || 0;
                document.getElementById('ing-glucides').value = data.glucides || 0;
                document.getElementById('ing-lipides').value = data.lipides || 0;

                document.getElementById('liste-enseignes-container').innerHTML = '';
                if (data.enseignes && Array.isArray(data.enseignes)) {
                    data.enseignes.forEach(e => ajouterLigneEnseigne(e.nom, e.prix));
                } else {
                    ajouterLigneEnseigne();
                }
                alert("QR Code chargé avec succès !");
            } catch (e) {
                alert("Le contenu scanné n'est pas un QR code JSON valide : " + text);
            }
        }

        // 2. GESTION OPEN FOOD FACTS (Par Code-barres)
        async function rechercherOpenFoodFactsParBarcode(barcode) {
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const data = await res.json();
                if (data.status === 1) {
                    remplirChampsOpenFoodFacts(data.product);
                } else {
                    alert("Produit inconnu dans Open Food Facts.");
                }
            } catch (e) { alert("Erreur réseau Open Food Facts"); }
        }

        // 3. GESTION OPEN FOOD FACTS (Par Recherche Texte)
        async function chercherTexteOpenFoodFacts() {
            const query = document.getElementById('recherche-off').value.trim();
            if (!query) return;
            try {
                const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1`);
                const data = await res.json();
                if (data.products && data.products.length > 0) {
                    remplirChampsOpenFoodFacts(data.products[0]);
                } else {
                    alert("Aucun produit trouvé pour : " + query);
                }
            } catch (e) { alert("Erreur lors de la recherche texte"); }
        }

        function remplirChampsOpenFoodFacts(p) {
            document.getElementById('ing-nom').value = p.product_name || '';
            document.getElementById('ing-marque').value = p.brands || '';
            document.getElementById('ing-format').value = p.quantity || '';
            document.getElementById('ing-unite').value = 'g';
            const n = p.nutriments || {};
            document.getElementById('ing-calories').value = n['energy-kcal_100g'] || 0;
            document.getElementById('ing-proteines').value = n['proteins_100g'] || 0;
            document.getElementById('ing-glucides').value = n['carbohydrates_100g'] || 0;
            document.getElementById('ing-lipides').value = n['fat_100g'] || 0;
            alert("Produit Open Food Facts chargé : " + (p.product_name || 'Inconnu'));
        }

        async function sauvegarderIngredient(e) {
            e.preventDefault();
            const enseignes = Array.from(document.querySelectorAll('.enseigne-ligne')).map(l => ({
                nom: l.querySelector('.nom-enseigne').value,
                prix: parseFloat(l.querySelector('.prix-enseigne').value) || 0
            }));
            const data = {
                nom: document.getElementById('ing-nom').value,
                marque: document.getElementById('ing-marque').value,
                format: document.getElementById('ing-format').value,
                unite: document.getElementById('ing-unite').value,
                calories: document.getElementById('ing-calories').value,
                proteines: document.getElementById('ing-proteines').value,
                glucides: document.getElementById('ing-glucides').value,
                lipides: document.getElementById('ing-lipides').value,
                enseignes: enseignes
            };
            await fetch('/api/ingredients', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            alert("Ingrédient enregistré !");
            location.reload();
        }

        ajouterLigneEnseigne();
    </script>
</body>
</html>
