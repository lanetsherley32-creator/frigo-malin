<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Ingrédients</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4">
        
        <!-- Navigation Mobile Friendly -->
        <header class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🥗 Gestion des Ingrédients</h1>
            <nav class="grid grid-cols-5 gap-1 text-center text-xs font-medium">
                <a href="index.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Ingrédients</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
            </nav>
        </header>

        <!-- Recherche Open Food Facts -->
        <section class="bg-indigo-50 p-4 rounded-2xl shadow-sm border border-indigo-200 space-y-3">
            <h2 class="font-bold text-indigo-900 text-sm flex items-center gap-1.5">🔍 Rechercher un produit (Open Food Facts)</h2>
            <div class="flex gap-2">
                <input type="text" id="recherche-off-ing" placeholder="Ex: Pâtes, Lait, Nutella..." class="flex-1 border border-indigo-200 p-2.5 rounded-xl bg-white text-xs font-medium">
                <button type="button" onclick="rechercherOffIngredient()" class="bg-indigo-600 active:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-sm">Rechercher</button>
            </div>
            <div id="resultats-off-container" class="hidden space-y-2 pt-1"></div>
        </section>

        <!-- Formulaire Ingrédient -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 id="form-title" class="font-bold text-slate-700 text-sm">➕ Ajouter ou modifier un ingrédient</h2>
            <form id="form-ingredient" onsubmit="sauvegarderIngredient(event)" class="space-y-4 text-xs">
                <input type="hidden" id="ingredient-id">
                
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="space-y-1.5">
                        <label class="font-bold text-slate-700 text-xs">Nom :</label>
                        <input type="text" id="nom" placeholder="Ex: Riz blanc" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium" required>
                    </div>
                    <div class="space-y-1.5">
                        <label class="font-bold text-slate-700 text-xs">Marque :</label>
                        <input type="text" id="marque" placeholder="Ex: Barilla..." class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium">
                    </div>
                    <div class="space-y-1.5">
                        <label class="font-bold text-slate-700 text-xs">Format / Conditionnement :</label>
                        <input type="text" id="format" placeholder="Ex: 500g, 1L..." class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="space-y-1.5">
                        <label class="font-bold text-slate-700 text-xs">Unité de mesure :</label>
                        <select id="unite" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium">
                            <option value="g">Grammes (g)</option>
                            <option value="ml">Millilitres (ml)</option>
                            <option value="pièce">Pièce(s)</option>
                            <option value="c.à.s">Cuillère à soupe</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="font-bold text-slate-700 text-xs">Rayon :</label>
                        <select id="rayon" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium">
                            <option value="Fruits et Légumes">Fruits et Légumes</option>
                            <option value="Épicerie">Épicerie</option>
                            <option value="Frais">Frais</option>
                            <option value="Surgelés">Surgelés</option>
                            <option value="Boissons">Boissons</option>
                            <option value="Divers / Autres">Divers / Autres</option>
                        </select>
                    </div>
                </div>

                <!-- Prix par enseigne -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                    <span class="block font-bold text-slate-700 text-xs">Prix indicatif selon les enseignes (€) :</span>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Leclerc</label>
                            <input type="number" step="any" id="prix-leclerc" placeholder="0.00" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Carrefour</label>
                            <input type="number" step="any" id="prix-carrefour" placeholder="0.00" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Lidl</label>
                            <input type="number" step="any" id="prix-lidl" placeholder="0.00" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                    </div>
                </div>

                <!-- Valeurs nutritionnelles -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                    <span class="block font-bold text-slate-700 text-xs">Valeurs nutritionnelles (pour 100g ou 100ml) :</span>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Calories (kcal)</label>
                            <input type="number" step="any" id="calories" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Protéines (g)</label>
                            <input type="number" step="any" id="proteines" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Glucides (g)</label>
                            <input type="number" step="any" id="glucides" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 font-bold mb-1">Lipides (g)</label>
                            <input type="number" step="any" id="lipides" placeholder="0" class="border border-slate-200 p-2 rounded-xl bg-white w-full font-medium">
                        </div>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-blue-600 active:bg-blue-700 text-white p-3 rounded-xl font-bold shadow-sm">Enregistrer l'ingrédient</button>
                    <button type="button" id="btn-annuler" onclick="reinitialiserFormulaire()" class="hidden bg-slate-200 active:bg-slate-300 text-slate-700 px-4 py-3 rounded-xl font-bold">Annuler</button>
                </div>
            </form>
        </section>

        <!-- Liste des Ingrédients -->
        <section class="space-y-3">
            <h2 class="font-bold text-slate-700 text-sm">📋 Liste des Ingrédients Enregistrés</h2>
            <div id="liste-ingredients-container" class="space-y-2">
                <p class="text-slate-400 italic text-xs">Chargement...</p>
            </div>
        </section>
    </div>

    <script>
        // Connexion sécurisée Socket.io
        let socket;
        try {
            socket = io();
            socket.on('data_updated', init);
        } catch (e) {
            console.warn("Socket.io non initialisé", e);
        }

        async function init() {
            try {
                const container = document.getElementById('liste-ingredients-container');
                container.innerHTML = `<p class="text-slate-400 italic text-xs">Chargement en cours...</p>`;

                const res = await fetch('/api/ingredients');
                if (!res.ok) throw new Error("Erreur réseau lors de la récupération");
                
                const ingredients = await res.json();
                renderIngredients(ingredients);
            } catch (err) {
                console.error("Erreur dans init():", err);
                document.getElementById('liste-ingredients-container').innerHTML = `<p class="text-rose-500 italic text-xs">Erreur de chargement des données.</p>`;
            }
        }

        async function rechercherOffIngredient() {
            const query = document.getElementById('recherche-off-ing').value.trim();
            if(!query) return;
            try {
                const res = await fetch(`/api/recherche-produit?q=${encodeURIComponent(query)}`);
                const produits = await res.json();
                const container = document.getElementById('resultats-off-container');
                container.classList.remove('hidden');

                if(!produits || produits.length === 0) {
                    container.innerHTML = `<p class="text-slate-500 text-xs italic">Aucun produit trouvé.</p>`;
                    return;
                }

                container.innerHTML = produits.map(p => `
                    <div class="flex justify-between items-center bg-white p-2.5 rounded-xl border border-indigo-100 text-xs shadow-sm">
                        <div>
                            <span class="font-bold text-slate-800">${p.nom}</span>
                            ${p.marque ? `<span class="text-slate-400 text-[10px] block">Marque : ${p.marque}</span>` : ''}
                        </div>
                        <button type="button" onclick='remplirDepuisOFF(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="bg-indigo-600 active:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-bold">Sélectionner</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Erreur recherche OFF", err);
            }
        }

        function remplirDepuisOFF(p) {
            document.getElementById('nom').value = p.nom || '';
            document.getElementById('marque').value = p.marque || '';
            document.getElementById('format').value = p.format || '';
            document.getElementById('calories').value = p.calories || 0;
            document.getElementById('proteines').value = p.proteines || 0;
            document.getElementById('glucides').value = p.glucides || 0;
            document.getElementById('lipides').value = p.lipides || 0;
            
            document.getElementById('resultats-off-container').classList.add('hidden');
            document.getElementById('recherche-off-ing').value = '';
            alert("✅ Produit importé dans le formulaire !");
        }

        async function sauvegarderIngredient(e) {
            e.preventDefault();
            
            const id = document.getElementById('ingredient-id').value;
            const data = {
                nom: document.getElementById('nom').value.trim(),
                marque: document.getElementById('marque').value.trim(),
                format: document.getElementById('format').value.trim(),
                unite: document.getElementById('unite').value,
                rayon: document.getElementById('rayon').value,
                prixLeclerc: parseFloat(document.getElementById('prix-leclerc').value) || 0,
                prixCarrefour: parseFloat(document.getElementById('prix-carrefour').value) || 0,
                prixLidl: parseFloat(document.getElementById('prix-lidl').value) || 0,
                calories: parseFloat(document.getElementById('calories').value) || 0,
                proteines: parseFloat(document.getElementById('proteines').value) || 0,
                glucides: parseFloat(document.getElementById('glucides').value) || 0,
                lipides: parseFloat(document.getElementById('lipides').value) || 0
            };

            const url = id ? `/api/ingredients/${id}` : '/api/ingredients';
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const errData = await response.json();
                alert(errData.error || "Erreur lors de l'enregistrement");
                return;
            }

            reinitialiserFormulaire();
            init();
        }

        function renderIngredients(ingredients) {
            const container = document.getElementById('liste-ingredients-container');
            if (!ingredients || ingredients.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic text-xs bg-white p-4 rounded-2xl border border-slate-200 text-center">Aucun ingrédient enregistré.</p>`;
                return;
            }

            container.innerHTML = ingredients.map(i => `
                <div class="bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-slate-800 text-sm">${i.nom}</h3>
                            ${i.marque ? `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md text-[10px] font-bold">${i.marque}</span>` : ''}
                            ${i.format ? `<span class="text-slate-400 text-[10px]">(${i.format})</span>` : ''}
                        </div>
                        <p class="text-emerald-700 font-medium">🔥 ${i.calories || 0} kcal | P: ${i.proteines || 0}g | G: ${i.glucides || 0}g | L: ${i.lipides || 0}g</p>
                        <div class="flex gap-2 text-[10px] text-slate-500">
                            <span>Leclerc: <strong>${i.prixLeclerc || 0}€</strong></span>
                            <span>Carrefour: <strong>${i.prixCarrefour || 0}€</strong></span>
                            <span>Lidl: <strong>${i.prixLidl || 0}€</strong></span>
                        </div>
                    </div>
                    <div class="flex gap-2 w-full sm:w-auto justify-end">
                        <button onclick='preparerModification(${JSON.stringify(i)})' class="bg-slate-100 active:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl font-bold">Modifier</button>
                        <button onclick="supprimerIngredient(${i.id})" class="bg-rose-100 active:bg-rose-200 text-rose-600 px-3 py-1.5 rounded-xl font-bold">Supprimer</button>
                    </div>
                </div>
            `).join('');
        }

        function preparerModification(i) {
            document.getElementById('ingredient-id').value = i.id;
            document.getElementById('nom').value = i.nom || '';
            document.getElementById('marque').value = i.marque || '';
            document.getElementById('format').value = i.format || '';
            document.getElementById('unite').value = i.unite || 'g';
            document.getElementById('rayon').value = i.rayon || 'Divers / Autres';
            document.getElementById('prix-leclerc').value = i.prixLeclerc || '';
            document.getElementById('prix-carrefour').value = i.prixCarrefour || '';
            document.getElementById('prix-lidl').value = i.prixLidl || '';
            document.getElementById('calories').value = i.calories || 0;
            document.getElementById('proteines').value = i.proteines || 0;
            document.getElementById('glucides').value = i.glucides || 0;
            document.getElementById('lipides').value = i.lipides || 0;
            
            document.getElementById('form-title').innerText = "✏️ Modifier l'ingrédient";
            document.getElementById('btn-annuler').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function reinitialiserFormulaire() {
            document.getElementById('form-ingredient').reset();
            document.getElementById('ingredient-id').value = '';
            document.getElementById('form-title').innerText = "➕ Ajouter ou modifier un ingrédient";
            document.getElementById('btn-annuler').classList.add('hidden');
        }

        async function supprimerIngredient(id) {
            if (confirm("Voulez-vous vraiment supprimer cet ingrédient ?")) {
                await fetch(`/api/ingredients/${id}`, { method: 'DELETE' });
                init();
            }
        }

        // Lancement direct au chargement de la page
        init();
    </script>
</body>
</html>
