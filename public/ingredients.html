<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Ingrédients - Frigomalin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-12 text-slate-800">
    <div class="max-w-4xl mx-auto p-4 space-y-4">
        
        <!-- En-tête & Navigation -->
        <header class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <div class="flex justify-between items-center text-xs pb-3 border-b border-slate-100">
                <span id="nom-utilisateur-connecte" class="font-bold text-slate-700">👤 Chargement du compte...</span>
                <div class="flex items-center gap-2">
                    <select id="select-profil" onchange="changerProfil()" class="bg-slate-50 border border-slate-200 px-2 py-1 rounded-lg text-xs font-bold text-blue-600 outline-none">
                        <option value="">Chargement profil...</option>
                    </select>
                    <button onclick="deconnexion()" class="text-red-500 hover:text-red-700 font-bold">Se déconnecter</button>
                </div>
            </div>

            <div class="flex justify-between items-center flex-wrap gap-2">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🥕 Gestion des Ingrédients</h1>
            </div>

            <nav class="grid grid-cols-7 gap-1 text-center text-[11px] font-medium pt-1">
                <a href="global.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Mon compte</a>
                <a href="planification.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Planification</a>
                <a href="suivi.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Suivi</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Ingrédients</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
                <a href="favori.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Favori</a>
            </nav>
        </header>

        <!-- 1. Recherche globale -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2">
            <label class="font-bold text-slate-700 text-sm block">🔍 Recherche d'un aliment :</label>
            <input type="text" id="input-recherche-globale" oninput="rechercherAlimentGlobal()" placeholder="Tapez le nom d'un aliment existant..." class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full text-xs font-medium">
        </section>

        <!-- 2. Catégories / Rayons -->
        <section class="space-y-3">
            <h2 class="font-bold text-slate-700 text-sm">📂 Catégories (Rayons)</h2>
            <div id="categories-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5"></div>
            <div id="conteneur-affichage-dynamique" class="space-y-2 pt-2"></div>
        </section>

        <!-- 3. Formulaire d'ajout ou modification -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <button type="button" onclick="toggleFormulaire()" class="w-full flex justify-between items-center text-left font-bold text-slate-700 text-sm py-1 focus:outline-none">
                <span id="form-toggle-title">➕ Ajouter ou modifier un ingrédient (cliquer pour ouvrir)</span>
                <span id="form-toggle-arrow" class="text-slate-400 text-base transition-transform">▼</span>
            </button>

            <div id="form-content-container" class="hidden space-y-4 pt-2 border-t border-slate-100">
                
                <!-- Open Food Facts -->
                <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-200 space-y-2">
                    <h3 class="font-bold text-indigo-900 text-xs flex items-center gap-1.5">🔍 Importer depuis Open Food Facts</h3>
                    <div class="flex gap-2">
                        <input type="text" id="recherche-off-ing" placeholder="Ex: Pâtes Barilla, Lait..." class="flex-1 border border-indigo-200 p-2 rounded-lg bg-white text-xs font-medium">
                        <button type="button" onclick="rechercherOffIngredient()" class="bg-indigo-600 active:bg-indigo-700 text-white px-3 py-2 rounded-lg text-xs font-bold">Rechercher</button>
                    </div>
                    <div id="resultats-off-container" class="hidden space-y-2 pt-1"></div>
                </div>

                <form id="form-ingredient" onsubmit="sauvegarderIngredient(event)" class="space-y-4 text-xs">
                    <input type="hidden" id="ingredient-id">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="space-y-1.5">
                            <label class="font-bold text-slate-700 text-xs">Nom de l'ingrédient / Référence :</label>
                            <input type="text" id="nom" placeholder="Ex: Riz blanc" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium" required>
                        </div>
                        <div class="space-y-1.5">
                            <label class="font-bold text-slate-700 text-xs">Rayon :</label>
                            <select id="rayon" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full font-medium">
                                <option value="Fruit">Fruit</option>
                                <option value="Légume">Légume</option>
                                <option value="Conserve">Conserve</option>
                                <option value="Épicerie salée">Épicerie salée</option>
                                <option value="Épicerie sucrée">Épicerie sucrée</option>
                                <option value="Viande">Viande</option>
                                <option value="Poisson">Poisson</option>
                                <option value="Crémerie">Crémerie</option>
                                <option value="Surgelé">Surgelé</option>
                                <option value="Boisson">Boisson</option>
                                <option value="Divers / Autre">Divers / Autre</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-3 pt-2 border-t border-slate-100">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-700 text-xs">🏷️ Marques & Valeurs Nutritionnelles :</span>
                            <button type="button" onclick="ajouterBlocMarque()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl font-bold text-xs shadow-sm">+ Ajouter une marque</button>
                        </div>
                        <div id="marques-container" class="space-y-4"></div>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-1 bg-blue-600 active:bg-blue-700 text-white p-3 rounded-xl font-bold shadow-sm">Enregistrer l'ingrédient</button>
                        <button type="button" id="btn-annuler" onclick="reinitialiserFormulaire()" class="hidden bg-slate-200 active:bg-slate-300 text-slate-700 px-4 py-3 rounded-xl font-bold">Annuler / Fermer</button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <!-- Scripts JavaScript complets -->
    <script>
        let socket;
        let listeGlobaleIngredients = [];
        let favorisIngredientsCache = [];
        const rayonsDisponibles = [
            "Fruit", "Légume", "Conserve", "Épicerie salée", 
            "Épicerie sucrée", "Viande", "Poisson", "Crémerie", 
            "Surgelé", "Boisson", "Divers / Autre"
        ];
        const enseignesDisponibles = ["Leclerc", "Carrefour", "Lidl", "Auchan", "Intermarché", "Super U", "Monoprix", "Aldi"];

        try {
            socket = io();
            socket.on('data_updated', () => { init(); chargerFavoris(); });
        } catch (e) {
            console.warn("Socket.io non initialisé", e);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await chargerInfosUtilisateur();
            await chargerProfils();
            await init();
            await chargerFavoris();
        });

        async function chargerInfosUtilisateur() {
            try {
                const res = await fetch('/api/current-user');
                if (res.ok) {
                    const user = await res.json();
                    const element = document.getElementById('nom-utilisateur-connecte');
                    if (element) element.innerText = `👤 Compte : ${user.nom} (${user.email})`;
                } else {
                    window.location.href = '/login.html';
                }
            } catch (e) {
                console.error("Erreur chargement utilisateur", e);
            }
        }

        async function chargerProfils() {
            try {
                const res = await fetch('/api/personnes-objectifs');
                const profils = await res.json();
                const select = document.getElementById('select-profil');
                if (!select) return;

                select.innerHTML = '';
                if (profils.length === 0) {
                    select.innerHTML = '<option value="">Aucun profil</option>';
                    return;
                }

                select.innerHTML = profils.map(p => `<option value="${p.nom}">${p.nom}</option>`).join('');
                
                const savedProfil = localStorage.getItem('profilActif') || localStorage.getItem('profil_actif');
                if (savedProfil && profils.some(p => p.nom === savedProfil)) {
                    select.value = savedProfil;
                } else if (profils.length > 0) {
                    select.value = profils[0].nom;
                    localStorage.setItem('profilActif', profils[0].nom);
                }
            } catch (err) {
                console.error("Erreur chargement profils", err);
            }
        }

        function changerProfil() {
            const select = document.getElementById('select-profil');
            if (select) {
                localStorage.setItem('profilActif', select.value);
                chargerFavoris();
            }
        }

        async function deconnexion() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        async function init() {
            try {
                const res = await fetch('/api/ingredients');
                if (!res.ok) throw new Error("Erreur réseau");
                listeGlobaleIngredients = await res.json();
                renderCategories();
                
                // Actualiser l'affichage dynamique s'il y a une recherche ou un rayon ouvert
                const inputRecherche = document.getElementById('input-recherche-globale')?.value;
                if (inputRecherche) {
                    rechercherAlimentGlobal();
                } else {
                    const titreRayon = document.querySelector('#conteneur-affichage-dynamique h3');
                    if (titreRayon && titreRayon.innerText.includes('Rayon :')) {
                        const nomRayon = titreRayon.innerText.split('Rayon :')[1].split('(')[0].trim();
                        afficherRayon(nomRayon);
                    }
                }
            } catch (err) {
                console.error("Erreur dans init():", err);
            }
        }

        async function chargerFavoris() {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) return;

            try {
                const res = await fetch(`/api/favoris?profil=${encodeURIComponent(profil)}`);
                if (res.ok) {
                    const data = await res.json();
                    favorisIngredientsCache = data.ingredients || [];
                } else {
                    const localData = localStorage.getItem(`favoris_${profil}`);
                    if (localData) {
                        favorisIngredientsCache = JSON.parse(localData).ingredients || [];
                    }
                }
            } catch (e) {
                const localData = localStorage.getItem(`favoris_${profil}`);
                if (localData) {
                    favorisIngredientsCache = JSON.parse(localData).ingredients || [];
                }
            }
            
            const inputRecherche = document.getElementById('input-recherche-globale')?.value;
            if (inputRecherche) {
                rechercherAlimentGlobal();
            }
        }

        async function toggleFavoriIngredient(nomIngredient) {
            const profil = document.getElementById('select-profil')?.value;
            if (!profil) {
                alert("Veuillez sélectionner un profil.");
                return;
            }

            const index = favorisIngredientsCache.findIndex(i => (i.nom || i) === nomIngredient);
            if (index > -1) {
                favorisIngredientsCache.splice(index, 1);
            } else {
                const ingObj = listeGlobaleIngredients.find(i => i.nom === nomIngredient) || { nom: nomIngredient };
                favorisIngredientsCache.push(ingObj);
            }

            let allFavs = { recettes: [], ingredients: favorisIngredientsCache };
            try {
                const res = await fetch(`/api/favoris?profil=${encodeURIComponent(profil)}`);
                if (res.ok) {
                    const data = await res.json();
                    allFavs.recettes = data.recettes || [];
                }
            } catch(e) {}
            allFavs.ingredients = favorisIngredientsCache;
            localStorage.setItem(`favoris_${profil}`, JSON.stringify(allFavs));

            try {
                await fetch('/api/favoris', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profil, favoris: allFavs })
                });
            } catch (e) {
                console.error("Erreur synchro serveur favoris", e);
            }

            const inputRecherche = document.getElementById('input-recherche-globale')?.value;
            if (inputRecherche) {
                rechercherAlimentGlobal();
            } else {
                const titreRayon = document.querySelector('#conteneur-affichage-dynamique h3');
                if (titreRayon && titreRayon.innerText.includes('Rayon :')) {
                    const nomRayon = titreRayon.innerText.split('Rayon :')[1].split('(')[0].trim();
                    afficherRayon(nomRayon);
                }
            }
        }

        function toggleFormulaire() {
            const container = document.getElementById('form-content-container');
            const arrow = document.getElementById('form-toggle-arrow');
            const isHidden = container.classList.contains('hidden');
            
            if (isHidden) {
                container.classList.remove('hidden');
                arrow.innerText = "▲";
                if(document.getElementById('marques-container').children.length === 0) {
                    ajouterBlocMarque();
                }
            } else {
                container.classList.add('hidden');
                arrow.innerText = "▼";
            }
        }

        function ouvrirFormulaireModification(i) {
            const container = document.getElementById('form-content-container');
            container.classList.remove('hidden');
            document.getElementById('form-toggle-arrow').innerText = "▲";
            
            document.getElementById('ingredient-id').value = i.id;
            document.getElementById('nom').value = i.nom || '';
            document.getElementById('rayon').value = i.rayon || 'Épicerie salée';
            
            document.getElementById('marques-container').innerHTML = '';
            
            if (i.marques && Array.isArray(i.marques) && i.marques.length > 0) {
                i.marques.forEach(m => ajouterBlocMarque(m));
            } else {
                ajouterBlocMarque({
                    nom: i.nom || '',
                    calories: i.calories || 0,
                    proteines: i.proteines || 0,
                    glucides: i.glucides || 0,
                    sucres: i.sucre || i.sucres || 0,
                    lipides: i.lipides || 0,
                    fibres: i.fibres || 0,
                    quantite_portion: i.portion_quantite || '',
                    unite_portion: i.portion_unite || 'g',
                    formats: [{ qte: i.quantite_paquet || 1, unite: i.unite || 'g', prix_enseignes: i.prix_enseignes || {} }]
                });
            }

            document.getElementById('form-toggle-title').innerText = "✏️ Modifier l'ingrédient : " + (i.nom || '');
            document.getElementById('btn-annuler').classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function reinitialiserFormulaire() {
            document.getElementById('form-ingredient').reset();
            document.getElementById('ingredient-id').value = '';
            document.getElementById('marques-container').innerHTML = '';
            document.getElementById('form-toggle-title').innerText = "➕ Ajouter ou modifier un ingrédient (cliquer pour ouvrir)";
            document.getElementById('btn-annuler').classList.add('hidden');
            document.getElementById('form-content-container').classList.add('hidden');
            document.getElementById('form-toggle-arrow').innerText = "▼";
            ajouterBlocMarque();
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = rayonsDisponibles.map(rayon => {
                const count = listeGlobaleIngredients.filter(i => (i.rayon || 'Épicerie salée') === rayon).length;
                return `
                    <button onclick="afficherRayon('${rayon}')" class="bg-white p-3 rounded-xl border border-slate-200 hover:border-blue-400 hover:bg-blue-50/30 text-left transition space-y-1 shadow-sm">
                        <div class="font-bold text-slate-800 text-xs">${rayon}</div>
                        <div class="text-[10px] text-slate-400">${count} aliment(s)</div>
                    </button>
                `;
            }).join('');
        }

        function afficherRayon(rayonNom) {
            const container = document.getElementById('conteneur-affichage-dynamique');
            const ingredientsRayon = listeGlobaleIngredients.filter(i => (i.rayon || 'Épicerie salée') === rayonNom);

            container.innerHTML = `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-blue-900 text-xs">Rayon : ${rayonNom} (${ingredientsRayon.length})</h3>
                        <button onclick="document.getElementById('conteneur-affichage-dynamique').innerHTML=''" class="text-slate-400 hover:text-slate-600 text-xs font-bold">Fermer ✕</button>
                    </div>
                    <div class="space-y-2">
                        ${ingredientsRayon.length === 0 ? '<p class="text-slate-400 italic text-xs">Aucun ingrédient dans ce rayon.</p>' : ingredientsRayon.map(i => genererHtmlIngredient(i)).join('')}
                    </div>
                </div>
            `;
        }

        function rechercherAlimentGlobal() {
            const terme = document.getElementById('input-recherche-globale').value.toLowerCase().trim();
            const container = document.getElementById('conteneur-affichage-dynamique');

            if (!terme) {
                container.innerHTML = '';
                return;
            }

            const resultats = listeGlobaleIngredients.filter(i => (i.nom || '').toLowerCase().includes(terme));

            container.innerHTML = `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-indigo-900 text-xs">Résultats de recherche (${resultats.length})</h3>
                        <button onclick="document.getElementById('conteneur-affichage-dynamique').innerHTML=''" class="text-slate-400 hover:text-slate-600 text-xs font-bold">Fermer ✕</button>
                    </div>
                    <div class="space-y-2">
                        ${resultats.length === 0 ? '<p class="text-slate-400 italic text-xs">Aucun aliment trouvé.</p>' : resultats.map(i => genererHtmlIngredient(i)).join('')}
                    </div>
                </div>
            `;
        }

        function genererHtmlIngredient(i) {
            let marquesHtml = '';
            const nomAffichage = i.nom || 'Sans nom';
            const estFavori = favorisIngredientsCache.some(fav => (fav.nom || fav) === nomAffichage);
            
            if (i.marques && Array.isArray(i.marques)) {
                marquesHtml = i.marques.map(m => {
                    let formatsHtml = '';
                    if (m.formats && Array.isArray(m.formats)) {
                        formatsHtml = m.formats.map(f => {
                            let prixStr = f.prix_enseignes ? Object.entries(f.prix_enseignes).map(([e, p]) => `${e}: <strong>${p}€</strong>`).join(' • ') : '';
                            return `
                                <div class="bg-white p-2 rounded-lg border border-indigo-50 space-y-1 text-[11px]">
                                    <div class="font-bold text-indigo-950">📦 Format : ${f.qte || f.quantite || 1} ${f.unite || 'g'}</div>
                                    ${prixStr ? `<div class="text-slate-600 pl-2">💰 ${prixStr}</div>` : '<div class="text-slate-400 italic pl-2">Aucun prix renseigné</div>'}
                                </div>
                            `;
                        }).join('');
                    }

                    const portionStr = m.quantite_portion ? ` | 🥣 Portion type : ${m.quantite_portion} ${m.unite_portion || 'g'}` : '';

                    return `
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                            <div class="flex justify-between items-center flex-wrap gap-1">
                                <span class="font-bold text-slate-700 text-xs">🏷️ ${m.nom || 'Marque générique'}</span>
                                <span class="text-emerald-700 text-[11px]">🔥 ${m.calories || 0} kcal | P: ${m.proteines || 0}g | G: ${m.glucides || 0}g (sucres: ${m.sucres || 0}g) | L: ${m.lipides || 0}g | Fibres: ${m.fibres || 0}g${portionStr}</span>
                            </div>
                            <div class="space-y-1.5 pl-2 border-l-2 border-indigo-200">${formatsHtml}</div>
                        </div>
                    `;
                }).join('');
            }

            return `
                <div class="bg-slate-50 border border-slate-200 p-3 rounded-xl space-y-3 text-xs">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <button type="button" onclick="toggleFavoriIngredient('${nomAffichage.replace(/'/g, "\\'")}')" class="p-1 rounded-lg transition-all hover:scale-110 focus:outline-none" title="${estFavori ? 'Retirer des favoris' : 'Ajouter aux favoris'}">
                                <svg class="w-5 h-5 ${estFavori ? 'text-red-500 fill-current' : 'text-slate-300 hover:text-red-400'}" fill="${estFavori ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                </svg>
                            </button>
                            <h4 class="font-bold text-slate-800 text-sm">🥗 ${nomAffichage}</h4>
                            <span class="bg-blue-50 text-blue-700 px-2.5 py-0.5 rounded-xl text-[10px] font-bold">${i.rayon || 'Épicerie salée'}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick='ouvrirFormulaireModification(${JSON.stringify(i).replace(/'/g, "&#39;")})' class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl font-bold">Modifier</button>
                            <button onclick="supprimerIngredient(${i.id})" class="bg-rose-100 hover:bg-rose-200 text-rose-600 px-3 py-1.5 rounded-xl font-bold">Supprimer</button>
                        </div>
                    </div>
                    <div class="space-y-2">${marquesHtml}</div>
                </div>
            `;
        }

        function ajouterBlocMarque(data = {}) {
            const container = document.getElementById('marques-container');
            const blockId = 'marque-block-' + Math.random().toString(36).substring(2, 9);
            
            const marqueVal = data.nom || data.marque || '';
            const calVal = data.calories || data.cal || 0;
            const protVal = data.proteines || data.prot || 0;
            const glucVal = data.glucides || data.gluc || 0;
            const sucresVal = data.sucres || data.sucre || 0;
            const lipVal = data.lipides || data.lip || 0;
            const fibresVal = data.fibres || 0;
            
            const qtePortionVal = data.quantite_portion || '';
            const unitePortionVal = data.unite_portion || 'g';

            const div = document.createElement('div');
            div.id = blockId;
            div.className = "bg-slate-50 p-3.5 rounded-2xl border border-indigo-100 space-y-3 relative";
            
            div.innerHTML = `
                <button type="button" onclick="document.getElementById('${blockId}').remove()" class="absolute top-3 right-3 bg-red-100 text-red-600 hover:bg-red-200 w-7 h-7 rounded-full font-bold flex items-center justify-center text-xs">✕</button>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 mb-1">Nom de la marque :</label>
                    <input type="text" class="input-marque border border-slate-200 p-2 rounded-xl bg-white w-full font-medium pr-8" placeholder="Ex: Barilla" value="${marqueVal}">
                </div>

                <div class="bg-indigo-50/50 p-2.5 rounded-xl border border-indigo-100 space-y-1">
                    <label class="block text-[11px] font-bold text-indigo-900">🥣 Quantité d'une portion standard :</label>
                    <div class="flex items-center gap-2">
                        <input type="number" step="any" class="input-portion-qte border border-slate-200 p-1.5 rounded-lg bg-white w-28 text-center font-medium" placeholder="Ex: 50" value="${qtePortionVal}">
                        <select class="input-portion-unite border border-slate-200 p-1.5 rounded-lg bg-white font-medium">
                            <option value="g" ${unitePortionVal === 'g' ? 'selected' : ''}>g</option>
                            <option value="kg" ${unitePortionVal === 'kg' ? 'selected' : ''}>kg</option>
                            <option value="ml" ${unitePortionVal === 'ml' ? 'selected' : ''}>ml</option>
                            <option value="L" ${unitePortionVal === 'L' ? 'selected' : ''}>L</option>
                            <option value="unité" ${unitePortionVal === 'unité' ? 'selected' : ''}>unité(s)</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <span class="block text-[11px] font-bold text-slate-600">📊 Valeurs nutritionnelles (pour 100g / 100ml) :</span>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                        <div class="space-y-0.5"><label class="block text-[9px] font-bold text-slate-400">Calories (kcal)</label><input type="number" step="any" class="input-cal border border-slate-200 p-1.5 rounded-lg bg-white w-full text-center font-medium" value="${calVal}"></div>
                        <div class="space-y-0.5"><label class="block text-[9px] font-bold text-slate-400">Protéines (g)</label><input type="number" step="any" class="input-prot border border-slate-200 p-1.5 rounded-lg bg-white w-full text-center font-medium" value="${protVal}"></div>
                        <div class="space-y-0.5"><label class="block text-[9px] font-bold text-slate-400">Glucides (g)</label><input type="number" step="any" class="input-gluc border border-slate-200 p-1.5 rounded-lg bg-white w-full text-center font-medium" value="${glucVal}"></div>
                        <div class="space-y-0.5"><label class="block text-[9px] font-bold text-slate-400">Sucres (g)</label><input type="number" step="any" class="input-sucres border border-slate-200 p-1.5 rounded-lg bg-white w-full text-center font-medium" value="${sucresVal}"></div>
                        <div class="space-y-0.5"><label class="block text-[9px] font-bold text-slate-400">Lipides (g)</label><input type="number" step="any" class="input-lip border border-slate-200 p-1.5 rounded-lg bg-white w-full text-center font-medium" value="${lipVal}"></div>
                        <div class="space-y-0.5"><label class="block text-[9px] font-bold text-slate-400">Fibres (g)</label><input type="number" step="any" class="input-fibres border border-slate-200 p-1.5 rounded-lg bg-white w-full text-center font-medium" value="${fibresVal}"></div>
                    </div>
                </div>

                <div class="space-y-2 pt-2 border-t border-slate-200">
                    <div class="flex justify-between items-center">
                        <span class="block text-[11px] font-bold text-indigo-900">📦 Formats & Coûts par enseigne :</span>
                        <button type="button" onclick="ajouterFormat('${blockId}')" class="text-indigo-600 hover:underline font-bold text-[10px]">+ Ajouter un format</button>
                    </div>
                    <div class="formats-container space-y-3"></div>
                </div>
            `;
            container.appendChild(div);

            if (data.formats && Array.isArray(data.formats) && data.formats.length > 0) {
                data.formats.forEach(f => ajouterFormat(blockId, f));
            } else if (data.quantite_paquet) {
                ajouterFormat(blockId, { qte: data.quantite_paquet, unite: data.unite, prix_enseignes: data.prix_enseignes });
            } else {
                ajouterFormat(blockId);
            }
        }

        function ajouterFormat(blockId, fData = {}) {
            const block = document.getElementById(blockId);
            const container = block.querySelector('.formats-container');
            const formatId = 'format-' + Math.random().toString(36).substring(2, 9);
            const qteVal = fData.qte || fData.quantite || fData.quantite_paquet || '';
            const uniteVal = fData.unite || 'g';

            const div = document.createElement('div');
            div.id = formatId;
            div.className = "bg-white p-3 rounded-xl border border-slate-200 space-y-2 relative";
            
            div.innerHTML = `
                <button type="button" onclick="document.getElementById('${formatId}').remove()" class="absolute top-2 right-2 text-red-500 hover:text-red-700 font-bold text-xs">✕ Supprimer</button>
                <div class="flex items-center gap-2 pr-20">
                    <span class="text-[10px] font-bold text-slate-500">Quantité :</span>
                    <input type="number" step="any" class="format-qte border border-slate-200 p-1.5 rounded-lg bg-slate-50 w-24 text-center font-medium" placeholder="Ex: 500" value="${qteVal}">
                    <select class="format-unite border border-slate-200 p-1.5 rounded-lg bg-slate-50 font-medium text-xs">
                        <option value="g" ${uniteVal === 'g' ? 'selected' : ''}>g</option>
                        <option value="kg" ${uniteVal === 'kg' ? 'selected' : ''}>kg</option>
                        <option value="ml" ${uniteVal === 'ml' ? 'selected' : ''}>ml</option>
                        <option value="L" ${uniteVal === 'L' ? 'selected' : ''}>L</option>
                        <option value="unité" ${uniteVal === 'unité' ? 'selected' : ''}>unité(s)</option>
                    </select>
                </div>
                <div class="space-y-1 pt-1">
                    <span class="block text-[10px] font-bold text-slate-500">Prix par enseigne (€) :</span>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 prix-enseignes-grid">
                        ${enseignesDisponibles.map(ens => {
                            const prixEns = (fData.prix_enseignes && fData.prix_enseignes[ens]) || '';
                            return `
                                <div class="flex items-center gap-1 bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                    <span class="text-[10px] font-medium text-slate-600 truncate w-16" title="${ens}">${ens}</span>
                                    <input type="number" step="any" data-enseigne="${ens}"" class="input-prix border border-slate-200 p-1 rounded bg-white w-full text-center text-xs font-medium" placeholder="0.00" value="${prixEns}">
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        async function sauvegarderIngredient(event) {
            event.preventDefault();
            const id = document.getElementById('ingredient-id').value;
            const nom = document.getElementById('nom').value.trim();
            const rayon = document.getElementById('rayon').value;

            const marques = [];
            const blocsMarques = document.querySelectorAll('#marques-container > div');
            
            blocsMarques.forEach(bloc => {
                const nomMarque = bloc.querySelector('.input-marque').value.trim() || 'Standard';
                const cal = parseFloat(bloc.querySelector('.input-cal').value) || 0;
                const prot = parseFloat(bloc.querySelector('.input-prot').value) || 0;
                const gluc = parseFloat(bloc.querySelector('.input-gluc').value) || 0;
                const sucres = parseFloat(bloc.querySelector('.input-sucres').value) || 0;
                const lip = parseFloat(bloc.querySelector('.input-lip').value) || 0;
                const fibres = parseFloat(bloc.querySelector('.input-fibres').value) || 0;
                
                const quantite_portion = parseFloat(bloc.querySelector('.input-portion-qte').value) || null;
                const unite_portion = bloc.querySelector('.input-portion-unite').value;

                const formats = [];
                bloc.querySelectorAll('.formats-container > div').forEach(fDiv => {
                    const qte = parseFloat(fDiv.querySelector('.format-qte').value) || 1;
                    const unite = fDiv.querySelector('.format-unite').value;
                    const prix_enseignes = {};
                    
                    fDiv.querySelectorAll('.input-prix').forEach(inputPrix => {
                        const ens = inputPrix.getAttribute('data-enseigne');
                        const val = parseFloat(inputPrix.value);
                        if (!isNaN(val) && val > 0) {
                            prix_enseignes[ens] = val;
                        }
                    });

                    formats.push({ qte, unite, prix_enseignes });
                });

                marques.push({
                    nom: nomMarque,
                    calories: cal,
                    proteines: prot,
                    glucides: gluc,
                    sucres,
                    lipides: lip,
                    fibres,
                    quantite_portion,
                    unite_portion,
                    formats
                });
            });

            const payload = { nom, rayon, marques };

            try {
                const url = id ? `/api/ingredients/${id}` : '/api/ingredients';
                const method = id ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    reinitialiserFormulaire();
                    init();
                } else {
                    alert("Erreur lors de la sauvegarde.");
                }
            } catch (e) {
                console.error("Erreur réseau sauvegarde", e);
            }
        }

        async function supprimerIngredient(id) {
            if (!confirm("Voulez-vous vraiment supprimer cet ingrédient ?")) return;
            try {
                const res = await fetch(`/api/ingredients/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    init();
                } else {
                    alert("Erreur lors de la suppression.");
                }
            } catch (e) {
                console.error("Erreur suppression", e);
            }
        }

        async function rechercherOffIngredient() {
            const query = document.getElementById('recherche-off-ing').value.trim();
            const container = document.getElementById('resultats-off-container');
            if (!query) return;

            container.classList.remove('hidden');
            container.innerHTML = '<p class="text-xs text-indigo-700 italic">Recherche en cours sur Open Food Facts...</p>';

            try {
                const res = await fetch(`/api/open-food-facts/search?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error();
                const produits = await res.json();

                if (produits.length === 0) {
                    container.innerHTML = '<p class="text-xs text-slate-500 italic">Aucun produit trouvé.</p>';
                    return;
                }

                container.innerHTML = produits.map((p, idx) => `
                    <div class="bg-white p-2 rounded-lg border border-indigo-100 flex justify-between items-center text-xs">
                        <div>
                            <span class="font-bold text-indigo-950">${p.nom}</span>
                            <span class="text-[10px] text-slate-500 block">${p.marque || ''} - ${p.calories || 0} kcal/100g</span>
                        </div>
                        <button type="button" onclick='importerProduitOff(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="bg-indigo-600 text-white px-2.5 py-1 rounded font-bold text-[10px]">Importer</button>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<p class="text-xs text-red-500">Erreur lors de la recherche Open Food Facts.</p>';
            }
        }

        function importerProduitOff(p) {
            document.getElementById('nom').value = p.nom || '';
            if (p.rayon) document.getElementById('rayon').value = p.rayon;
            
            document.getElementById('marques-container').innerHTML = '';
            ajouterBlocMarque({
                nom: p.marque || p.nom || '',
                calories: p.calories || 0,
                proteines: p.proteines || 0,
                glucides: p.glucides || 0,
                sucres: p.sucres || 0,
                lipides: p.lipides || 0,
                fibres: p.fibres || 0,
                quantite_portion: p.quantite_portion || '',
                unite_portion: p.unite_portion || 'g',
                formats: [{ qte: p.quantite_paquet || 100, unite: p.unite || 'g', prix_enseignes: {} }]
            });

            document.getElementById('resultats-off-container').classList.add('hidden');
            document.getElementById('form-content-container').classList.remove('hidden');
            document.getElementById('form-toggle-arrow').innerText = "▲";
        }
    </script>
</body>
</html>
