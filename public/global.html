<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal - Application Nutritionnelle</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-6">
    <div class="max-w-md w-full bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center space-y-5">
        
        <!-- Onglets de navigation principale -->
        <div class="flex bg-slate-200/70 p-1 rounded-2xl max-w-md mx-auto">
            <a href="/planification.html" class="flex-1 py-2 rounded-xl text-slate-600 text-center transition-all text-xs font-bold">📅 Planification Semaine</a>
            <a href="/suivi.html" class="flex-1 py-2 rounded-xl text-slate-600 text-center transition-all text-xs font-bold">🍽️ Suivi Réel & Bilans</a>
        </div>

        <!-- Navigation secondaire -->
        <nav class="grid grid-cols-5 gap-1 text-center text-[11px] font-medium">
            <a href="/global.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Menu</a>
            <a href="/recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
            <a href="/ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
            <a href="/vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
            <a href="/courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
        </nav>

        <div class="space-y-1 pt-2 border-t border-slate-100">
            <span class="text-3xl">🥗</span>
            <h1 class="font-bold text-lg text-slate-800">Menu Principal</h1>
            <p class="text-xs text-slate-500" id="nom-utilisateur-connecte">Chargement du compte...</p>
        </div>

        <!-- SÉLECTION / GESTION DES PERSONNES & OBJECTIFS -->
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-left space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-700">👥 Profil Actif (Personne / Objectifs)</span>
                <button onclick="ouvrirModalPersonne()" class="text-[11px] bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold px-2.5 py-1 rounded-lg transition-all">+ Nouveau / Modifier</button>
            </div>
            <select id="select-personne-globale" onchange="changerPersonneActive(this.value)" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs font-medium outline-none focus:border-blue-500">
                <option value="">Chargement des personnes...</option>
            </select>
        </div>

        <div class="space-y-2 pt-1">
            <a href="/planification.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-xl transition-all shadow-sm">
                📅 Accéder à la Planification Semaine
            </a>
            <a href="/suivi.html" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 rounded-xl transition-all shadow-sm">
                🍽️ Accéder au Suivi Réel & Bilans
            </a>
        </div>

        <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
            <button onclick="ouvrirModalCompte()" class="text-slate-600 hover:text-slate-800 font-bold">👤 Paramètres Compte</button>
            <button onclick="deconnexion()" class="text-red-500 hover:text-red-700 font-bold">Se déconnecter</button>
        </div>
    </div>

    <!-- Modale Paramètres du Compte -->
    <div id="modal-compte" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-4 text-left">
            <h3 class="font-bold text-sm text-slate-800">👤 Paramètres du Compte</h3>
            <form onsubmit="sauvegarderCompte(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Nom d'utilisateur</label>
                    <input type="text" id="compte-nom" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Email</label>
                    <input type="email" id="compte-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Nouveau mot de passe</label>
                    <input type="password" id="compte-mdp" placeholder="Laisser vide si inchangé" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="fermerModalCompte()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">Annuler</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl">Mettre à jour</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale Création / Modification Personnes & Objectifs -->
    <div id="modal-personne" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 text-left max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-sm text-slate-800">👥 Gérer les Personnes & Objectifs</h3>
            <form onsubmit="sauvegarderPersonne(event)" class="space-y-3 text-xs">
                <input type="hidden" id="ancien-nom-personne">
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Nom de la personne</label>
                    <input type="text" id="perso-nom" required placeholder="Ex: Thomas, Marie..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Calories (kcal)</label>
                        <input type="number" id="perso-calories" value="2000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Eau (L)</label>
                        <input type="number" step="0.1" id="perso-eau" value="2.0" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Budget (€)</label>
                        <input type="number" id="perso-budget" value="100" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Période Budget</label>
                        <select id="perso-budget-periode" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                            <option value="semaine">Semaine</option>
                            <option value="mois">Mois</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Protéines (g)</label>
                        <input type="number" id="perso-proteines" value="120" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Glucides (g)</label>
                        <input type="number" id="perso-glucides" value="200" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Lipides (g)</label>
                        <input type="number" id="perso-lipides" value="70" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Fibres (g)</label>
                        <input type="number" id="perso-fibres" value="30" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Sucre max (g)</label>
                        <input type="number" id="perso-sucre" value="50" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button type="button" onclick="supprimerPersonneActuelle()" class="px-3 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-bold rounded-xl text-xs">Supprimer ce profil</button>
                    <div class="flex gap-2">
                        <button type="button" onclick="fermerModalPersonne()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl">Enregistrer</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Global -->
    <script src="script.js"></script>
</body>
</html>
