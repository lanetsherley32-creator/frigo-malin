<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal - Frigomalin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-6">
    <div class="max-w-md w-full bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center space-y-6">
        
        <!-- En-tête / Titre principal -->
        <div class="space-y-1">
            <h1 class="font-extrabold text-2xl text-slate-800">Frigomalin 😉</h1>
            <p class="text-xs text-slate-500" id="nom-utilisateur-connecte">Chargement du compte...</p>
        </div>

        <!-- SÉLECTION / GESTION DES PERSONNES & OBJECTIFS -->
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-left space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-700">👥 Profil Actif (Personne / Objectifs)</span>
                <button onclick="ouvrirModalPersonne()" class="text-[11px] bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold px-2.5 py-1 rounded-lg transition-all">+ Nouveau / Modifier</button>
            </div>
            <select id="select-personne-globale" onchange="changerPersonneActive(this.value)" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs font-medium outline-none focus:border-blue-500">
                <option value="">Chargement des personnes...</option>
            </select>
        </div>

        <!-- Bouton unique pour entrer dans le profil -->
        <div>
            <button onclick="entrerDansProfil()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3.5 rounded-xl transition-all shadow-sm">
                🚀 Entrer dans ce profil
            </button>
        </div>

        <!-- Paramètres compte et déconnexion en bas -->
        <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
            <button onclick="ouvrirModalCompte()" class="text-slate-600 hover:text-slate-800 font-bold">👤 Paramètres Compte</button>
            <button onclick="deconnexion()" class="text-red-500 hover:text-red-700 font-bold">Se déconnecter</button>
        </div>
    </div>

    <!-- Modale Paramètres du Compte -->
    <div id="modal-compte" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-4 text-left">
            <h3 class="font-bold text-sm text-slate-800">👤 Paramètres du Compte</h3>
            <form onsubmit="sauvegarderCompte(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Nom d'utilisateur</label>
                    <input type="text" id="compte-nom" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Email</label>
                    <input type="email" id="compte-email" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Nouveau mot de passe</label>
                    <input type="password" id="compte-mdp" placeholder="Laisser vide si inchangé" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="fermerModalCompte()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">Annuler</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl">Mettre à jour</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale Création / Modification Personnes & Objectifs -->
    <div id="modal-personne" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 text-left max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-sm text-slate-800">👥 Gérer les Personnes & Objectifs</h3>
            <form onsubmit="sauvegarderPersonne(event)" class="space-y-3 text-xs">
                <input type="hidden" id="ancien-nom-personne">
                <div>
                    <label class="block font-bold text-slate-500 mb-1">Nom de la personne</label>
                    <input type="text" id="perso-nom" required placeholder="Ex: Thomas, Marie..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Calories (kcal)</label>
                        <input type="number" id="perso-calories" value="2000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Eau (L)</label>
                        <input type="number" step="0.1" id="perso-eau" value="2.0" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Budget (€)</label>
                        <input type="number" id="perso-budget" value="100" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Période Budget</label>
                        <select id="perso-budget-periode" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                            <option value="semaine">Semaine</option>
                            <option value="mois">Mois</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Protéines (g)</label>
                        <input type="number" id="perso-proteines" value="120" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Glucides (g)</label>
                        <input type="number" id="perso-glucides" value="200" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Lipides (g)</label>
                        <input type="number" id="perso-lipides" value="70" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Fibres (g)</label>
                        <input type="number" id="perso-fibres" value="30" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">Sucre max (g)</label>
                        <input type="number" id="perso-sucre" value="50" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 outline-none font-medium">
                    </div>
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button type="button" onclick="supprimerPersonneActuelle()" class="px-3 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-bold rounded-xl text-xs">Supprimer ce profil</button>
                    <div class="flex gap-2">
                        <button type="button" onclick="fermerModalPersonne()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">Annuler</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl">Enregistrer</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Intégré -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            chargerInfosUtilisateur();
            chargerPersonnesObjectifs();
            
            if (typeof io !== 'undefined') {
                const socket = io();
                socket.on('data_updated', () => {
                    chargerPersonnesObjectifs();
                });
            }
        });

        async function chargerInfosUtilisateur() {
            try {
                const res = await fetch('/api/current-user');
                if (res.ok) {
                    const user = await res.json();
                    const element = document.getElementById('nom-utilisateur-connecte');
                    if (element) element.innerText = `Connecté en tant que : ${user.nom} (${user.email})`;
                    
                    const inputNom = document.getElementById('compte-nom');
                    const inputEmail = document.getElementById('compte-email');
                    if (inputNom) inputNom.value = user.nom;
                    if (inputEmail) inputEmail.value = user.email;
                } else {
                    window.location.href = '/login.html';
                }
            } catch (e) {
                console.error("Erreur chargement utilisateur", e);
            }
        }

        function ouvrirModalCompte() {
            document.getElementById('modal-compte')?.classList.remove('hidden');
        }

        function fermerModalCompte() {
            document.getElementById('modal-compte')?.classList.add('hidden');
        }

        async function sauvegarderCompte(event) {
            event.preventDefault();
            const nom = document.getElementById('compte-nom').value;
            const email = document.getElementById('compte-email').value;
            const mdp = document.getElementById('compte-mdp').value;

            try {
                const res = await fetch('/api/profils', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nom, email, mdp })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Compte mis à jour avec succès !");
                    fermerModalCompte();
                    chargerInfosUtilisateur();
                } else {
                    alert(data.error || "Erreur lors de la mise à jour");
                }
            } catch (e) {
                alert("Erreur réseau");
            }
        }

        async function deconnexion() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        let listePersonnesCache = [];

        async function chargerPersonnesObjectifs() {
            try {
                const res = await fetch('/api/personnes-objectifs');
                if (res.ok) {
                    listePersonnesCache = await res.json();
                    const select = document.getElementById('select-personne-globale');
                    if (!select) return;

                    const personneActiveActuelle = localStorage.getItem('profilActif') || (listePersonnesCache[0] ? listePersonnesCache[0].nom : '');

                    select.innerHTML = '';
                    if (listePersonnesCache.length === 0) {
                        select.innerHTML = '<option value="">Aucune personne enregistrée</option>';
                        return;
                    }

                    listePersonnesCache.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.nom;
                        opt.textContent = `${p.nom} (${p.calories} kcal - ${p.budget}€)`;
                        if (p.nom === personneActiveActuelle) opt.selected = true;
                        select.appendChild(opt);
                    });

                    if (!localStorage.getItem('profilActif') && listePersonnesCache.length > 0) {
                        localStorage.setItem('profilActif', listePersonnesCache[0].nom);
                    }
                }
            } catch (e) {
                console.error("Erreur chargement personnes", e);
            }
        }

        function changerPersonneActive(nom) {
            if (nom) {
                localStorage.setItem('profilActif', nom);
            }
        }

        function entrerDansProfil() {
            const select = document.getElementById('select-personne-globale');
            if (select && select.value) {
                localStorage.setItem('profilActif', select.value);
            }
            window.location.href = '/planification.html';
        }

        function ouvrirModalPersonne() {
            const modal = document.getElementById('modal-personne');
            const selectNomActuel = localStorage.getItem('profilActif');
            const personneTrouvee = listePersonnesCache.find(p => p.nom === selectNomActuel);

            document.getElementById('ancien-nom-personne').value = personneTrouvee ? personneTrouvee.nom : '';
            document.getElementById('perso-nom').value = personneTrouvee ? personneTrouvee.nom : '';
            document.getElementById('perso-calories').value = personneTrouvee ? personneTrouvee.calories : 2000;
            document.getElementById('perso-eau').value = personneTrouvee ? personneTrouvee.eau : 2.0;
            document.getElementById('perso-budget').value = personneTrouvee ? personneTrouvee.budget : 100;
            document.getElementById('perso-budget-periode').value = personneTrouvee ? personneTrouvee.budget_periode : 'semaine';
            document.getElementById('perso-proteines').value = personneTrouvee ? personneTrouvee.proteines : 120;
            document.getElementById('perso-glucides').value = personneTrouvee ? personneTrouvee.glucides : 200;
            document.getElementById('perso-lipides').value = personneTrouvee ? personneTrouvee.lipides : 70;
            document.getElementById('perso-fibres').value = personneTrouvee ? personneTrouvee.fibres : 30;
            document.getElementById('perso-sucre').value = personneTrouvee ? personneTrouvee.sucre : 50;

            modal?.classList.remove('hidden');
        }

        function fermerModalPersonne() {
            document.getElementById('modal-personne')?.classList.add('hidden');
        }

        async function sauvegarderPersonne(event) {
            event.preventDefault();
            const ancienNom = document.getElementById('ancien-nom-personne').value;
            const nom = document.getElementById('perso-nom').value;
            const calories = document.getElementById('perso-calories').value;
            const eau = document.getElementById('perso-eau').value;
            const budget = document.getElementById('perso-budget').value;
            const budget_periode = document.getElementById('perso-budget-periode').value;
            const proteines = document.getElementById('perso-proteines').value;
            const glucides = document.getElementById('perso-glucides').value;
            const lipides = document.getElementById('perso-lipides').value;
            const fibres = document.getElementById('perso-fibres').value;
            const sucre = document.getElementById('perso-sucre').value;

            try {
                const res = await fetch('/api/personnes-objectifs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ancienNom, nom, calories, eau, budget, budget_periode, proteines, glucides, lipides, fibres, sucre })
                });

                if (res.ok) {
                    localStorage.setItem('profilActif', nom);
                    fermerModalPersonne();
                    chargerPersonnesObjectifs();
                    alert("Profil et objectifs enregistrés avec succès !");
                } else {
                    const err = await res.json();
                    alert(err.error || "Erreur lors de l'enregistrement");
                }
            } catch (e) {
                alert("Erreur réseau");
            }
        }

        async function supprimerPersonneActuelle() {
            const nom = document.getElementById('perso-nom').value;
            if (!nom) return;
            if (!confirm(`Voulez-vous vraiment supprimer le profil de ${nom} ?`)) return;

            try {
                const res = await fetch(`/api/personnes-objectifs?nom=${encodeURIComponent(nom)}`, { method: 'DELETE' });
                if (res.ok) {
                    localStorage.removeItem('profilActif');
                    fermerModalPersonne();
                    chargerPersonnesObjectifs();
                    alert("Profil supprimé.");
                } else {
                    alert("Erreur lors de la suppression");
                }
            } catch (e) {
                alert("Erreur réseau");
            }
        }
    </script>
</body>
</html>
