<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vider ton frigo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4">
        
        <!-- Navigation Mobile Friendly -->
        <header class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🧊 Vider ton frigo</h1>
            <nav class="grid grid-cols-5 gap-1 text-center text-xs font-medium">
                <a href="index.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Frigo</a>
            </nav>
        </header>

        <!-- Rappel du Profil Actif -->
        <section class="bg-blue-50/50 p-3.5 rounded-2xl border border-blue-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs">
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2 w-full">
                <label class="font-bold text-blue-900 whitespace-nowrap">Profil Actif :</label>
                <select id="select-profil" onchange="changerProfilActif()" class="border border-blue-200 p-2.5 rounded-xl bg-white flex-1 font-medium w-full">
                    <option value="">-- Aucun profil --</option>
                </select>
            </div>
            <span class="text-blue-700 italic text-[11px] whitespace-nowrap">Stock propre à ce profil</span>
        </section>

        <!-- Saisie des ingrédients disponibles -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <h2 class="font-bold text-slate-700 text-sm">🛒 Ce qu'il me reste</h2>
                
                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-slate-500">Ingrédient :</label>
                    <select id="select-ingredient" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full text-xs font-medium"></select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-slate-500">Quantité :</label>
                    <input type="number" step="any" id="input-quantite" placeholder="Ex: 500 (g ou ml)" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full text-xs font-medium">
                </div>

                <button onclick="ajouterIngredientFrigo()" class="w-full bg-blue-600 active:bg-blue-700 text-white p-3 rounded-xl text-xs font-bold shadow-sm">
                    + Ajouter au frigo
                </button>
            </div>

            <!-- Liste des ingrédients actuels du frigo -->
            <div class="md:col-span-2 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3 flex flex-col justify-between">
                <div class="space-y-2">
                    <h2 class="font-bold text-slate-700 text-sm">📋 Mon stock actuel</h2>
                    <div id="liste-frigo" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <p class="text-xs text-slate-400 italic">Aucun ingrédient renseigné pour le moment.</p>
                    </div>
                </div>
                <button onclick="trouverRecettes()" class="w-full bg-emerald-600 active:bg-emerald-700 text-white p-3 rounded-xl text-xs font-bold shadow-sm mt-2">
                    🔍 Trouver des recettes faisables
                </button>
            </div>
        </section>

        <!-- Résultats / Suggestions de recettes -->
        <section class="space-y-3">
            <h2 class="font-bold text-slate-700 text-sm">💡 Recettes conseillées</h2>
            <div id="resultats-recettes" class="space-y-3">
                <p class="text-xs text-slate-400 italic bg-white p-4 rounded-2xl border border-slate-200 text-center">Clique sur "Trouver des recettes faisables" pour lancer la recherche.</p>
            </div>
        </section>
    </div>

    <script>
        const socket = io();
        let ingredientsGlobal = [];
        let recettesGlobal = [];
        let profilsGlobal = [];
        let stockFrigoParProfil = {};

        async function init() {
            await chargerDonnees();
        }

        async function chargerDonnees() {
            const resProfils = await fetch('/api/profils');
            profilsGlobal = await resProfils.json();
            renderProfils();

            const resIng = await fetch('/api/ingredients');
            ingredientsGlobal = await resIng.json();

            const resRec = await fetch('/api/recettes');
            recettesGlobal = await resRec.json();

            chargerStockStocke();
            renderSelectIngredients();
            renderStockFrigo();
        }

        function renderProfils() {
            const select = document.getElementById('select-profil');
            const currentValue = select.value;

            select.innerHTML = profilsGlobal.length === 0 
                ? `<option value="">-- Aucun profil créé --</option>` 
                : profilsGlobal.map(p => `<option value="${p.id}" ${p.id == currentValue ? 'selected' : ''}>${p.nom}</option>`).join('');

            if (!select.value && profilsGlobal.length > 0) {
                select.value = profilsGlobal[0].id;
            }
        }

        function getProfilActifId() {
            const select = document.getElementById('select-profil');
            return select.value;
        }

        function changerProfilActif() {
            renderStockFrigo();
            document.getElementById('resultats-recettes').innerHTML = `<p class="text-xs text-slate-400 italic bg-white p-4 rounded-2xl border border-slate-200 text-center">Clique sur "Trouver des recettes faisables" pour lancer la recherche.</p>`;
        }

        function renderSelectIngredients() {
            const select = document.getElementById('select-ingredient');
            select.innerHTML = ingredientsGlobal.length === 0 
                ? `<option value="">-- Aucun ingrédient disponible --</option>` 
                : ingredientsGlobal.map(i => `<option value="${i.id}">${i.nom} (${i.unite || ''})</option>`).join('');
        }

        function ajouterIngredientFrigo() {
            const profilId = getProfilActifId();
            if (!profilId) {
                alert("Veuillez sélectionner ou créer un profil d'abord.");
                return;
            }

            const select = document.getElementById('select-ingredient');
            const qteInput = document.getElementById('input-quantite');
            
            const ingId = select.value;
            const qte = parseFloat(qteInput.value);

            if (!ingId) {
                alert("Veuillez choisir un ingrédient.");
                return;
            }
            if (isNaN(qte) || qte <= 0) {
                alert("Veuillez entrer une quantité valide.");
                return;
            }

            if (!stockFrigoParProfil[profilId]) {
                stockFrigoParProfil[profilId] = {};
            }

            stockFrigoParProfil[profilId][ingId] = (stockFrigoParProfil[profilId][ingId] || 0) + qte;
            qteInput.value = '';
            
            sauvegarderStockStocke();
            renderStockFrigo();
        }

        function supprimerDuFrigo(ingId) {
            const profilId = getProfilActifId();
            if (!profilId || !stockFrigoParProfil[profilId]) return;

            delete stockFrigoParProfil[profilId][ingId];
            sauvegarderStockStocke();
            renderStockFrigo();
        }

        function renderStockFrigo() {
            const container = document.getElementById('liste-frigo');
            const profilId = getProfilActifId();
            
            const frigoActuel = (profilId && stockFrigoParProfil[profilId]) ? stockFrigoParProfil[profilId] : {};
            const ids = Object.keys(frigoActuel);

            if (ids.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic">Aucun ingrédient renseigné pour ce profil.</p>`;
                return;
            }

            container.innerHTML = ids.map(id => {
                const ing = ingredientsGlobal.find(i => i.id == id);
                const nom = ing ? ing.nom : "Inconnu";
                const unite = ing ? (ing.unite || '') : '';
                const qte = frigoActuel[id];

                return `
                    <div class="flex justify-between items-center bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs">
                        <span class="font-bold text-slate-800">${nom} : <strong class="text-blue-600">${qte} ${unite}</strong></span>
                        <button onclick="supprimerDuFrigo(${id})" class="text-rose-500 font-bold px-2 py-1">✕</button>
                    </div>
                `;
            }).join('');
        }

        function trouverRecettes() {
            const container = document.getElementById('resultats-recettes');
            const profilId = getProfilActifId();
            const frigoActuel = (profilId && stockFrigoParProfil[profilId]) ? stockFrigoParProfil[profilId] : {};

            if (Object.keys(frigoActuel).length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic bg-white p-4 rounded-2xl border border-slate-200 text-center">Veuillez d'abord ajouter des ingrédients dans votre frigo !</p>`;
                return;
            }

            let recettesAnalysees = recettesGlobal.map(recette => {
                let ingredientsRecette = recette.ingredients || [];
                if (ingredientsRecette.length === 0) return { ...recette, faisable: false, taux: 0, manquant: [] };

                let toutBon = true;
                let manquant = [];
                let ingredientsPossedesCount = 0;

                ingredientsRecette.forEach(ingR => {
                    let stockDispo = frigoActuel[ingR.ingredient_id || ingR.id] || 0;
                    let ingInfo = ingredientsGlobal.find(i => i.id == (ingR.ingredient_id || ingR.id));
                    let nomIng = ingInfo ? ingInfo.nom : 'Ingrédient';

                    if (stockDispo >= ingR.quantite) {
                        ingredientsPossedesCount++;
                    } else {
                        toutBon = false;
                        manquant.push({
                            nom: nomIng,
                            besoin: ingR.quantite,
                            reste: stockDispo,
                            unite: ingInfo ? (ingInfo.unite || '') : ''
                        });
                    }
                });

                let taux = Math.round((ingredientsPossedesCount / ingredientsRecette.length) * 100);
                return { ...recette, faisable: toutBon, taux, manquant };
            });

            recettesAnalysees.sort((a, b) => b.taux - a.taux);

            container.innerHTML = recettesAnalysees.map(r => {
                let badgeColor = r.faisable ? "bg-emerald-100 text-emerald-800 border-emerald-300" : (r.taux >= 50 ? "bg-amber-100 text-amber-800 border-amber-300" : "bg-slate-100 text-slate-700 border-slate-300");
                let badgeText = r.faisable ? "✅ Faisable à 100% !" : `⚠️ Faisable à ${r.taux}%`;

                let detailsManquants = r.manquant.length > 0 ? `
                    <div class="mt-2 text-[11px] text-slate-500 border-t border-slate-100 pt-2 space-y-1">
                        <span class="font-bold text-rose-600">Il te manque :</span>
                        <ul class="list-disc list-inside space-y-0.5">
                            ${r.manquant.map(m => `<li><b>${m.nom}</b> (Besoin : ${m.besoin}${m.unite}, En stock : ${m.reste}${m.unite})</li>`).join('')}
                        </ul>
                    </div>
                ` : `<p class="mt-2 text-[11px] text-emerald-700 font-bold">Tu as tout ce qu'il faut en quantité suffisante !</p>`;

                let listeIngs = (r.ingredients || []).map(i => {
                    let ingInfo = ingredientsGlobal.find(x => x.id == (i.ingredient_id || i.id));
                    return `<li>${ingInfo ? ingInfo.nom : 'Ingrédient'} : ${i.quantite} ${ingInfo ? (ingInfo.unite || '') : ''}</li>`;
                }).join('');

                return `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3 text-xs">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="font-bold text-sm text-blue-900">${r.nom}</h3>
                            <span class="px-2.5 py-1 rounded-xl border text-[10px] font-bold ${badgeColor} whitespace-nowrap">${badgeText}</span>
                        </div>
                        <div class="text-slate-600 space-y-1">
                            <span class="font-bold text-slate-700">Ingrédients :</span>
                            <ul class="list-disc list-inside text-slate-500 max-h-24 overflow-y-auto space-y-0.5">${listeIngs}</ul>
                        </div>
                        ${detailsManquants}
                    </div>
                `;
            }).join('');
        }

        function sauvegarderStockStocke() {
            localStorage.setItem('stock_frigo_par_profil', JSON.stringify(stockFrigoParProfil));
        }

        function chargerStockStocke() {
            const stock = localStorage.getItem('stock_frigo_par_profil');
            if (stock) {
                try { stockFrigoParProfil = JSON.parse(stock); } catch(e) { stockFrigoParProfil = {}; }
            }
        }

        socket.on('data_updated', async () => {
            await chargerDonnees();
        });

        init();
    </script>
</body>
</html>
