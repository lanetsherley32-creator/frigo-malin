<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vider ton frigo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-4 space-y-4">
        
        <!-- Navigation cohérente (Frigo avant Courses) -->
        <header class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🧊 Vider ton frigo</h1>
            <nav class="grid grid-cols-5 gap-1 text-center text-[11px] font-medium">
                <a href="index.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Frigo</a>
                <a href="courses.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Courses</a>
            </nav>
        </header>

        <!-- Rappel du Profil Actif -->
        <section class="bg-blue-50/50 p-3.5 rounded-2xl border border-blue-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs">
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2 w-full">
                <label class="font-bold text-blue-900 whitespace-nowrap">Profil Actif :</label>
                <select id="select-profil" onchange="changerProfilActif()" class="border border-blue-200 p-2.5 rounded-xl bg-white flex-1 font-medium w-full">
                    <option value="">-- Aucun profil --</option>
                </select>
            </div>
            <span class="text-blue-700 italic text-[11px] whitespace-nowrap">Stock propre à ce profil</span>
        </section>

        <!-- Saisie des ingrédients disponibles -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <h2 class="font-bold text-slate-700 text-sm">🛒 Ce qu'il me reste</h2>
                
                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-slate-500">Ingrédient :</label>
                    <select id="select-ingredient" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full text-xs font-medium"></select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="space-y-1.5">
                        <label class="text-[11px] font-bold text-slate-500">Quantité :</label>
                        <input type="number" step="any" id="input-quantite" placeholder="Ex: 500" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full text-xs font-medium">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[11px] font-bold text-slate-500">Unité :</label>
                        <select id="input-unite" class="border border-slate-200 p-2.5 rounded-xl bg-slate-50 w-full text-xs font-medium">
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                            <option value="ml">ml</option>
                            <option value="L">L</option>
                            <option value="pièce">pièce</option>
                            <option value="c.à.s">c.à.s</option>
                            <option value="c.à.c">c.à.c</option>
                        </select>
                    </div>
                </div>

                <button onclick="ajouterIngredientFrigo()" class="w-full bg-blue-600 active:bg-blue-700 text-white p-3 rounded-xl text-xs font-bold shadow-sm">
                    + Ajouter au frigo
                </button>
            </div>

            <!-- Liste des ingrédients actuels du frigo -->
            <div class="md:col-span-2 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3 flex flex-col justify-between">
                <div class="space-y-2">
                    <h2 class="font-bold text-slate-700 text-sm">📋 Mon stock actuel</h2>
                    <div id="liste-frigo" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <p class="text-xs text-slate-400 italic">Aucun ingrédient renseigné pour le moment.</p>
                    </div>
                </div>
                <button onclick="trouverRecettes()" class="w-full bg-emerald-600 active:bg-emerald-700 text-white p-3 rounded-xl text-xs font-bold shadow-sm mt-2">
                    🔍 Trouver des recettes faisables
                </button>
            </div>
        </section>

        <!-- Résultats / Suggestions de recettes -->
        <section class="space-y-3">
            <h2 class="font-bold text-slate-700 text-sm">💡 Recettes conseillées (max 4 achats)</h2>
            <div id="resultats-recettes" class="space-y-3">
                <p class="text-xs text-slate-400 italic bg-white p-4 rounded-2xl border border-slate-200 text-center">Clique sur "Trouver des recettes faisables" pour lancer la recherche.</p>
            </div>
        </section>
    </div>

    <script>
        let socket;
        let ingredientsGlobal = [];
        let recettesGlobal = [];
        let profilsGlobal = [];
        let stockFrigoParProfil = {};

        try {
            socket = io();
            socket.on('data_updated', chargerDonnees);
        } catch (e) {
            console.warn("Socket.io non initialisé", e);
        }

        async function init() {
            await chargerDonnees();
        }

        async function chargerDonnees() {
            try {
                const [resProfils, resIng, resRec] = await Promise.all([
                    fetch('/api/personnes-objectifs').catch(() => fetch('/api/profils')),
                    fetch('/api/ingredients'),
                    fetch('/api/recettes')
                ]);

                if (resProfils && resProfils.ok) profilsGlobal = await resProfils.json();
                if (resIng && resIng.ok) ingredientsGlobal = await resIng.json();
                if (resRec && resRec.ok) recettesGlobal = await resRec.json();

                chargerStockStocke();
                renderProfils();
                renderSelectIngredients();
                renderStockFrigo();
            } catch (err) {
                console.error("Erreur lors du chargement des données :", err);
            }
        }

        function renderProfils() {
            const select = document.getElementById('select-profil');
            const savedProfile = localStorage.getItem('profil_actif');

            select.innerHTML = profilsGlobal.length === 0 
                ? `<option value="">-- Aucun profil créé --</option>` 
                : profilsGlobal.map(p => `<option value="${p.nom}">${p.nom}</option>`).join('');

            if (savedProfile && profilsGlobal.some(p => p.nom === savedProfile)) {
                select.value = savedProfile;
            } else if (profilsGlobal.length > 0) {
                select.value = profilsGlobal[0].nom;
                localStorage.setItem('profil_actif', select.value);
            }
        }

        function getProfilActifId() {
            const select = document.getElementById('select-profil');
            return select ? select.value : "";
        }

        function changerProfilActif() {
            const val = getProfilActifId();
            localStorage.setItem('profil_actif', val);
            renderStockFrigo();
            document.getElementById('resultats-recettes').innerHTML = `<p class="text-xs text-slate-400 italic bg-white p-4 rounded-2xl border border-slate-200 text-center">Clique sur "Trouver des recettes faisables" pour lancer la recherche.</p>`;
        }

        function renderSelectIngredients() {
            const select = document.getElementById('select-ingredient');
            select.innerHTML = ingredientsGlobal.length === 0 
                ? `<option value="">-- Aucun ingrédient disponible --</option>` 
                : `<option value="">-- Choisir un ingrédient --</option>` + ingredientsGlobal.map(i => `<option value="${i.id}">${i.nom}</option>`).join('');
        }

        function convertirEnGrammeOuUnite(valeur, unite) {
            valeur = parseFloat(valeur) || 0;
            const u = (unite || '').toString().toLowerCase().trim();
            if (u === 'kg' || u === 'l') return valeur * 1000;
            if (u === 'c.à.s' || u === 'cas') return valeur * 15;
            if (u === 'c.à.c' || u === 'cac') return valeur * 5;
            return valeur; 
        }

        function ajouterIngredientFrigo() {
            const profilId = getProfilActifId();
            if (!profilId) {
                alert("Veuillez sélectionner ou créer un profil d'abord.");
                return;
            }

            const select = document.getElementById('select-ingredient');
            const qteInput = document.getElementById('input-quantite');
            const uniteSelect = document.getElementById('input-unite');
            
            const ingId = select.value;
            const qteVal = parseFloat(qteInput.value);
            const uniteVal = uniteSelect.value;

            if (!ingId) {
                alert("Veuillez choisir un ingrédient.");
                return;
            }
            if (isNaN(qteVal) || qteVal <= 0) {
                alert("Veuillez entrer une quantité valide.");
                return;
            }

            if (!stockFrigoParProfil[profilId]) {
                stockFrigoParProfil[profilId] = {};
            }

            if (!stockFrigoParProfil[profilId][ingId]) {
                stockFrigoParProfil[profilId][ingId] = { qte: 0, unite: uniteVal };
            }

            stockFrigoParProfil[profilId][ingId].qte += qteVal;
            stockFrigoParProfil[profilId][ingId].unite = uniteVal;

            qteInput.value = '';
            select.value = '';
            
            sauvegarderStockStocke();
            renderStockFrigo();
        }

        function supprimerDuFrigo(ingId) {
            const profilId = getProfilActifId();
            if (!profilId || !stockFrigoParProfil[profilId]) return;

            delete stockFrigoParProfil[profilId][ingId];
            sauvegarderStockStocke();
            renderStockFrigo();
        }

        function renderStockFrigo() {
            const container = document.getElementById('liste-frigo');
            const profilId = getProfilActifId();
            
            const frigoActuel = (profilId && stockFrigoParProfil[profilId]) ? stockFrigoParProfil[profilId] : {};
            const ids = Object.keys(frigoActuel);

            if (ids.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic">Aucun ingrédient renseigné pour ce profil.</p>`;
                return;
            }

            container.innerHTML = ids.map(id => {
                const ing = ingredientsGlobal.find(i => i.id == id);
                const nom = ing ? ing.nom : "Inconnu";
                const itemStock = frigoActuel[id];
                const qte = typeof itemStock === 'object' ? itemStock.qte : itemStock;
                const unite = typeof itemStock === 'object' ? itemStock.unite : 'g';

                return `
                    <div class="flex justify-between items-center bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs">
                        <span class="font-bold text-slate-800">${nom} : <strong class="text-blue-600">${qte} ${unite}</strong></span>
                        <button onclick="supprimerDuFrigo('${id}')" class="text-rose-500 font-bold px-2 py-1 hover:bg-rose-50 rounded-lg">✕</button>
                    </div>
                `;
            }).join('');
        }

        function analyserIngredientsRecette(ingredientsData) {
            let parsedList = [];
            if (!ingredientsData) return parsedList;

            try {
                let parsed = ingredientsData;

                if (typeof parsed === 'string') {
                    try {
                        parsed = JSON.parse(parsed);
                    } catch (e) {
                        parsed = [parsed];
                    }
                }

                if (Array.isArray(parsed)) {
                    return parsed.map(item => {
                        let targetId = null;
                        let qteVal = 1;
                        let uniteVal = 'g';

                        if (typeof item === 'object' && item !== null) {
                            targetId = item.id || item.ingredient_id || item.ingredientId;
                            qteVal = parseFloat(item.quantite || item.qte || item.quantity || 1);
                            uniteVal = item.unite || item.unit || 'g';
                        } else {
                            targetId = item;
                        }

                        const ingObj = ingredientsGlobal.find(i => i.id == targetId);
                        let nomIng = ingObj ? ingObj.nom : `Ingrédient #${targetId}`;

                        return {
                            id: targetId,
                            nom: nomIng,
                            quantite: qteVal,
                            unite: uniteVal,
                            quantiteBase: convertirEnGrammeOuUnite(qteVal, uniteVal)
                        };
                    });
                }
            } catch(e) {
                console.error("Erreur lors du traitement des ingrédients Supabase :", e);
            }
            return parsedList;
        }

        function trouverRecettes() {
            const container = document.getElementById('resultats-recettes');
            const profilId = getProfilActifId();
            const frigoBrut = (profilId && stockFrigoParProfil[profilId]) ? stockFrigoParProfil[profilId] : {};

            console.log("Frigo brut pour profil", profilId, ":", frigoBrut);
            console.log("Recettes globales chargées :", recettesGlobal.length);

            if (Object.keys(frigoBrut).length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic bg-white p-4 rounded-2xl border border-slate-200 text-center">Veuillez d'abord ajouter des ingrédients dans votre frigo !</p>`;
                return;
            }

            let frigoNormalise = {};
            Object.keys(frigoBrut).forEach(ingId => {
                const item = frigoBrut[ingId];
                const qte = typeof item === 'object' ? item.qte : item;
                const unite = typeof item === 'object' ? item.unite : 'g';
                frigoNormalise[ingId] = convertirEnGrammeOuUnite(qte, unite);
            });

            let recettesAnalysees = [];

            recettesGlobal.forEach(recette => {
                const listeIngsParsed = analyserIngredientsRecette(recette.ingredients);
                console.log(`Recette "${recette.nom}" - Ingrédients analysés :`, listeIngsParsed);

                if (listeIngsParsed.length === 0) return;

                let manquant = [];

                listeIngsParsed.forEach(ingR => {
                    let stockDispoBase = 0;
                    
                    if (ingR.id && frigoNormalise[ingR.id] !== undefined) {
                        stockDispoBase = frigoNormalise[ingR.id];
                    } else {
                        const matchingFrigoId = Object.keys(frigoBrut).find(fId => {
                            const gIng = ingredientsGlobal.find(i => i.id == fId);
                            if (!gIng || !gIng.nom || !ingR.nom) return false;
                            const nomFrigo = gIng.nom.toLowerCase().trim().replace(/s$/, '');
                            const nomRecette = ingR.nom.toLowerCase().trim().replace(/s$/, '');
                            return nomFrigo === nomRecette;
                        });
                        if (matchingFrigoId) {
                            stockDispoBase = frigoNormalise[matchingFrigoId];
                        }
                    }

                    if (stockDispoBase < ingR.quantiteBase) {
                        const ratio = ingR.quantiteBase > 0 ? (ingR.quantite / ingR.quantiteBase) : 1;
                        manquant.push({
                            nom: ingR.nom,
                            besoin: `${ingR.quantite} ${ingR.unite}`,
                            reste: stockDispoBase > 0 ? `${(stockDispoBase * ratio).toFixed(1)} ${ingR.unite}` : '0'
                        });
                    }
                });

                if (manquant.length <= 4) {
                    const nbAchats = manquant.length;
                    const faisable = (nbAchats === 0);
                    recettesAnalysees.push({
                        ...recette,
                        faisable,
                        nbAchats,
                        manquant,
                        ingredientsRecetteParsed: listeIngsParsed
                    });
                }
            });

            recettesAnalysees.sort((a, b) => a.nbAchats - b.nbAchats);
            console.log("Recettes analysées retenues :", recettesAnalysees);

            if (recettesAnalysees.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 italic bg-white p-4 rounded-2xl border border-slate-200 text-center">Aucune recette ne correspond (nécessite trop d'achats ou stock insuffisant).</p>`;
                return;
            }

            container.innerHTML = recettesAnalysees.map(r => {
                let badgeColor = r.faisable ? "bg-emerald-100 text-emerald-800 border-emerald-300" : "bg-amber-100 text-amber-800 border-amber-300";
                let badgeText = r.faisable ? "✅ 0 achat nécessaire (Parfait !)" : `⚠️ ${r.nbAchats} achat(s) nécessaire(s)`;

                let detailsManquants = r.manquant.length > 0 ? `
                    <div class="mt-2 text-[11px] text-slate-500 border-t border-slate-100 pt-2 space-y-1">
                        <span class="font-bold text-rose-600">Il te manque :</span>
                        <ul class="list-disc list-inside space-y-0.5">
                            ${r.manquant.map(m => `<li><b>${m.nom}</b> (Besoin : ${m.besoin}, En stock : ${m.reste})</li>`).join('')}
                        </ul>
                    </div>
                ` : `<p class="mt-2 text-[11px] text-emerald-700 font-bold">Tu as tout ce qu'il faut en quantité suffisante !</p>`;

                let listeIngs = r.ingredientsRecetteParsed.map(i => `<li>${i.nom} : ${i.quantite} ${i.unite}</li>`).join('');

                return `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3 text-xs">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="font-bold text-sm text-blue-900">${r.nom}</h3>
                            <span class="px-2.5 py-1 rounded-xl border text-[10px] font-bold ${badgeColor} whitespace-nowrap">${badgeText}</span>
                        </div>
                        <div class="text-slate-600 space-y-1">
                            <span class="font-bold text-slate-700">Ingrédients :</span>
                            <ul class="list-disc list-inside text-slate-500 max-h-24 overflow-y-auto space-y-0.5">${listeIngs || '<li>Aucun ingrédient spécifié</li>'}</ul>
                        </div>
                        ${detailsManquants}
                    </div>
                `;
            }).join('');
        }

        function sauvegarderStockStocke() {
            localStorage.setItem('stock_frigo_par_profil', JSON.stringify(stockFrigoParProfil));
        }

        function chargerStockStocke() {
            const stock = localStorage.getItem('stock_frigo_par_profil');
            if (stock) {
                try { stockFrigoParProfil = JSON.parse(stock); } catch(e) { stockFrigoParProfil = {}; }
            }
        }

        init();
    </script>
</body>
</html>
