<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - Frigomalin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-emerald-50 to-orange-50 flex flex-col items-center justify-center min-h-screen p-4">

    <!-- En-tête coloré avec emojis nourriture & sport -->
    <div class="text-center mb-6 space-y-2">
        <div class="text-3xl tracking-wider select-none">
            🍎 🥑 🏋️‍♂️ 🥗 🚴‍♀️ 🥦 ⚽ 🍳
        </div>
        <h1 class="text-4xl md:text-5xl font-black tracking-tight bg-gradient-to-r from-blue-600 via-emerald-600 to-orange-500 bg-clip-text text-transparent drop-shadow-sm">
            FRIGOMALIN
        </h1>
        <div class="text-3xl tracking-wider select-none">
            🥑 🏃‍♂️ 🥕 ⛹️ 🍉 🥇 🥪 🏋️‍♀️
        </div>
        <p class="text-xs font-bold text-slate-500 uppercase tracking-widest pt-1">Nutrition, Sport & Anti-Gaspi</p>
    </div>

    <!-- Carte du formulaire -->
    <div class="bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border border-slate-200/80 w-full max-w-sm">
        <h2 id="form-title" class="text-xl font-bold mb-6 text-center text-slate-800">Connexion</h2>
        
        <!-- Formulaire de Connexion -->
        <div id="login-form">
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">E-mail</label>
                <input type="email" id="login-email" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium">
            </div>
            
            <div class="mb-2">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mot de passe</label>
                <input type="password" id="login-mdp" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium">
            </div>

            <!-- Lien Mot de passe oublié -->
            <div class="mb-6 text-right">
                <a href="/forgot.html" class="text-xs text-blue-600 hover:underline font-bold">Mot de passe oublié ?</a>
            </div>

            <!-- Bouton de Connexion -->
            <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-sm transition duration-200 mb-4 shadow-sm cursor-pointer">
                Se connecter
            </button>
            
            <p class="text-center text-xs text-slate-500 font-medium">
                Pas encore de compte ? <a href="#" id="link-toggle-reg" class="text-blue-600 hover:underline font-bold">S'inscrire</a>
            </p>
        </div>

        <!-- Formulaire d'Inscription -->
        <div id="register-form" class="hidden">
            <div class="mb-3">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nom / Pseudo</label>
                <input type="text" id="reg-nom" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium">
            </div>

            <div class="mb-3">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">E-mail</label>
                <input type="email" id="reg-email" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium">
            </div>
            
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mot de passe</label>
                <input type="password" id="reg-mdp" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium">
            </div>

            <!-- Bouton d'Inscription -->
            <button id="btn-register" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm transition duration-200 mb-4 shadow-sm cursor-pointer">
                Créer mon compte
            </button>
            
            <p class="text-center text-xs text-slate-500 font-medium">
                Déjà un compte ? <a href="#" id="link-toggle-log" class="text-blue-600 hover:underline font-bold">Se connecter</a>
            </p>
        </div>
    </div>

    <script>
        const API_URL = '';

        function toggleMode(e) {
            if (e) e.preventDefault();
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const title = document.getElementById('form-title');

            if (loginForm.classList.contains('hidden')) {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                title.innerText = 'Connexion';
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                title.innerText = 'Inscription';
            }
        }

        document.getElementById('link-toggle-reg').addEventListener('click', toggleMode);
        document.getElementById('link-toggle-log').addEventListener('click', toggleMode);

        document.getElementById('btn-login').addEventListener('click', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const mdp = document.getElementById('login-mdp').value;

            if (!email || !mdp) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, mdp })
                });

                const data = await res.json();
                if (res.ok) {
                    window.location.href = `${API_URL}/global.html`;
                } else {
                    alert(data.error || "E-mail ou mot de passe incorrect.");
                }
            } catch (err) {
                alert("Erreur serveur : " + err.message);
            }
        });

        document.getElementById('btn-register').addEventListener('click', async function(e) {
            e.preventDefault();
            const nom = document.getElementById('reg-nom').value;
            const email = document.getElementById('reg-email').value;
            const mdp = document.getElementById('reg-mdp').value;

            if (!nom || !email || !mdp) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/profils`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ nom, email, mdp })
                });

                const data = await res.json();
                if (res.ok) {
                    alert("Compte créé avec succès ! Vous êtes connecté.");
                    window.location.href = `${API_URL}/global.html`;
                } else {
                    alert(data.error || "Erreur lors de la création du compte.");
                }
            } catch (err) {
                alert("Erreur serveur");
            }
        });
    </script>
</body>
</html>
