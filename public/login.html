<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - Application Nutrition</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">
        <h1 id="form-title" class="text-2xl font-bold mb-6 text-center text-slate-800">Connexion</h1>
        
        <!-- Formulaire de Connexion -->
        <div id="login-form">
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-600 mb-1">E-mail</label>
                <input type="email" id="login-email" class="w-full p-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div class="mb-2">
                <label class="block text-sm font-medium text-slate-600 mb-1">Mot de passe</label>
                <input type="password" id="login-mdp" class="w-full p-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Lien Mot de passe oublié -->
            <div class="mb-6 text-right">
                <a href="#" id="link-forgot" class="text-xs text-blue-600 hover:underline font-medium">Mot de passe oublié ?</a>
            </div>

            <!-- Bouton sans onclick HTML -->
            <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl font-bold transition duration-200 mb-4 cursor-pointer">
                Se connecter
            </button>
            
            <p class="text-center text-sm text-slate-500">
                Pas encore de compte ? <a href="#" id="link-toggle-reg" class="text-blue-600 hover:underline font-medium">S'inscrire</a>
            </p>
        </div>

        <!-- Formulaire d'Inscription -->
        <div id="register-form" class="hidden">
            <div class="mb-3">
                <label class="block text-sm font-medium text-slate-600 mb-1">Nom / Pseudo</label>
                <input type="text" id="reg-nom" class="w-full p-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="mb-3">
                <label class="block text-sm font-medium text-slate-600 mb-1">E-mail</label>
                <input type="email" id="reg-email" class="w-full p-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-600 mb-1">Mot de passe</label>
                <input type="password" id="reg-mdp" class="w-full p-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button id="btn-register" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl font-bold transition duration-200 mb-4 cursor-pointer">
                Créer mon compte
            </button>
            
            <p class="text-center text-sm text-slate-500">
                Déjà un compte ? <a href="#" id="link-toggle-log" class="text-blue-600 hover:underline font-medium">Se connecter</a>
            </p>
        </div>
    </div>

    <script>
        function toggleMode(e) {
            if (e) e.preventDefault();
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const title = document.getElementById('form-title');

            if (loginForm.classList.contains('hidden')) {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                title.innerText = 'Connexion';
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                title.innerText = 'Inscription';
            }
        }

        // Écouteurs d'événements propres (pas de rechargement intempestif)
        document.getElementById('link-toggle-reg').addEventListener('click', toggleMode);
        document.getElementById('link-toggle-log').addEventListener('click', toggleMode);

        document.getElementById('link-forgot').addEventListener('click', async function(e) {
            e.preventDefault();
            const emailSaisi = document.getElementById('login-email').value.trim();
            const email = emailSaisi || prompt("Veuillez entrer votre adresse e-mail :");
            
            if (!email) return;

            try {
                const res = await fetch('/api/mot-de-passe-oublie', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (res.ok) {
                    if (data.debug_link) {
                        alert("Demande prise en compte.\n\n[Mode Dev] Lien de réinitialisation :\n" + data.debug_link);
                    } else {
                        alert("Un e-mail de réinitialisation a été envoyé à cette adresse.");
                    }
                } else {
                    alert(data.error || "Une erreur est survenue.");
                }
            } catch (err) {
                alert("Erreur de connexion au serveur.");
            }
        });

        document.getElementById('btn-login').addEventListener('click', async function(e) {
            e.preventDefault();
            console.log("=== CLIC SUR CONNEXION SÉCURISÉ ===");

            const email = document.getElementById('login-email').value;
            const mdp = document.getElementById('login-mdp').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, mdp })
                });

                const data = await res.json();
                console.log("Réponse reçue :", data);

                if (res.ok) {
                    window.location.href = '/index.html';
                } else {
                    alert(data.error || "Erreur de connexion");
                }
            } catch (err) {
                console.error("Erreur :", err);
                alert("Erreur serveur : " + err.message);
            }
        });

        document.getElementById('btn-register').addEventListener('click', async function(e) {
            e.preventDefault();
            const nom = document.getElementById('reg-nom').value;
            const email = document.getElementById('reg-email').value;
            const mdp = document.getElementById('reg-mdp').value;

            if (!nom || !email || !mdp) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            try {
                const res = await fetch('/api/profils', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ nom, email, mdp })
                });

                const data = await res.json();
                if (res.ok) {
                    alert("Compte créé avec succès ! Connectez-vous maintenant.");
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-mdp').value = mdp;
                    toggleMode();
                } else {
                    alert(data.error || "Erreur lors de la création du compte.");
                }
            } catch (err) {
                alert("Erreur serveur");
            }
        });
    </script>
</body>
</html>
