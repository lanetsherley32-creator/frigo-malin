<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de Courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4">
        
        <!-- Navigation Mobile Friendly identique aux autres pages -->
        <header class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🛒 Liste de Courses</h1>
            <nav class="grid grid-cols-5 gap-1 text-center text-xs font-medium">
                <a href="index.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="courses.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Courses</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
            </nav>
        </header>

        <!-- Actions / Génération style carte moderne -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-slate-700 text-sm">⚡ Actions rapides</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                <button onclick="genererCourses()" class="w-full bg-blue-600 active:bg-blue-700 text-white p-3 rounded-xl font-bold shadow-sm flex items-center justify-center gap-2">
                    🔄 Générer depuis le Menu
                </button>
                <button onclick="viderCourses()" class="w-full bg-rose-50 active:bg-rose-100 text-rose-600 border border-rose-200 p-3 rounded-xl font-bold flex items-center justify-center gap-2">
                    🗑️ Vider toute la liste
                </button>
            </div>
        </section>

        <!-- Liste des Articles -->
        <section class="space-y-3">
            <h2 class="font-bold text-slate-700 text-sm">📋 Articles à acheter</h2>
            <div id="liste-courses-container" class="space-y-2">
                <p class="text-slate-400 italic text-xs bg-white p-4 rounded-2xl border border-slate-200 text-center">Chargement de la liste de courses...</p>
            </div>
        </section>
    </div>

    <script>
        const socket = io();

        async function init() {
            chargerCourses();
        }

        async function chargerCourses() {
            try {
                const res = await fetch('/api/courses');
                const courses = await res.json();
                renderCourses(courses);
            } catch (err) {
                console.error("Erreur de chargement des courses", err);
            }
        }

        function renderCourses(courses) {
            const container = document.getElementById('liste-courses-container');
            if (!courses || courses.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic text-xs bg-white p-4 rounded-2xl border border-slate-200 text-center">Votre liste de courses est vide. Cliquez sur "Générer depuis le Menu".</p>`;
                return;
            }

            container.innerHTML = courses.map(item => `
                <div class="bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between gap-3 text-xs transition-all">
                    <label class="flex items-center gap-3 flex-1 cursor-pointer select-none">
                        <input type="checkbox" ${item.achete ? 'checked' : ''} onchange="toggleAchete(${item.id}, this.checked)" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                        <span class="font-bold text-slate-800 text-sm ${item.achete ? 'line-through text-slate-400' : ''}">${item.nom}</span>
                    </label>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-xl border border-blue-100 whitespace-nowrap">${item.quantite} ${item.unite || ''}</span>
                        <button onclick="supprimerItem(${item.id})" class="bg-rose-50 active:bg-rose-100 text-rose-600 p-2 rounded-xl font-bold border border-rose-200">✕</button>
                    </div>
                </div>
            `).join('');
        }

        async function toggleAchete(id, achete) {
            await fetch(`/api/courses/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ achete })
            });
            chargerCourses();
        }

        async function genererCourses() {
            const res = await fetch('/api/courses/generer', { method: 'POST' });
            if (res.ok) {
                chargerCourses();
            } else {
                alert("Erreur lors de la génération de la liste.");
            }
        }

        async function viderCourses() {
            if (confirm("Voulez-vous vraiment vider toute la liste de courses ?")) {
                await fetch('/api/courses', { method: 'DELETE' });
                chargerCourses();
            }
        }

        async function supprimerItem(id) {
            await fetch(`/api/courses/${id}`, { method: 'DELETE' });
            chargerCourses();
        }

        socket.on('data_updated', chargerCourses);
        init();
    </script>
</body>
</html>
