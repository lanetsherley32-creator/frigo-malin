<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de Courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4">
        <header class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 print:hidden">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🛒 Liste de Courses</h1>
                <div class="flex items-center gap-2">
                    <select id="select-profil" onchange="chargerCourses()" class="bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-xl text-xs font-bold text-blue-600">
                        <option value="">Chargement...</option>
                    </select>
                    <button onclick="telechargerPDF()" class="bg-emerald-600 active:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm">📥 PDF</button>
                </div>
            </div>
            <nav class="grid grid-cols-5 gap-1 text-center text-[11px] font-medium">
                <a href="index.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="courses.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Courses</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
            </nav>
        </header>

        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4 print:hidden">
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
                    <input type="checkbox" id="check-deja" onchange="chargerCourses()" class="w-4 h-4 rounded text-blue-600">
                    Inclure "Ce que j'ai déjà" (Frigo) dans la liste
                </label>
            </div>
            <div class="space-y-1.5">
                <label class="text-[10px] font-bold text-slate-500 uppercase">Optimisation :</label>
                <select id="select-enseigne" onchange="chargerCourses()" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-medium">
                    <option value="toutes">Toutes les enseignes</option>
                    <option value="meilleur_prix">⚡ Meilleur prix global (par article)</option>
                    <option value="Leclerc">Leclerc</option>
                    <option value="Carrefour">Carrefour</option>
                    <option value="Lidl">Lidl</option>
                </select>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
                <button onclick="genererCourses()" class="bg-blue-600 text-white p-3 rounded-xl font-bold text-xs shadow-sm">🔄 Générer depuis le Menu</button>
                <button onclick="viderCourses()" class="bg-rose-50 text-rose-600 border border-rose-200 p-3 rounded-xl font-bold text-xs">🗑️ Vider la liste</button>
            </div>
        </section>

        <div id="pdf-container" class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
            <div id="total-affichage" class="text-xs font-bold text-slate-600 px-1 mb-4"></div>
            <div id="liste-courses-container" class="space-y-4"></div>
        </div>
    </div>
    <script>
        const socket = io();
        let ingredientsRefCache = [];

        async function init() {
            const [resProfils, resIngs] = await Promise.all([fetch('/api/profils'), fetch('/api/ingredients')]);
            const profils = await resProfils.json();
            ingredientsRefCache = await resIngs.json();
            const select = document.getElementById('select-profil');
            select.innerHTML = profils.map(p => `<option value="${p.nom}">${p.nom}</option>`).join('');
            chargerCourses();
        }

        async function chargerCourses() {
            const enseigne = document.getElementById('select-enseigne').value;
            const inclureDeja = document.getElementById('check-deja').checked;
            const profil = document.getElementById('select-profil').value;
            if (!profil) return;

            const res = await fetch(`/api/courses?enseigne=${enseigne}&inclureDeja=${inclureDeja}&profil=${encodeURIComponent(profil)}`);
            const courses = await res.json();
            renderCourses(courses);
        }

        function renderCourses(courses) {
            const container = document.getElementById('liste-courses-container');
            console.log("Données reçues pour affichage :", courses);

            if (!courses || courses.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Aucune course pour le moment.</p>`;
                return;
            }
            
            container.innerHTML = courses.map(c => `
                <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                    <label class="flex items-center gap-2 text-xs font-medium text-slate-700 cursor-pointer">
                        <input type="checkbox" ${c.coche === 1 ? 'checked' : ''} onchange="toggleCoche(${c.id}, this.checked)" class="w-4 h-4 rounded text-blue-600">
                        <span class="${c.coche === 1 ? 'line-through text-slate-400' : ''}">
                            ${c.nom} ${c.quantite_necessaire ? '(' + c.quantite_necessaire + ' ' + (c.unite || 'g') + ')' : ''}
                        </span>
                    </label>
                    <span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md">${c.rayon || 'Épicerie'}</span>
                </div>
            `).join('');
        }

        async function toggleCoche(id, coche) {
            await fetch(`/api/courses/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ coche: coche ? 1 : 0 })
            });
        }

        async function genererCourses() {
            const profil = document.getElementById('select-profil').value;
            if (!profil) {
                alert("Veuillez sélectionner un profil.");
                return;
            }

            try {
                const response = await fetch('/api/courses/generer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profil })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(data.message || "Liste générée avec succès !");
                    // Délai de sécurité pour laisser le temps à SQLite d'écrire et éviter un affichage vide
                    setTimeout(() => {
                        chargerCourses();
                    }, 300);
                } else {
                    alert("Erreur : " + (data.error || "Impossible de générer la liste"));
                }
            } catch (err) {
                console.error("Erreur réseau :", err);
                alert("Erreur de communication avec le serveur.");
            }
        }

        async function viderCourses() {
            const profil = document.getElementById('select-profil').value;
            if (!profil) return;
            if (!confirm("Voulez-vous vraiment vider toute la liste de courses ?")) return;

            const res = await fetch(`/api/courses?profil=${encodeURIComponent(profil)}`);
            const courses = await res.json();
            
            for (let c of courses) {
                await fetch(`/api/courses/${c.id}`, { method: 'DELETE' });
            }
            chargerCourses();
        }

        function telechargerPDF() {
            const element = document.getElementById('pdf-container');
            html2pdf().from(element).save('liste-de-courses.pdf');
        }

        socket.on('data_updated', chargerCourses);
        init();
    </script>
</body>
</html>
