<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de Courses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
    <div class="max-w-4xl mx-auto p-3 sm:p-6 space-y-4">
        
        <!-- Navigation Mobile Friendly -->
        <header class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🛒 Liste de Courses</h1>
                <!-- Sélecteur de profil dynamique relié aux profils créés -->
                <div class="flex items-center gap-1.5">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Profil :</span>
                    <select id="select-profil" onchange="changerProfil()" class="bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-xl text-xs font-bold text-blue-600">
                        <option value="">Chargement...</option>
                    </select>
                </div>
            </div>
            <nav class="grid grid-cols-6 gap-1 text-center text-[11px] font-medium">
                <a href="index.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Menu</a>
                <a href="semaine.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">📅 Semaine</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="courses.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Courses</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
            </nav>
        </header>

        <!-- Formulaire et Options -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            
            <!-- Ajout manuel d'un article à la volée -->
            <div class="space-y-1.5">
                <label class="text-[10px] font-bold text-slate-500 uppercase">Ajouter un article à la volée :</label>
                <div class="flex gap-2">
                    <input type="text" id="ajout-nom" placeholder="Ex: Lait, PQ, Beurre..." class="flex-1 bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-medium">
                    <input type="number" step="any" id="ajout-prix" placeholder="Prix (€)" class="w-20 bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-medium">
                    <button onclick="ajouterArticleManuel()" class="bg-emerald-600 active:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow-sm">Ajouter</button>
                </div>
            </div>

            <!-- Choix d'enseignes & Option "Ce que j'ai déjà" -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-100">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Choix d'enseignes :</label>
                    <select id="select-enseigne" onchange="chargerCourses()" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-medium mt-1">
                        <option value="toutes">Toutes les enseignes</option>
                        <option value="Leclerc">Leclerc</option>
                        <option value="Carrefour">Carrefour</option>
                        <option value="Lidl">Lidl</option>
                    </select>
                </div>
                <div class="flex items-center pt-4">
                    <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
                        <input type="checkbox" id="check-deja" onchange="chargerCourses()" class="w-4 h-4 rounded text-blue-600">
                        Inclure "Ce que j'ai déjà"
                    </label>
                </div>
            </div>
            
            <!-- Boutons de génération / vidage -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs pt-2">
                <button onclick="genererCourses()" class="w-full bg-blue-600 active:bg-blue-700 text-white p-3 rounded-xl font-bold shadow-sm">🔄 Générer depuis le Menu</button>
                <button onclick="viderCourses()" class="w-full bg-rose-50 active:bg-rose-100 text-rose-600 border border-rose-200 p-3 rounded-xl font-bold">🗑️ Vider la liste</button>
            </div>
        </section>

        <!-- Total estimé -->
        <div id="total-affichage" class="text-xs font-bold text-slate-600 px-2"></div>

        <!-- Liste triée par rayons -->
        <section class="space-y-4">
            <div id="liste-courses-container" class="space-y-4">
                <p class="text-slate-400 italic text-xs bg-white p-4 rounded-2xl border border-slate-200 text-center">Chargement de la liste...</p>
            </div>
        </section>
    </div>

    <script>
        const socket = io();

        function getProfilActuel() {
            return document.getElementById('select-profil').value;
        }

        function changerProfil() {
            localStorage.setItem('profil_actif', getProfilActuel());
            chargerCourses();
        }

        async function init() {
            try {
                const resProfils = await fetch('/api/profils');
                const profils = await resProfils.json();
                
                const select = document.getElementById('select-profil');
                const saved = localStorage.getItem('profil_actif');

                select.innerHTML = profils.map(p => `<option value="${p.nom}">${p.nom}</option>`).join('');

                if (saved && profils.some(p => p.nom === saved)) {
                    select.value = saved;
                } else if (profils.length > 0) {
                    select.value = profils[0].nom;
                    localStorage.setItem('profil_actif', select.value);
                }

                chargerCourses();
            } catch (err) {
                console.error("Erreur chargement profils", err);
            }
        }

        async function chargerCourses() {
            const enseigne = document.getElementById('select-enseigne').value;
            const inclureDeja = document.getElementById('check-deja').checked;
            const profil = getProfilActuel();
            
            if (!profil) return;

            try {
                const res = await fetch(`/api/courses?enseigne=${enseigne}&inclureDeja=${inclureDeja}&profil=${encodeURIComponent(profil)}`);
                const courses = await res.json();
                renderCourses(courses);
            } catch (err) {
                console.error("Erreur de chargement", err);
            }
        }

        function renderCourses(courses) {
            const container = document.getElementById('liste-courses-container');
            
            if (!courses || courses.length === 0) {
                document.getElementById('total-affichage').innerText = '';
                container.innerHTML = `<p class="text-slate-400 italic text-xs bg-white p-4 rounded-2xl border border-slate-200 text-center">Votre liste de courses est vide pour ce profil.</p>`;
                return;
            }

            const total = courses.reduce((sum, item) => sum + (parseFloat(item.prix || 0) * (parseFloat(item.quantite) || 1)), 0);
            document.getElementById('total-affichage').innerText = `💰 Total estimé : ${total.toFixed(2)}€ (${courses.length} articles)`;

            const groupes = courses.reduce((acc, item) => {
                const rayon = item.rayon || "Divers / Autres";
                if (!acc[rayon]) acc[rayon] = [];
                acc[rayon].push(item);
                return acc;
            }, {});

            container.innerHTML = Object.keys(groupes).map(rayon => `
                <div class="space-y-2">
                    <h3 class="text-[11px] font-bold text-slate-500 uppercase px-1 tracking-wider">📌 ${rayon}</h3>
                    <div class="space-y-2">
                        ${groupes[rayon].map(item => `
                            <div class="bg-white border border-slate-200 p-3.5 rounded-2xl shadow-sm flex items-center justify-between gap-3 text-xs">
                                <label class="flex items-center gap-3 flex-1 cursor-pointer select-none">
                                    <input type="checkbox" ${item.achete ? 'checked' : ''} onchange="toggleAchete(${item.id}, this.checked)" class="w-5 h-5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                                    <span class="font-bold text-slate-800 text-sm ${item.achete ? 'line-through text-slate-400' : ''}">${item.nom}</span>
                                </label>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-xl border border-blue-100 whitespace-nowrap">${item.quantite || 1} ${item.unite || ''}</span>
                                    <span class="font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-xl border border-emerald-100 whitespace-nowrap">${item.prix ? item.prix + '€' : '0€'}</span>
                                    <button onclick="supprimerItem(${item.id})" class="bg-rose-50 active:bg-rose-100 text-rose-600 p-2 rounded-xl font-bold border border-rose-200">✕</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function ajouterArticleManuel() {
            const nom = document.getElementById('ajout-nom').value.trim();
            const prix = parseFloat(document.getElementById('ajout-prix').value) || 0;
            const profil = getProfilActuel();
            
            if(!nom) {
                alert("Veuillez saisir un nom d'article.");
                return;
            }

            await fetch('/api/courses', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nom, prix, quantite: 1, unite: 'unité', rayon: 'Divers / Autres', profil })
            });

            document.getElementById('ajout-nom').value = '';
            document.getElementById('ajout-prix').value = '';
            chargerCourses();
        }

        async function toggleAchete(id, achete) {
            await fetch(`/api/courses/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ achete })
            });
            chargerCourses();
        }

        async function genererCourses() {
            const profil = getProfilActuel();
            const res = await fetch('/api/courses/generer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ profil })
            });
            if (res.ok) chargerCourses();
        }

        async function viderCourses() {
            const profil = getProfilActuel();
            if (confirm(`Voulez-vous vider toute la liste de courses pour le profil ${profil} ?`)) {
                await fetch(`/api/courses?profil=${encodeURIComponent(profil)}`, { method: 'DELETE' });
                chargerCourses();
            }
        }

        async function supprimerItem(id) {
            await fetch(`/api/courses/${id}`, { method: 'DELETE' });
            chargerCourses();
        }

        socket.on('data_updated', init);
        init();
    </script>
</body>
</html>
