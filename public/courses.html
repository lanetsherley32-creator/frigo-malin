<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de Courses - Frigomalin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-50 min-h-screen pb-12 text-slate-800">
    <div class="max-w-4xl mx-auto p-4 space-y-4">
        
        <!-- En-tête & Navigation -->
        <header class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 print:hidden">
            
            <!-- Compte Connecté et Déconnexion en haut -->
            <div class="flex justify-between items-center text-xs pb-3 border-b border-slate-100">
                <span id="nom-utilisateur-connecte" class="font-bold text-slate-700">👤 Chargement du compte...</span>
                <button onclick="deconnexion()" class="text-red-500 hover:text-red-700 font-bold">Se déconnecter</button>
            </div>

            <!-- Titre et Actions principales -->
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">🛒 Liste de Courses</h1>
                <div class="flex items-center gap-2">
                    <select id="select-profil" onchange="chargerCourses()" class="bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold text-blue-600 outline-none">
                        <option value="">Chargement...</option>
                    </select>
                    <button onclick="telechargerPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-all">📥 PDF</button>
                </div>
            </div>
            
            <!-- Navigation harmonisée sur 7 colonnes -->
            <nav class="grid grid-cols-7 gap-1 text-center text-[11px] font-medium pt-1">
                <a href="global.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Mon compte</a>
                <a href="planification.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Planification</a>
                <a href="suivi.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Suivi</a>
                <a href="recettes.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Recettes</a>
                <a href="ingredients.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Ingrédients</a>
                <a href="vider-frigo.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Frigo</a>
                <a href="courses.html" class="p-2 rounded-xl bg-blue-600 text-white font-bold shadow-sm">Courses</a>
                <a href="favori.html" class="p-2 rounded-xl bg-slate-50 text-slate-600 hover:bg-slate-100">Favori</a>
            </nav>
        </header>

        <!-- Filtres et Options -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3 print:hidden text-xs">
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                <label class="flex items-center gap-2 cursor-pointer font-bold text-slate-700">
                    <input type="checkbox" id="check-deja" onchange="chargerCourses()" class="w-4 h-4 rounded text-blue-600">
                    Inclure "Ce que j'ai déjà" (Frigo) dans la liste
                </label>
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Optimisation par Magasin :</label>
                <select id="select-enseigne" onchange="chargerCourses()" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl font-medium">
                    <option value="toutes">Toutes les enseignes</option>
                    <option value="meilleur_prix">⚡ Meilleur prix global (par article)</option>
                    <option value="Leclerc">Leclerc</option>
                    <option value="Carrefour">Carrefour</option>
                    <option value="Lidl">Lidl</option>
                </select>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                <button onclick="genererCourses()" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl font-bold text-xs shadow-sm transition-all">
                    🔄 Générer depuis le Menu Prévu
                </button>
                <button onclick="viderCourses()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 p-3 rounded-xl font-bold text-xs transition-all">
                    🗑️ Vider la liste
                </button>
            </div>
        </section>

        <!-- Container Imprimable / PDF -->
        <div id="pdf-container" class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
            <div id="total-affichage" class="text-xs font-bold text-slate-700 px-1 mb-3 pb-2 border-b border-slate-100 flex justify-between items-center">
                <span>Total estimé : <strong id="montant-total" class="text-emerald-600">0.00 €</strong></span>
                <span id="nb-articles" class="text-slate-400 font-normal">0 article(s)</span>
            </div>
            <div id="liste-courses-container" class="space-y-2">
                <!-- Rempli dynamiquement -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const socket = io();
        let ingredientsRefCache = [];

        document.addEventListener("DOMContentLoaded", () => {
            chargerInfosUtilisateur();
            init();
        });

        async function chargerInfosUtilisateur() {
            try {
                const res = await fetch('/api/current-user');
                if (res.ok) {
                    const user = await res.json();
                    const element = document.getElementById('nom-utilisateur-connecte');
                    if (element) element.innerText = `👤 Compte : ${user.nom} (${user.email})`;
                } else {
                    window.location.href = '/login.html';
                }
            } catch (e) {
                console.error("Erreur chargement utilisateur", e);
            }
        }

        async function deconnexion() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        async function init() {
            try {
                const [resProfils, resIngs] = await Promise.all([
                    fetch('/api/personnes-objectifs'), 
                    fetch('/api/ingredients')
                ]);
                const profils = await resProfils.json();
                ingredientsRefCache = await resIngs.json();
                
                const select = document.getElementById('select-profil');
                if (!select) return;

                select.innerHTML = '';
                if (profils.length === 0) {
                    select.innerHTML = '<option value="">Aucun profil disponible</option>';
                    return;
                }

                select.innerHTML = profils.map(p => `<option value="${p.nom}">${p.nom}</option>`).join('');
                
                const savedProfil = localStorage.getItem('profilActif') || localStorage.getItem('profil_actif');
                if (savedProfil && profils.some(p => p.nom === savedProfil)) {
                    select.value = savedProfil;
                } else if (profils.length > 0) {
                    select.value = profils[0].nom;
                    localStorage.setItem('profilActif', profils[0].nom);
                }
                
                chargerCourses();
            } catch (err) {
                console.error("Erreur d'initialisation", err);
            }
        }

        async function chargerCourses() {
            const enseigne = document.getElementById('select-enseigne')?.value || 'toutes';
            const inclureDeja = document.getElementById('check-deja')?.checked || false;
            const selectProfil = document.getElementById('select-profil');
            const profil = selectProfil ? selectProfil.value : '';
            if (!profil) return;

            localStorage.setItem('profilActif', profil);

            try {
                const res = await fetch(`/api/courses?enseigne=${enseigne}&inclureDeja=${inclureDeja}&profil=${encodeURIComponent(profil)}`);
                const courses = await res.json();
                renderCourses(courses);
            } catch(e) {
                console.error("Erreur lors du chargement de la liste de courses", e);
            }
        }

        function renderCourses(courses) {
            const container = document.getElementById('liste-courses-container');
            const totalEles = document.getElementById('montant-total');
            const countEle = document.getElementById('nb-articles');

            if (!courses || courses.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6 italic">Votre liste de courses est vide pour le moment.</p>`;
                if (totalEles) totalEles.innerText = "0.00 €";
                if (countEle) countEle.innerText = "0 article";
                return;
            }

            let cumulPrix = 0;

            container.innerHTML = courses.map(c => {
                const estCoche = c.coche === 1;
                
                // Extraction et parsing des marques disponibles
                let marquesDispos = [];
                try {
                    marquesDispos = typeof c.marques_disponibles === 'string' ? JSON.parse(c.marques_disponibles) : (c.marques_disponibles || []);
                } catch(e) { marquesDispos = []; }

                // Trouver la marque active actuelle pour récupérer son prix unitaire et le format du paquet
                let prixUnitaire = parseFloat(c.prix || 0);
                let formatPaquet = parseFloat(c.format_paquet || c.contenance || c.poids_format || 1);
                if (isNaN(formatPaquet) || formatPaquet <= 0) formatPaquet = 1;

                if (c.marque && marquesDispos.length > 0) {
                    const mActive = marquesDispos.find(m => m.nom === c.marque);
                    if (mActive) {
                        prixUnitaire = parseFloat(mActive.prix || mActive.cout || prixUnitaire);
                        if (mActive.format || mActive.contenance) {
                            formatPaquet = parseFloat(mActive.format || mActive.contenance) || formatPaquet;
                        }
                    }
                }

                // Calcul quantité nécessaire vs format paquet (ex: 300g nécessaires, paquet de 400g => 1 paquet)
                const besoinTotal = parseFloat(c.quantite_necessaire || c.besoin || 1);
                const unite = (c.unite || 'g').toLowerCase();
                
                // Si l'unité est en grammes ou millilitres, on calcule le nombre de conditionnements nécessaires
                let nbPaquets = c.nb_paquets !== undefined ? parseInt(c.nb_paquets) : null;
                if (!nbPaquets || isNaN(nbPaquets)) {
                    if (unite === 'g' || unite === 'ml' || unite === 'cl' || unite === 'kg') {
                        let besoinNormalise = besoinTotal;
                        let formatNormalise = formatPaquet;
                        if (unite === 'kg') besoinNormalise *= 1000;
                        if (formatPaquet && formatNormalise > 0) {
                            nbPaquets = Math.ceil(besoinNormalise / formatNormalise);
                        } else {
                            nbPaquets = 1;
                        }
                    } else {
                        nbPaquets = Math.ceil(besoinTotal / (formatPaquet || 1));
                    }
                }
                if (nbPaquets < 1) nbPaquets = 1;

                // Prix total = Prix d'un paquet * nombre de paquets à acheter
                const prixTotalArticle = prixUnitaire * nbPaquets;
                if (!estCoche) cumulPrix += prixTotalArticle;

                // Construction dynamique du menu déroulant des marques
                let optionsHtml = `<option value="Standard" data-prix="${prixUnitaire}" data-format="${formatPaquet}" ${!c.marque || c.marque === 'Standard' ? 'selected' : ''}>Standard (${prixUnitaire.toFixed(2)} € / ${formatPaquet}${c.unite || 'g'})</option>`;
                
                if (marquesDispos.length > 0) {
                    optionsHtml = marquesDispos.map(m => {
                        const mPrix = parseFloat(m.prix || m.cout || 0);
                        const mFormat = parseFloat(m.format || m.contenance || formatPaquet);
                        const estSelectionne = c.marque === m.nom ? 'selected' : '';
                        return `
                            <option value="${m.nom}" data-prix="${mPrix}" data-format="${mFormat}" ${estSelectionne}>
                                ${m.nom} - ${mPrix.toFixed(2)} € (${mFormat} ${c.unite || 'g'})
                            </option>
                        `;
                    }).join('');
                }

                return `
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100 hover:border-slate-200 transition-all text-xs gap-3">
                        <label class="flex items-center gap-2.5 cursor-pointer font-medium text-slate-700 flex-1">
                            <input type="checkbox" ${estCoche ? 'checked' : ''} onchange="toggleCoche(${c.id}, this.checked)" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500">
                            <span id="label-course-${c.id}" class="${estCoche ? 'line-through text-slate-400' : 'text-slate-800'}">
                                <strong>${c.nom}</strong> 
                                <span class="text-slate-500 font-normal">
                                    (Besoin : <strong>${besoinTotal}${c.unite || 'g'}</strong> → À acheter : <strong class="text-blue-600">${nbPaquets} paquet(s)</strong> de ${formatPaquet}${c.unite || 'g'})
                                </span>
                            </span>
                        </label>
                        
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end shrink-0">
                            <!-- Sélecteur de marque -->
                            <select onchange="changerMarqueArticle(${c.id}, this)" class="bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-medium text-slate-700 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                                ${optionsHtml}
                            </select>

                            <!-- Sélecteur direct du nombre de paquets -->
                            <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-lg px-2 py-1">
                                <span class="text-[10px] text-slate-400 font-bold">Qté:</span>
                                <input type="number" min="1" value="${nbPaquets}" onchange="changerNbPaquets(${c.id}, this.value)" class="w-10 text-center font-bold text-blue-600 outline-none text-xs">
                            </div>

                            <span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md font-semibold">${c.rayon || 'Épicerie'}</span>
                        </div>
                    </div>
                `;
            }).join('');

            if (totalEles) totalEles.innerText = `${cumulPrix.toFixed(2)} €`;
            if (countEle) countEle.innerText = `${courses.length} article(s)`;
        }

        async function changerMarqueArticle(id, selectElement) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const marque = selectedOption.value;
            const prix = parseFloat(selectedOption.getAttribute('data-prix')) || 0;
            const formatPaquet = parseFloat(selectedOption.getAttribute('data-format')) || 1;

            try {
                await fetch('/api/courses/changer-marque', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, marque, prix, format_paquet: formatPaquet })
                });
                chargerCourses();
            } catch(e) {
                console.error("Erreur lors du changement de marque", e);
            }
        }

        async function changerNbPaquets(id, nbPaquets) {
            const qte = parseInt(nbPaquets) || 1;
            try {
                await fetch('/api/courses/changer-quantite-paquets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, nb_paquets: qte })
                });
                chargerCourses();
            } catch(e) {
                console.error("Erreur lors de la modification du nombre de paquets", e);
            }
        }

        async function toggleCoche(id, coche) {
            try {
                await fetch(`/api/courses/cocher`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, coche: coche ? 1 : 0 })
                });
                chargerCourses();
            } catch(e) {
                console.error("Erreur lors de la modification du statut", e);
            }
        }

        async function genererCourses() {
            const profil = document.getElementById('select-profil').value;
            if (!profil) {
                alert("Veuillez sélectionner un profil.");
                return;
            }

            try {
                const response = await fetch('/api/courses/generer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profil })
                });
                if (response.ok) {
                    alert("Liste de courses générée avec succès !");
                    chargerCourses();
                } else {
                    alert("Erreur lors de la génération de la liste.");
                }
            } catch (err) {
                console.error("Erreur réseau :", err);
                alert("Erreur de communication avec le serveur.");
            }
        }

        async function viderCourses() {
            const profil = document.getElementById('select-profil').value;
            if (!profil) return;
            if (!confirm("Voulez-vous vraiment vider toute la liste de courses ?")) return;

            try {
                await fetch(`/api/courses?profil=${encodeURIComponent(profil)}`, { method: 'DELETE' });
                chargerCourses();
            } catch(e) {
                alert("Erreur lors de la suppression.");
            }
        }

        function telechargerPDF() {
            const element = document.getElementById('pdf-container');
            const opt = {
                margin:       10,
                filename:     'liste-de-courses.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        socket.on('data_updated', chargerCourses);
    </script>
</body>
</html>
